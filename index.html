/* ============ KACHEL-KOLLISION ============
   Bisher waren die Hindernisse frei liegende Rechtecke – 93% davon lagen
   nicht auf dem Raster, wodurch je nach Anlaufrichtung bis zu 7px
   zusätzliche Lücke entstand. Jetzt wird pro Szene einmal ausgerechnet,
   welche KACHELN belegt sind. Eine Kachel gilt als blockiert, sobald ein
   Hindernis genug von ihr überdeckt – so ist der Kollider exakt kachelförmig
   und der Abstand immer gleich, egal aus welcher Richtung man kommt. */
/* Eine Kachel ist dicht, sobald ein Hindernis sie überhaupt berührt.
   Vorher galt eine 30%-Schwelle – kleine Dinge wie Bäume oder Stümpfe
   (8x8 Pixel = 25% einer Kachel) sperrten dadurch GAR NICHTS, und man
   lief mitten durch sie hindurch. Da die Boxen jetzt ohnehin auf ganze
   Kacheln aufgezogen werden, ist jede Berührung eine volle Kachel. */
const KACHEL_DECKUNG = 0.02;
const kachelSperren = {};         // Szene -> Set aus "tx,ty"
function baueKachelSperren(szene, liste, breiteKacheln, hoeheKacheln){
  const sperre = new Set();
  const flaeche = TILE*TILE*KACHEL_DECKUNG;
  for(const s of liste){
    const tx0 = Math.floor(s.x/TILE), tx1 = Math.floor((s.x+s.w-0.01)/TILE);
    const ty0 = Math.floor(s.y/TILE), ty1 = Math.floor((s.y+s.h-0.01)/TILE);
    for(let tx=tx0; tx<=tx1; tx++){
      for(let ty=ty0; ty<=ty1; ty++){
        const ueberX = Math.min(s.x+s.w,(tx+1)*TILE) - Math.max(s.x,tx*TILE);
        const ueberY = Math.min(s.y+s.h,(ty+1)*TILE) - Math.max(s.y,ty*TILE);
        if(ueberX*ueberY >= flaeche) sperre.add(tx+','+ty);
      }
    }
  }
  kachelSperren[szene] = sperre;
  return sperre;
}
// Ist diese Kachel in der aktuellen Szene dicht?
function kachelGesperrt(tx,ty){
  const sperre = kachelSperren[state.scene];
  return sperre ? sperre.has(tx+','+ty) : false;
}
// Nach jedem Weltaufbau (und wenn sich Hindernisse ändern) neu berechnen
function alleKachelSperrenBauen(){
  baueKachelSperren('camp',      ohneGeoeffnete(solids.concat(borderWalls)));
  baueKachelSperren('food',      ohneGeoeffnete(foodSolids));
  baueKachelSperren('wald',      ohneGeoeffnete(waldSolids));
  baueKachelSperren('waldstage', ohneGeoeffnete(wstageSolids));
  baueKachelSperren('ownstage',  ohneGeoeffnete(ownstageSolids));
  baueKachelSperren('eingang',   ohneGeoeffnete(eingSolids));
  baueKachelSperren('stage',     ohneGeoeffnete(state.flags.backstageOpen ? stageSolids.filter(s=>!s.gate) : stageSolids));
  baueKachelSperren('tent',      tentSolids.concat(tentObjects.filter(o=>o.solid).map(o=>o.solid)));
}

/* ============ KACHELBELEGUNG DURCH FIGUREN ============
   Bisher prüften Figuren beim Weiterlaufen nur die statische Karte – sie
   liefen dadurch quer durcheinander und durch den Spieler hindurch. Und
   niemand reservierte seine Zielkachel, weshalb zwei Figuren gleichzeitig
   auf dieselbe Kachel ziehen konnten (= sichtbares Durchlaufen).
   Hier zählt beides: wo jemand STEHT und wohin jemand UNTERWEGS ist. */
function alleFigurenDerSzene(){
  const liste = [];
  if(state.scene==='camp'){ for(const w of wanderers) if(w.phase!=='drin') liste.push(w); for(const n of npcs) liste.push(n); }
  else if(state.scene==='wald'){ for(const w of waldWanderers) liste.push(w); }
  else if(state.scene==='food'){
    for(const p of foodCrowd) if(p.scene==='food') liste.push(p);
    for(const r of foodRunners) liste.push(r);
    for(const m of coffee.team) liste.push(m);
    for(const q of coffee.queue) if(!q.istSpieler) liste.push(q);
  }
  else if(state.scene==='waldstage'){ for(const p of foodCrowd) if(p.scene==='waldstage') liste.push(p); }
  else if(state.scene==='stage'){ for(const n of stageNpcs) liste.push(n); }
  return liste;
}
// Welche Kachel belegt eine Figur? Wer läuft, belegt seine ZIELkachel
// (dorthin ist sie unterwegs) – sonst kämen sich zwei entgegen.
function figurKachel(e){
  const z = e.kSchritt ? {x:e.kSchritt.zuX, y:e.kSchritt.zuY}
          : e.schritt  ? {x:e.schritt.zuX,  y:e.schritt.zuY}
          : {x:e.x, y:e.y};
  return kachelVon(z.x, z.y);
}
// Ist die Kachel von einer Figur belegt oder reserviert? 'ausser' wird
// übersprungen (die Figur, die gerade selbst ihren Schritt plant).
function kachelBelegtVonFigur(tx, ty, ausser){
  for(const e of alleFigurenDerSzene()){
    if(e===ausser) continue;
    const k = figurKachel(e);
    if(k.tx===tx && k.ty===ty) return true;
    // Wer gerade läuft, blockiert auch noch seine Ausgangskachel – und zwar
    // die GEMERKTE, nicht die aus der aktuellen Position berechnete: die
    // wandert während des Schritts schon zum Ziel und gäbe die Ausgangs-
    // kachel zu früh frei (dann rückt jemand nach und beide überlappen).
    const s = e.kSchritt || e.schritt;
    if(s && s.vonTx!==undefined){
      if(s.vonTx===tx && s.vonTy===ty) return true;
    } else if(false){
      if(e.rempelVonTx===tx && e.rempelVonTy===ty) return true;
    }
  }
  if(ausser!==player){
    const pk = figurKachel(player);
    if(pk.tx===tx && pk.ty===ty) return true;
    if(player.schritt && player.schritt.vonTx!==undefined){
      if(player.schritt.vonTx===tx && player.schritt.vonTy===ty) return true;
    }
  }
  return false;
}

/* ============ KACHELBEWEGUNG FÜR NPCs ============
   Damit sich das ganze Spiel wie Pokémon anfühlt, laufen auch Passanten
   Kachel für Kachel. npcKachelZiel() bewegt eine Figur auf ein beliebiges
   Weltziel zu – aber nur in vier Richtungen und immer volle Kacheln.
   Gibt true zurück, solange sie unterwegs ist. */
function npcKachelZiel(p, zielX, zielY, speed, dt, blocker){
  // Läuft gerade ein Schritt? Dann diesen zu Ende bringen.
  if(p.kSchritt){
    const s = p.kSchritt;
    s.t += dt;
    const f = Math.min(1, s.t/s.dur);
    p.x = s.vonX + (s.zuX-s.vonX)*f;
    p.y = s.vonY + (s.zuY-s.vonY)*f;
    p.moving = true;
    p.animT += dt; p.frame = Math.floor(p.animT*7)%4;
    if(f>=1){ p.x=s.zuX; p.y=s.zuY; p.kSchritt=null; }
    return true;
  }
  const dx = zielX-p.x, dy = zielY-p.y;
  if(Math.abs(dx) < TILE*0.5 && Math.abs(dy) < TILE*0.5){ p.moving=false; return false; }
  // Steht die Figur neben dem Raster (z.B. gerade aus einem Zelt gekommen),
  // führt der erste Schritt zurück auf die nächste Kachelmitte.
  const eigene = kachelVon(p.x, p.y);
  const mitte = kachelMitte(eigene.tx, eigene.ty);
  if(Math.abs(p.x-mitte.x) > 0.5 || Math.abs(p.y-mitte.y) > 0.5){
    p.kSchritt = { vonX:p.x, vonY:p.y, zuX:mitte.x, zuY:mitte.y, t:0,
                   dur: Math.max(0.06, Math.hypot(mitte.x-p.x, mitte.y-p.y)/Math.max(8,speed)),
                   vonTx:eigene.tx, vonTy:eigene.ty };   // Ausgangskachel auch hier merken
    p.moving = true;
    return true;
  }
  // Dominante Achse zuerst – ergibt treppenförmige, aber natürliche Wege
  let rx=0, ry=0;
  if(Math.abs(dx) > Math.abs(dy)) rx = dx>0?1:-1; else ry = dy>0?1:-1;
  const hier = kachelVon(p.x, p.y);
  const dicht = (tx,ty,bx)=> kachelGesperrt(tx,ty)
    || kachelBelegtVonFigur(tx,ty,p)
    || blocker.some(b=>rectsOverlap(bx,b));
  let ziel = kachelMitte(hier.tx+rx, hier.ty+ry);
  let box = { x:ziel.x-5, y:ziel.y-7, w:10, h:7 };
  if(dicht(hier.tx+rx, hier.ty+ry, box)){
    // Blockiert: die andere Achse probieren, damit niemand hängen bleibt
    if(rx!==0){ rx=0; ry = dy>0?1:(dy<0?-1:1); } else { ry=0; rx = dx>0?1:(dx<0?-1:1); }
    ziel = kachelMitte(hier.tx+rx, hier.ty+ry);
    box = { x:ziel.x-5, y:ziel.y-7, w:10, h:7 };
    if(dicht(hier.tx+rx, hier.ty+ry, box)){ p.moving=false; return false; }
  }
  p.facing = rx!==0 ? (rx>0?'right':'left') : (ry>0?'down':'up');
  p.kSchritt = { vonX:p.x, vonY:p.y, zuX:ziel.x, zuY:ziel.y, t:0, dur: TILE/Math.max(8,speed),
                 vonTx:hier.tx, vonTy:hier.ty };
  p.moving = true;
  return true;
}

/* ============ ANREMPELN ============
   Läuft der Spieler in jemanden hinein, der gerade unterwegs ist, weicht
   die Person meistens zur Seite (70%). Manchmal (30%) bleibt sie stehen,
   beschwert sich – und das kostet ein bisschen Ansehen. Jede Person kann
   nur alle paar Sekunden reagieren, sonst stottert das beim Vorbeidrängeln. */
const REMPEL = {
  SEITE: 0.7,        // wie oft ausgewichen statt gemeckert wird
  COOLDOWN: 3.0,     // Sekunden, bis dieselbe Person wieder reagiert
  SCHRITT: 16,       // eine volle Kachel zur Seite (vorher 9px – da stand sie danach noch halb im Weg)
  TEMPO: 130,        // deutlich schneller als der Spieler, damit sie VOR ihm aus dem Weg ist
  PAUSE: 0.8,        // danach kurz stehen bleiben, statt sofort zurück in den Weg zu laufen
  SOZIAL: 4
};
const REMPEL_SPRUECHE = ['Hey, was soll das?', 'Ey! Guck mal, wo du hinläufst.', 'Vorsicht, Mensch!', 'Oh, hallo? Ich steh hier.'];
/* ============ AUSWEICHEN – reine Kachel-Logik ============
   Ganz einfach gehalten: Kommt jemand dem Spieler frontal entgegen, macht
   er EINEN Schritt zur Seite und läuft dann in seine alte Richtung weiter.
   Dafür wird nur sein Wegpunkt um eine Kachel versetzt – das normale
   Kachel-Laufen erledigt den Rest. Kein Extra-Bewegungssystem, keine
   Pixel-Rechtecke. Wer sich stattdessen beschwert, bleibt einfach stehen. */
const AUFMERKSAM = { SICHT: 4 };   // so viele Kacheln weit sieht man einen kommen

// Läuft der Spieler frontal auf diese Person zu (gleiche Zeile/Spalte)?
function kommtMirEntgegen(p){
  // Nur wer wirklich LÄUFT, treibt jemanden zur Seite. Bloßes Anschauen
  // aus dem Stand reicht nicht – sonst weicht dieselbe Person immer
  // wieder aus, sobald man in ihrer Reihe stehen bleibt.
  if(!player.moving && !player.schritt) return false;
  const [fx,fy] = facingVec();
  if(fx===0 && fy===0) return false;
  const pk = kachelVon(player.x, player.y), ek = kachelVon(p.x, p.y);
  const dtx = ek.tx-pk.tx, dty = ek.ty-pk.ty;
  if(fx!==0) return dty===0 && Math.sign(dtx)===fx && Math.abs(dtx)<=AUFMERKSAM.SICHT;
  return dtx===0 && Math.sign(dty)===fy && Math.abs(dty)<=AUFMERKSAM.SICHT;
}
// Einmal pro Begegnung: ausweichen oder stehenbleiben?
function rempelEntscheiden(){
  if(state.zombie) return;
  for(const p of alleFigurenDerSzene()){
    if(!kommtMirEntgegen(p)){ p.rempelEntschieden = null; p.schonAusgewichen = false; continue; }
    if(p.rempelEntschieden == null){
      p.rempelEntschieden = (Math.random() < REMPEL.SEITE) ? 'weicht' : 'bleibt';
    }
    if(p.rempelEntschieden !== 'weicht' || p.schonAusgewichen) continue;
    // Einen Schritt zur Seite: quer zur Laufrichtung des Spielers, auf die
    // Kachel, die frei ist. Der Wegpunkt wandert mit, damit die Person
    // danach einfach in ihrer alten Richtung weitergeht.
    const [fx,fy] = facingVec();
    const [sx,sy] = [-fy, fx];
    const k = kachelVon(p.x, p.y);
    for(const vorz of (Math.random()<0.5 ? [1,-1] : [-1,1])){
      const tx = k.tx + sx*vorz, ty = k.ty + sy*vorz;
      if(kachelGesperrt(tx,ty) || kachelBelegtVonFigur(tx,ty,p)) continue;
      const m = kachelMitte(tx,ty);
      p.kSchritt = { vonX:p.x, vonY:p.y, zuX:m.x, zuY:m.y, t:0, dur: TILE/Math.max(8,p.speed||40) };
      p.facing = sx*vorz!==0 ? (sx*vorz>0?'right':'left') : (sy*vorz>0?'down':'up');
      p.moving = true;
      if(p.route && p.route.length){          // Ziel mitverschieben
        p.route[0] = { x:p.route[0].x + sx*vorz*TILE, y:p.route[0].y + sy*vorz*TILE };
      }
      p.schonAusgewichen = true;
      break;
    }
  }
}
// Wer stehen geblieben ist, sagt beim Zusammenstoß etwas
function rempelZusammenstoss(tx, ty){
  if(state.zombie) return;
  for(const p of alleFigurenDerSzene()){
    if(p.rempelEntschieden !== 'bleibt' || p.rempelCool>0) continue;
    const k = kachelVon(p.x, p.y);
    if(k.tx!==tx || k.ty!==ty) continue;
    p.rempelCool = REMPEL.COOLDOWN;
    p.textBubble = { text: pick(REMPEL_SPRUECHE), t: 1.8 };
    state.social = clamp(state.social - REMPEL.SOZIAL, 0, 100);
    toneImpuls(300, {dauer:0.08, vol:0.04, typ:'square'});
  }
}
// Stehen zwei auf derselben Kachel, tritt eine zur Seite (Sicherheitsnetz)
function entwirreFiguren(){
  const belegt = new Map();
  for(const e of alleFigurenDerSzene()){
    if(e.kSchritt) continue;
    const k = kachelVon(e.x, e.y), key = k.tx+','+k.ty;
    if(!belegt.has(key)){ belegt.set(key, e); continue; }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const tx=k.tx+dx, ty=k.ty+dy;
      if(kachelGesperrt(tx,ty) || kachelBelegtVonFigur(tx,ty,e)) continue;
      const m = kachelMitte(tx,ty);
      e.kSchritt = { vonX:e.x, vonY:e.y, zuX:m.x, zuY:m.y, t:0, dur: TILE/40 };
      break;
    }
  }
}
// Führt einen begonnenen Kachelschritt aus (für Figuren ohne eigene Route,
// z.B. fest stehende NPCs, die gerade zur Seite gehen oder zurückkehren).
function kSchrittWeiter(e, dt){
  const s = e.kSchritt; if(!s) return false;
  s.t += dt;
  const f = Math.min(1, s.t/s.dur);
  e.x = s.vonX + (s.zuX-s.vonX)*f;
  e.y = s.vonY + (s.zuY-s.vonY)*f;
  e.moving = true;
  e.animT = (e.animT||0) + dt; e.frame = Math.floor(e.animT*7)%4;
  if(f>=1){ e.x=s.zuX; e.y=s.zuY; e.kSchritt=null; e.moving=false; }
  return true;
}
function rempelUpdate(dt){
  entwirreFiguren();
  rempelEntscheiden();
  for(const p of alleFigurenDerSzene()) if(p.rempelCool>0) p.rempelCool -= dt;
}
// Kleine Text-Sprechblase über einer Figur
function drawTextBubble(e){
  const b = e.textBubble; if(!b || b.t<=0) return;
  b.t -= 1/60;
  ctx.font='8px monospace'; ctx.textBaseline='top';
  const tw = ctx.measureText(b.text).width;
  const w = tw+8, h = 11;
  const bx = Math.round(e.x - w/2), by = Math.round(e.y) - 34;
  ctx.globalAlpha = b.t < 0.4 ? b.t/0.4 : 1;
  ctx.fillStyle='#fdf3dc'; ctx.fillRect(bx, by, w, h);
  ctx.fillStyle='#5a4632'; ctx.fillRect(bx, by, w, 1); ctx.fillRect(bx, by+h-1, w, 1);
  ctx.fillRect(bx, by, 1, h); ctx.fillRect(bx+w-1, by, 1, h);
  ctx.fillRect(bx+w/2-1, by+h, 2, 2);                     // Spitze
  ctx.fillStyle='#3b2f2f'; ctx.fillText(b.text, bx+4, by+2);
  ctx.globalAlpha = 1;
}

/* --- "Excuse me :)" – höflich um Platz bitten ---
   Zusätzlich zum Anrempeln (das bleibt wie es ist: 70% weichen aus, 30%
   meckern und kosten Ansehen). Wer stattdessen fragt, bekommt Platz ohne
   Meckern und ohne Abzug. Kurze Wartezeit, damit es kein Dauerknopf wird. */
const EXCUSE = {
  // In KACHELN gerechnet, nicht in Pixeln: Auf dem vergrößerten
  // Campingplatz stehen die Leute weiter auseinander – mit den alten
  // 44 Pixeln (knapp 3 Kacheln) reagierte im Schnitt nur eine Person.
  REICHWEITE_KACHELN: 5,
  COOLDOWN: 2.5, SOZIAL: 1, ZURUECK: 3.0
};
// Alle Personen, die auf ein "Excuse me" reagieren können – also nicht nur
// die Herumlaufenden, sondern auch die fest platzierten Figuren der Szene.
function alleAnsprechbaren(){ return alleFigurenDerSzene(); }
// Stehende Figuren kehren nach kurzer Zeit an ihren Platz zurück. Steht der
// Spieler dann immer noch dort, warten sie einfach weitere drei Sekunden.
function heimkehrUpdate(dt){
  for(const n of alleAnsprechbaren()){
    if(n.heimX===undefined || n.kSchritt) continue;
    if(n.x===n.heimX && n.y===n.heimY) continue;
    n.heimT = (n.heimT||0) - dt;
    if(n.heimT>0) continue;
    // Heimatkachel frei? Sonst später nochmal versuchen. Prüft Karte UND
    // alle Figuren (inkl. Spieler) – sonst kehrt jemand auf eine besetzte
    // Kachel zurück und steht in einem anderen drin.
    const hk = kachelVon(n.heimX, n.heimY);
    if(kachelGesperrt(hk.tx, hk.ty) || kachelBelegtVonFigur(hk.tx, hk.ty, n)){
      n.heimT = EXCUSE.ZURUECK; continue;
    }
    n.kSchritt = { vonX:n.x, vonY:n.y, zuX:n.heimX, zuY:n.heimY, t:0, dur: TILE/40 };
    n.heimT = EXCUSE.ZURUECK;
  }
}
function excuseMe(){
  if(state.excuseCool>0) return;
  if(state.dialog || state.menu || state.cutscene) return;
  state.excuseCool = EXCUSE.COOLDOWN;
  player.textBubble = { text:'Excuse me :)', t:1.6 };
  toneImpuls(520, {dauer:0.09, vol:0.04, typ:'triangle'});
  toneImpuls(660, {dauer:0.10, vol:0.035, typ:'triangle', verzoegerung:0.09});
  let geholfen = 0;
  for(const p of alleAnsprechbaren()){
    if(p.kSchritt) continue;
    if(Math.hypot(p.x-player.x, p.y-player.y) > EXCUSE.REICHWEITE_KACHELN*TILE) continue;
    // Erst zur Seite ausweichen; wer keinen Platz hat, geht nach vorn weg
    const [fx,fy] = facingVec();
    const richtungen = [[-fy,fx],[fy,-fx],[fx,fy]];
    for(const [vx,vy] of richtungen){
      const kk = kachelVon(p.x + vx*TILE, p.y + vy*TILE);
      if(!kachelGesperrt(kk.tx,kk.ty) && !kachelBelegtVonFigur(kk.tx,kk.ty,p)){
        const mm = kachelMitte(kk.tx,kk.ty);
        p.kSchritt = { vonX:p.x, vonY:p.y, zuX:mm.x, zuY:mm.y, t:0, dur: TILE/Math.max(8,p.speed||40) };
        if(p.route && p.route.length) p.route[0] = { x:p.route[0].x+vx*TILE, y:p.route[0].y+vy*TILE };
        p.rempelCool = REMPEL.COOLDOWN;
        p.textBubble = null;          // eine laufende Beschwerde ist damit erledigt
        p.heimT = EXCUSE.ZURUECK;     // danach zurück auf den Stammplatz
        geholfen++;
        break;
      }
    }
  }
  // Höflichkeit zahlt sich aus – aber nur, wenn wirklich jemand Platz macht
  if(geholfen) state.social = clamp(state.social + EXCUSE.SOZIAL, 0, 100);
}

/* ============ NATURTAGEBUCH ============
   Naturverbundenheit als Kern des Spiels: Man fängt keine Tiere, man
   BEOBACHTET sie. Wer still stehen bleibt, sieht mehr – wer rennt,
   verscheucht sie. Jede Art hat ihren Lebensraum und ihre Tageszeit.
   Müll im Camp vertreibt die Tiere. Alles liegt auf Kacheln.
   Die Zeichnungen sind Platzhalter, bis es eigene Pixelart gibt. */
const NATUR = {
  MAX_JE_SZENE: 4,        // gleichzeitig sichtbare Tiere pro Ort
  SPAWN_ALLE: 6,          // Sekunden zwischen Erscheinversuchen
  BEOBACHT_ZEIT: 1.6,     // so lange still stehen, bis beobachtet
  BEOBACHT_WEITE: 3,      // Kacheln
  SCHRECK_WEITE: 2,       // wer im Laufen näher kommt, verscheucht
  MIN_ABSTAND: 4          // erscheinen nicht direkt neben einem
};
// zeit: tag | nacht | daemmerung | immer
const NATUR_ARTEN = [

    orte:['camp','wald'], zeit:'tag', selten:1.0,

  { id:'marienkaefer', name:'Marienkäfer', form:'kaefer', farben:['#c9402f','#1e1a1e'],
    orte:['camp','waldstage'], zeit:'tag', selten:1.0,
    text:'Sieben Punkte. Frisst Blattläuse – ein kleiner Gärtner.' },
  { id:'zitronenfalter', name:'Zitronenfalter', form:'falter', farben:['#f0d45a','#c9a63f'],
    orte:['camp','wald'], zeit:'tag', selten:0.8,
    text:'Einer der ersten Schmetterlinge im Jahr. Überwintert einfach draußen, gefroren im Laub.' },
  { id:'eichhoernchen', name:'Eichhörnchen', form:'klein', farben:['#b0562a','#e8c7a0'],
    orte:['wald','waldstage'], zeit:'tag', selten:0.7,
    text:'Versteckt Nüsse und vergisst die Hälfte. Aus den vergessenen wachsen neue Bäume.' },
  { id:'buntspecht', name:'Buntspecht', form:'vogel', farben:['#1e1a1e','#c9402f'],
    orte:['waldstage'], zeit:'tag', selten:0.35,
    text:'Man hört ihn, bevor man ihn sieht: ein Trommeln gegen totes Holz.' },
  { id:'feldhase', name:'Feldhase', form:'saeuger', farben:['#9a7a52','#e8d8c0'],
    orte:['camp'], zeit:'daemmerung', selten:0.5,
    text:'Kommt in der Dämmerung aus der Wiese, wenn es auf dem Platz leiser wird.' },
  { id:'erdkroete', name:'Erdkröte', form:'kroete', farben:['#7a6a42','#a8946a'],
    orte:['waldstage','wald'], zeit:'daemmerung', selten:0.6,
    text:'Wandert jedes Jahr zu dem Gewässer zurück, in dem sie geboren wurde.' },
  { id:'igel', name:'Igel', form:'klein', farben:['#6d5a48','#d8c0a0'],
    orte:['camp'], zeit:'nacht', selten:0.7,
    text:'Schnauft laut beim Laufen. Frisst Schnecken und Käfer unter den Zelten.' },
  { id:'gluehwuermchen', name:'Glühwürmchen', form:'licht', farben:['#e8f07a','#fffbd0'],
    orte:['waldstage','wald'], zeit:'nacht', selten:0.8,
    text:'Leuchtet, um einen Partner zu finden. Wo zu viel Licht ist, finden sie sich nicht mehr.' },
  { id:'fledermaus', name:'Zwergfledermaus', form:'fledermaus', farben:['#3a3040','#5a4a58'],
    orte:['wald','camp'], zeit:'nacht', selten:0.6,
    text:'Wiegt so viel wie ein Stück Würfelzucker und frisst in einer Nacht Hunderte Mücken.' },
  { id:'hirschkaefer', name:'Hirschkäfer', form:'kaefer', farben:['#4a2a1a','#8a4a2a'],
    orte:['waldstage'], zeit:'daemmerung', selten:0.25,
    text:'Lebt jahrelang als Larve im Totholz und nur wenige Wochen als Käfer.' },
  { id:'fuchs', name:'Rotfuchs', form:'saeuger', farben:['#d0692a','#f0e0c8'],
    orte:['camp','wald'], zeit:'nacht', selten:0.15,
    text:'Schnürt nachts zwischen den Zelten durch. Sucht Essensreste – und findet leider genug.' }
];
const naturTiere = [];      // aktuell sichtbare Tiere (alle Szenen)
function naturZeitPasst(zeit){
  const h = state.clock.min/60;
  if(zeit==='immer') return true;
  if(zeit==='tag') return h>=7 && h<19;
  if(zeit==='nacht') return h>=21 || h<5;
  if(zeit==='daemmerung') return (h>=5 && h<8) || (h>=18 && h<22);
  return false;
}
function naturOrtGroesse(){
  if(state.scene==='wald') return {w:WALD.W, h:WALD.H};
  if(state.scene==='waldstage') return {w:WSTAGE.W, h:WSTAGE.H};
  return {w:MAPW, h:MAPH};
}
function naturVersuchErscheinen(){
  const hier = naturTiere.filter(t=>t.szene===state.scene);
  if(hier.length >= NATUR.MAX_JE_SZENE) return;
  const moeglich = NATUR_ARTEN.filter(a=>a.orte.includes(state.scene) && naturZeitPasst(a.zeit));
  if(!moeglich.length) return;
  // Müll vertreibt: jeder Stummel am Boden senkt die Chance im Camp
  if(state.scene==='camp' && Math.random() < Math.min(0.8, stubsOnGround.length*0.12)) return;
  // gewichtet nach Seltenheit ziehen
  const summe = moeglich.reduce((s,a)=>s+a.selten,0);
  let r = Math.random()*summe, art = moeglich[0];
  for(const a of moeglich){ r -= a.selten; if(r<=0){ art=a; break; } }
  const g = naturOrtGroesse();
  const pk = kachelVon(player.x, player.y);
  for(let v=0; v<20; v++){
    const tx = 2+Math.floor(Math.random()*(g.w-4)), ty = 2+Math.floor(Math.random()*(g.h-4));
    if(Math.abs(tx-pk.tx)+Math.abs(ty-pk.ty) < NATUR.MIN_ABSTAND) continue;
    if(Math.abs(tx-pk.tx)>14 || Math.abs(ty-pk.ty)>10) continue;   // in Sichtweite erscheinen
    if(kachelGesperrt(tx,ty) || kachelBelegtVonFigur(tx,ty,null)) continue;
    if(naturTiere.some(t=>t.szene===state.scene && t.tx===tx && t.ty===ty)) continue;
    const m = kachelMitte(tx,ty);
    naturTiere.push({ art, szene:state.scene, tx, ty, x:m.x, y:m.y,
      leben: 35+Math.random()*35, t:Math.random()*10, beobachtet:0, flieht:0 });
    return;
  }
}
function naturUpdate(dt){
  state.naturSpawnT = (state.naturSpawnT||0) - dt;
  if(state.naturSpawnT<=0){ state.naturSpawnT = NATUR.SPAWN_ALLE*(0.6+Math.random()*0.8); naturVersuchErscheinen(); }
  const pk = kachelVon(player.x, player.y);
  const stillAnDerStelle = !player.moving && !player.schritt;
  for(let i=naturTiere.length-1; i>=0; i--){
    const t = naturTiere[i];
    if(t.szene!==state.scene) continue;
    t.t += dt; t.leben -= dt;
    // Tageszeit vorbei? Dann zieht es sich zurück.
    if(!naturZeitPasst(t.art.zeit)) t.leben = Math.min(t.leben, 2);
    if(t.flieht>0){ t.flieht -= dt; if(t.flieht<=0) naturTiere.splice(i,1); continue; }
    if(t.leben<=0){ naturTiere.splice(i,1); continue; }
    const abstand = Math.abs(t.tx-pk.tx)+Math.abs(t.ty-pk.ty);
    // Wer im Laufen zu nah kommt, verscheucht es
    if(!stillAnDerStelle && abstand <= NATUR.SCHRECK_WEITE){
      t.flieht = 0.5;
      for(let k=0;k<5;k++) particles.push({x:t.x, y:t.y-4, vx:(Math.random()-0.5)*30,
        vy:-Math.random()*20, life:0.5, col:'rgba(230,220,190,0.8)', size:1});
      continue;
    }
    // Still in der Nähe stehen = beobachten
    if(stillAnDerStelle && abstand <= NATUR.BEOBACHT_WEITE){
      t.beobachtet += dt;
      if(t.beobachtet >= NATUR.BEOBACHT_ZEIT && !t.fertig){
        t.fertig = true;
        naturBeobachtet(t.art);
      }
    } else if(!t.fertig) t.beobachtet = Math.max(0, t.beobachtet - dt*0.5);
  }
}
function naturBeobachtet(art){
  if(!state.natur) state.natur = { gesehen:{} };
  const neu = !state.natur.gesehen[art.id];
  state.natur.gesehen[art.id] = (state.natur.gesehen[art.id]||0) + 1;
  if(neu){
    const anzahl = Object.keys(state.natur.gesehen).length;
    toast('Neu im Naturtagebuch: '+art.name+' ('+anzahl+'/'+NATUR_ARTEN.length+')');
    state.energy = clamp(state.energy + 3, 0, 100);      // Stille tut gut
    toneImpuls(740, {dauer:0.10, vol:0.035, typ:'sine'});
    toneImpuls(988, {dauer:0.14, vol:0.03, typ:'sine', verzoegerung:0.1});
  }
}
// Platzhalter-Zeichnungen, je nach Körperform
function drawNaturTier(t){
  const x=Math.round(t.x), y=Math.round(t.y), [c1,c2]=t.art.farben;
  const w = Math.sin(t.t*6)>0 ? 1 : 0;              // kleines Wippen
  ctx.globalAlpha = t.flieht>0 ? Math.max(0, t.flieht/0.5) : 1;
  ctx.fillStyle='rgba(30,25,15,0.18)'; ctx.fillRect(x-3, y-1, 6, 2);
  const f = t.art.form;
  if(f==='vogel'){
    ctx.fillStyle=c1; ctx.fillRect(x-3,y-6-w,6,4); ctx.fillRect(x+2,y-8-w,3,3);
    ctx.fillStyle=c2; ctx.fillRect(x+5,y-7-w,2,1); ctx.fillRect(x-1,y-2,1,2); ctx.fillRect(x+1,y-2,1,2);
  } else if(f==='kaefer'){
    ctx.fillStyle=c1; ctx.fillRect(x-2,y-4,5,3);
    ctx.fillStyle=c2; ctx.fillRect(x-1,y-4,1,1); ctx.fillRect(x+1,y-3,1,1); ctx.fillRect(x+3,y-4,1,2);
  } else if(f==='falter'){
    const fl = Math.sin(t.t*12)>0 ? 2 : 1;
    ctx.fillStyle=c1; ctx.fillRect(x-1-fl,y-9,fl+1,3); ctx.fillRect(x+1,y-9,fl+1,3);
    ctx.fillStyle=c2; ctx.fillRect(x,y-9,1,4);
  } else if(f==='klein'){
    ctx.fillStyle=c1; ctx.fillRect(x-4,y-5,7,4); ctx.fillRect(x+2,y-7,3,3);
    ctx.fillStyle=c2; ctx.fillRect(x-3,y-2,5,1);
    if(t.art.id==='eichhoernchen'){ ctx.fillStyle=c1; ctx.fillRect(x-6,y-9+w,3,5); }
  } else if(f==='saeuger'){
    ctx.fillStyle=c1; ctx.fillRect(x-5,y-7,9,5); ctx.fillRect(x+3,y-10,3,4);
    ctx.fillRect(x-4,y-2,1,2); ctx.fillRect(x+2,y-2,1,2);
    ctx.fillStyle=c2; ctx.fillRect(x-4,y-3,7,1); ctx.fillRect(x+4,y-12,1,2);
    if(t.art.id==='fuchs'){ ctx.fillStyle=c1; ctx.fillRect(x-8,y-6,3,2); ctx.fillStyle=c2; ctx.fillRect(x-9,y-6,1,2); }
  } else if(f==='kroete'){
    ctx.fillStyle=c1; ctx.fillRect(x-3,y-4,7,3);
    ctx.fillStyle=c2; ctx.fillRect(x-2,y-5,1,1); ctx.fillRect(x+2,y-5,1,1); ctx.fillRect(x-3,y-1,7,1);
  } else if(f==='licht'){
    const puls = 0.5+0.5*Math.sin(t.t*3 + t.tx);
    ctx.fillStyle='rgba(232,240,122,'+(0.25*puls)+')'; ctx.fillRect(x-4,y-12,9,9);
    ctx.fillStyle=c1; ctx.fillRect(x,y-8-w,2,2);
    ctx.fillStyle=c2; ctx.fillRect(x,y-8-w,1,1);
  } else if(f==='fledermaus'){
    const fl = Math.sin(t.t*14)>0 ? 1 : 0;
    ctx.fillStyle=c1; ctx.fillRect(x-1,y-12,3,3);
    ctx.fillStyle=c2; ctx.fillRect(x-5,y-12+fl,4,2); ctx.fillRect(x+2,y-12+fl,4,2);
  }
  // Beobachtungs-Fortschritt als kleiner Bogen über dem Tier
  if(t.beobachtet>0 && !t.fertig){
    const p = Math.min(1, t.beobachtet/NATUR.BEOBACHT_ZEIT);
    ctx.fillStyle='rgba(20,16,30,0.5)'; ctx.fillRect(x-6,y-17,12,2);
    ctx.fillStyle='#8fd07a'; ctx.fillRect(x-6,y-17,Math.round(12*p),2);
  }
  ctx.globalAlpha = 1;
}
// Tiere der aktuellen Szene in eine Zeichenliste einsortieren
function naturInListe(list){
  for(const t of naturTiere) if(t.szene===state.scene) list.push({y:t.y, f:()=>drawNaturTier(t)});
}
// Menü-Reiter "Natur"
function drawNatur(px,py,pw,ph){
  ctx.textBaseline='top';
  const gesehen = (state.natur && state.natur.gesehen) || {};
  const anzahl = Object.keys(gesehen).length;
  ctx.font='bold 10px monospace'; ctx.fillStyle='#3b2f2f';
  ctx.fillText('NATURTAGEBUCH  '+anzahl+'/'+NATUR_ARTEN.length, px+24, py+46);
  ctx.font='8px monospace'; ctx.fillStyle='#7a6a50';
  ctx.fillText('Bleib still stehen, dann zeigen sie sich.', px+24, py+60);
  const zeilenH = 26;
  const proSeite = Math.max(1, Math.floor((ph-110)/zeilenH));
  const seiten = Math.ceil(NATUR_ARTEN.length/proSeite);
  if(!state.naturSeite || state.naturSeite>=seiten) state.naturSeite = Math.min(state.naturSeite||0, seiten-1);
  const start = (state.naturSeite||0)*proSeite;
  const zeitName = {tag:'tagsüber', nacht:'nachts', daemmerung:'in der Dämmerung', immer:'jederzeit'};
  const ortName = {camp:'Campingplatz', wald:'Plaza', waldstage:'Waldbühne'};
  let y = py+78;
  for(const art of NATUR_ARTEN.slice(start, start+proSeite)){
    const n = gesehen[art.id];
    ctx.font='bold 9px monospace'; ctx.fillStyle = n ? '#3b2f2f' : '#a89a80';
    ctx.fillText(n ? art.name+'  ×'+n : '???', px+24, y);
    ctx.font='8px monospace'; ctx.fillStyle='#7a6a50';
    const hinweis = n ? art.text : ('Vielleicht '+zeitName[art.zeit]+' – '+art.orte.map(o=>ortName[o]).join(', ')+'.');
    const maxB = pw-48; let t = hinweis;
    while(ctx.measureText(t).width>maxB && t.length>4) t = t.slice(0,-2);
    if(t!==hinweis) t = t.slice(0,-1)+'…';
    ctx.fillText(t, px+24, y+11);
    y += zeilenH;
  }
  if(seiten>1){
    ctx.font='8px monospace'; ctx.fillStyle='#7a6a50';
    ctx.fillText('Seite '+((state.naturSeite||0)+1)+' / '+seiten, px+24, py+ph-26);
    if(state.naturSeite>0) button(px+pw-208, py+ph-32, 90, 20, 'Zurück', ()=>{ state.naturSeite--; });
    if((state.naturSeite||0)<seiten-1) button(px+pw-110, py+ph-32, 90, 20, 'Weiter', ()=>{ state.naturSeite=(state.naturSeite||0)+1; });
  }
}

/* ============ HERZEN & ZOMBIE-MODUS ============
   Lebensanzeige wie bei Zelda: drei Herzen, jedes kann halbiert werden.
   Bislang zieht nur der Zombie-Modus Herzen ab; schlafen füllt sie auf.

   Zombie-Modus: Am Foodcourt laufen "nur noch Zombies rum" – wer so weit
   weg ist, dass er niemanden mehr erkennt. Der pinke Teufel schaltet den
   Modus. Berührt dich ein Zombie, kostet das ein halbes Herz. Eine Runde
   dauert eine feste Zeit; wer sie übersteht, hat gewonnen. */
const ZOMBIE = {
  DAUER: 45,           // Sekunden pro Runde
  UNVERWUNDBAR: 1.2,   // Sekunden nach einem Treffer, in denen nichts passiert
  SCHADEN: 0.5,        // halbes Herz pro Treffer
  TEMPO: 1.35          // die Menge ist im Zombie-Modus schneller unterwegs
};
function schaden(betrag){
  if(state.zombie && state.zombie.unverwundbar>0) return;
  state.herzen = Math.max(0, state.herzen - betrag);
  if(state.zombie){ state.zombie.unverwundbar = ZOMBIE.UNVERWUNDBAR; state.zombie.treffer++; }
  toneImpuls(180, {dauer:0.14, vol:0.06, typ:'square'});
  if(state.herzen<=0) zombieVerloren();
}
function herzenAuffuellen(){ state.herzen = state.maxHerzen; }
// Im Zombie-Modus ist die Menge schneller unterwegs
function zombieTempo(){ return state.zombie ? ZOMBIE.TEMPO : 1; }
// Passanten am Foodcourt: normal, oder als Zombie mit grünlichem Schleier
// und steifer Haltung – Platzhalter, bis es eigene Pixelart dafür gibt.
function drawFoodPerson(p){
  if(!state.zombie){ drawEntity(p); return; }
  const wank = Math.sin(state.time*5 + p.x)*1.2;
  ctx.save(); ctx.translate(wank, 0);
  drawEntity(p);
  ctx.restore();
  // grünlicher Schleier über der Figur
  ctx.fillStyle='rgba(90,160,80,0.28)';
  ctx.fillRect(p.x-6, p.y-22, 12, 22);
  // hängende Arme nach vorn
  ctx.fillStyle='rgba(60,80,50,0.6)';
  ctx.fillRect(p.x-9, p.y-10, 4, 2); ctx.fillRect(p.x+5, p.y-10, 4, 2);
}
function zombieStarten(){
  if(state.scene!=='food'){ toast('Das geht nur am Foodcourt.'); return; }
  state.zombie = { t: ZOMBIE.DAUER, treffer:0, unverwundbar:1.0 };
  herzenAuffuellen();
  toast('Zombie-Modus! Lass dich '+ZOMBIE.DAUER+' Sekunden lang von niemandem berühren.');
}
function zombieUpdate(dt){
  const z = state.zombie; if(!z) return;
  z.t -= dt;
  if(z.unverwundbar>0) z.unverwundbar -= dt;
  // Berührung mit einem Passanten prüfen
  if(z.unverwundbar<=0){
    const meineBox = {x:player.x-5, y:player.y-7, w:10, h:7};
    for(const p of foodCrowd){
      if(p.scene!=='food') continue;
      const box = {x:p.x-5, y:p.y-7, w:10, h:7};
      if(rectsOverlap(meineBox, box)){ schaden(ZOMBIE.SCHADEN); break; }
    }
  }
  if(z.t<=0 && state.zombie) zombieGewonnen();
}
function zombieGewonnen(){
  const treffer = state.zombie.treffer;
  state.zombie = null;
  if(!state.flags.zombieGeschafft){
    state.flags.zombieGeschafft = true;
    const m = state.journal.missions.find(m=>m.key==='zombie');
    if(m) m.done = true;
    state.journal.memories.push('Den Zombies am Foodcourt ausgewichen. '+(treffer===0?'Ohne einen einzigen Treffer.':'Mit '+treffer+' Treffern.'));
  }
  state.social = clamp(state.social + 6, 0, 100);
  startDialog(lin([{ who:'sys', name:'', text: treffer===0
    ? 'Geschafft, ohne dass dich einer erwischt hat. Der Teufel wird staunen.'
    : 'Überstanden. '+treffer+' Mal hat es dich erwischt, aber du stehst noch.' }]), {breakable:true});
}
function zombieVerloren(){
  state.zombie = null;
  herzenAuffuellen();
  state.energy = clamp(state.energy - 15, 0, 100);
  startDialog(lin([{ who:'sys', name:'', text:'Zu viele Zombies. Du musst dich erstmal hinsetzen und durchatmen.' }]), {breakable:true});
}
// Herzen oben links, wie bei Zelda: voll, halb, leer
function drawHerzen(){
  const x0 = 14, y0 = 44;
  for(let i=0;i<state.maxHerzen;i++){
    const x = x0 + i*13;
    const wert = clamp(state.herzen - i, 0, 1);          // 1 voll, 0.5 halb, 0 leer
    zeichneHerz(x, y0, wert);
  }
}
function zeichneHerz(x, y, wert){
  const leer='#3b2f2f', voll='#c9402f', hell='#e8624f';
  // Umriss (leeres Herz)
  ctx.fillStyle=leer;
  ctx.fillRect(x+1,y,3,1); ctx.fillRect(x+6,y,3,1);
  ctx.fillRect(x,y+1,10,3); ctx.fillRect(x+1,y+4,8,1);
  ctx.fillRect(x+2,y+5,6,1); ctx.fillRect(x+3,y+6,4,1); ctx.fillRect(x+4,y+7,2,1);
  if(wert<=0) return;
  const breite = wert>=1 ? 10 : 5;                     // halbes Herz: nur linke Hälfte
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, breite, 9); ctx.clip();
  ctx.fillStyle=voll;
  ctx.fillRect(x+1,y,3,1); ctx.fillRect(x+6,y,3,1);
  ctx.fillRect(x,y+1,10,3); ctx.fillRect(x+1,y+4,8,1);
  ctx.fillRect(x+2,y+5,6,1); ctx.fillRect(x+3,y+6,4,1); ctx.fillRect(x+4,y+7,2,1);
  ctx.fillStyle=hell; ctx.fillRect(x+1,y+1,2,1); ctx.fillRect(x+1,y+2,1,1);
  ctx.restore();
}
// Anzeige während einer Zombie-Runde: Restzeit und Blinken bei Unverwundbarkeit
function drawZombieHud(){
  const z = state.zombie; if(!z) return;
  const txt = 'ZOMBIES  '+Math.ceil(z.t)+'s';
  ctx.font='bold 9px monospace'; ctx.textBaseline='top';
  const w = ctx.measureText(txt).width+12;
  const x = Math.round(GAME_W/2 - w/2), y = 22;
  ctx.fillStyle='rgba(120,20,40,0.75)'; ctx.fillRect(x, y, w, 13);
  ctx.fillStyle='#fdf3dc'; ctx.fillText(txt, x+6, y+2);
}

/* ============ BÜHNENDESIGN (Tag 2, Mittwoch) ============
   Vera überlässt dir am zweiten Tag die Deko der Mainstage. Man wählt
   eins von drei Themen, sammelt die passenden Materialien im Wald und
   an den Rändern des Geländes – und baut die Bühne dann selbst auf. */
const BAU_MATERIAL = {
  stoff:     { name:'Blaue Planen',     desc:'Weite blaue Bahnen. Sehen aus wie Wasser, wenn Wind reingeht.' },
  federn:    { name:'Federn',           desc:'Ein ganzer Sack Federn. Frag lieber nicht, woher.' },
  spiegel:   { name:'Spiegelfolie',     desc:'Reflektiert alles. Kostet Nerven beim Anbringen.' },
  moos:      { name:'Moos & Farn',      desc:'Am Waldboden gesammelt. Riecht nach nassem Wald.' },
  aeste:     { name:'Äste',             desc:'Krumme Äste, die aussehen wie etwas Größeres.' },
  pilze:     { name:'Papp-Pilze',       desc:'Selbst geschnitten und bemalt. Größer als dein Kopf.' },
  neonrohr:  { name:'Neonröhren',       desc:'Vier Röhren aus dem Lager. Zwei flackern.' },
  folie:     { name:'Alufolie',         desc:'Eine ganze Rolle. Wird unter Licht zu Sternen.' },
  laser:     { name:'Laserpointer',     desc:'Aus jemandes Rucksack geliehen. Sehr hell.' }
};
const BUEHNEN_THEMEN = [
  { id:'wasser', name:'Wasser & Schwäne',
    idee:'Blaue Planen als Wellen, Federn überall, dazwischen Spiegelflächen. Wie ein See bei Nacht.',
    material:['stoff','federn','spiegel'],
    fertig:'Die Bühne liegt unter blauen Bahnen wie unter Wasser. Federn treiben im Luftzug, die Spiegel werfen das Licht wie Wellen zurück.' },
  { id:'pilzwald', name:'Pilzwald',
    idee:'Moos, krumme Äste und riesige Papp-Pilze. Als wäre die Bühne im Wald gewachsen.',
    material:['moos','aeste','pilze'],
    fertig:'Aus der Bühne ist ein Waldstück geworden. Zwischen Moos und Ästen stehen Pilze, größer als die Leute davor.' },
  { id:'neon', name:'Neon-Kosmos',
    idee:'Neonröhren als Linien, Alufolie als Sternenfeld, Laser quer durch alles.',
    material:['neonrohr','folie','laser'],
    fertig:'Die Bühne ist ein Raumschiff geworden. Neonlinien, Folienglitzern und ein Laser, der über die Köpfe streicht.' }
];
function gewaehltesThema(){ return BUEHNEN_THEMEN.find(t=>t.id===state.buehne.thema) || null; }
// Fehlt noch was für das gewählte Thema?
function fehlendeMaterialien(){
  const th = gewaehltesThema();
  if(!th) return [];
  return th.material.filter(m => !state.buehne.material.includes(m));
}
// Ein Material zum Aufsammeln in die Welt legen
function addMaterialFund(objListe, tx, ty, matId){
  const x=tx*TILE+8, base=(ty+1)*TILE;
  const flag = 'mat_'+matId;
  const o = { type:'materialFund', matId, flag, x, base, ax:x, ay:base,
    label:BAU_MATERIAL[matId].name };
  o.talk = ()=>materialAufheben(o);
  objListe.push(o);
}
function materialAufheben(o){
  if(state.flags[o.flag]){
    startDialog(lin([{ who:'sys', name:'', text:'Hier liegt nichts mehr.' }]), {breakable:true});
    return;
  }
  const def = BAU_MATERIAL[o.matId];
  const th = gewaehltesThema();
  // Man kann alles einsammeln, aber der Hinweis hilft beim Sortieren
  const passt = th && th.material.includes(o.matId);
  state.flags[o.flag] = true;
  if(!state.buehne.material.includes(o.matId)) state.buehne.material.push(o.matId);
  startDialog(lin([
    { who:'sys', name:'', text:'Du hast '+def.name.toUpperCase()+' eingesammelt!' },
    { who:'sys', name:def.name, text: def.desc + (passt ? ' Genau das, was du für die Bühne brauchst.' : '') }
  ]), {breakable:true});
}
function drawMaterialFund(o){
  if(state.flags[o.flag]) return;
  const hop = Math.sin(state.time*2 + o.x)*1.5;
  const y = o.base-14+hop;
  ctx.fillStyle='rgba(30,25,15,0.2)'; ctx.fillRect(o.x-6, o.base-2, 12, 3);
  // schlichtes Bündel, farblich je nach Material
  const farben = { stoff:'#4f8fbf', federn:'#e8e0d0', spiegel:'#c8ccd4',
                   moos:'#5f9b4e', aeste:'#6d4a2f', pilze:'#c9604f',
                   neonrohr:'#8a6fd8', folie:'#c8ccd4', laser:'#5fbf5a' };
  ctx.fillStyle = farben[o.matId] || '#8a7f6d';
  ctx.fillRect(o.x-6, y, 12, 10);
  ctx.fillStyle='rgba(255,255,255,0.28)'; ctx.fillRect(o.x-6, y, 12, 2);
  ctx.fillStyle='#5a4632'; ctx.fillRect(o.x-6, y+9, 12, 2);
  const f = (state.time*3 + o.x) % 3;
  if(f < 1){ ctx.fillStyle='rgba(255,240,180,0.8)'; ctx.fillRect(o.x+6, y-4, 2, 2); }
}

/* ============ TIMETABLE & GIGS ============
   Das Line-up der Woche. Zu einem Gig zu gehen kostet Zeit – das ist
   neben den Missionen der zweite Weg, wie die Uhr vorangeht. */
const GIGS = [
  { tag:1, stunde:21, name:'Soundcheck & Warm-up', ort:'Mainstage',
    text:'Noch kein richtiges Set, aber die Anlage wird zum ersten Mal laut. Ein paar Leute stehen schon da.' },
  { tag:2, stunde:16, name:'Halber Hafen',        ort:'Waldbühne',
    text:'Zwei Gitarren und eine Stimme zwischen den Bäumen. Genau richtig für den Nachmittag.' },
  { tag:2, stunde:22, name:'NULLMODUS',           ort:'Mainstage',
    text:'Harte, gerade Bässe. Der Boden vibriert bis in die Zähne.' },
  { tag:3, stunde:15, name:'Tante Roswita',       ort:'Waldbühne',
    text:'Irgendwas zwischen Folk und Kabarett. Das Publikum lacht mehr als es tanzt.' },
  { tag:3, stunde:23, name:'KAROLINA K.',         ort:'Mainstage',
    text:'Der Headliner der ersten Hälfte. Voll bis nach hinten.' },
  { tag:4, stunde:17, name:'Feldrand-Kollektiv',  ort:'Waldbühne',
    text:'Sechs Leute, zwölf Instrumente, kein erkennbarer Plan. Großartig.' },
  { tag:5, stunde:22, name:'DUNKELZIFFER',        ort:'Mainstage',
    text:'Der Act, wegen dem viele überhaupt hier sind.' },
  { tag:6, stunde:20, name:'Abschluss: Alle Mann', ort:'Mainstage',
    text:'Die halbe Crew steht mit auf der Bühne. So endet das hier jedes Jahr.' }
];
// Der nächste Gig, der noch nicht vorbei und noch nicht besucht ist
function naechsterGig(){
  const jetzt = (state.clock.day-1)*1440 + state.clock.min;
  return GIGS.find(g=>{
    const gigZeit = (g.tag-1)*1440 + g.stunde*60;
    return gigZeit >= jetzt - 90 && !state.flags['gig_'+g.tag+'_'+g.stunde];
  }) || null;
}
function timetableTalk(){
  const g = naechsterGig();
  if(!g){
    startDialog(lin([{ who:'sys', name:'Timetable',
      text:'Das war\'s. Alle Slots durch – das Festival ist gelaufen.' }]), {breakable:true});
    return;
  }
  const gigZeit = (g.tag-1)*1440 + g.stunde*60;
  const jetzt = (state.clock.day-1)*1440 + state.clock.min;
  const wartenMin = gigZeit - jetzt;
  const tagName = WOCHENTAGE[(g.tag-1)%7];
  const kopf = 'ALS NÄCHSTES\n'+g.name+' – '+g.ort+'\n'+tagName+', '+g.stunde+':00 Uhr';
  if(wartenMin > 60*6){
    startDialog(lin([{ who:'sys', name:'Timetable',
      text: kopf+'\n\nDas ist noch weit hin. Bis dahin ist genug zu tun.' }]), {breakable:true});
    return;
  }
  startDialog(lin([{ who:'sys', name:'Timetable', text: kopf+'\n\nHingehen?', choices:[
    { t:'Hingehen', next:'gigBesuch', fx(){ gigBesuchen(g, wartenMin); } },
    { t:'Später', next:null }
  ]}]), {breakable:true});
}
function gigBesuchen(g, wartenMin){
  state.flags['gig_'+g.tag+'_'+g.stunde] = true;
  state.letzterGig = g;
  // Wartezeit bis zum Gig plus die Dauer des Sets selbst
  const dauer = Math.max(0, wartenMin) + 90;
  zeitVor(dauer, null);
  state.social = clamp(state.social + 8, 0, 100);
  state.energy = clamp(state.energy - 10, 0, 100);
  state.journal.memories.push(g.name+' auf der '+g.ort+' gesehen.');
}
function drawTimetable(o){
  ctx.fillStyle='rgba(20,16,30,0.25)'; ctx.fillRect(o.x-2, o.base-3, o.w+4, 4);
  ctx.fillStyle='#5a4632'; ctx.fillRect(o.x+2, o.base-6, 3, 6);      // Pfosten
  ctx.fillRect(o.x+o.w-5, o.base-6, 3, 6);
  ctx.fillStyle='#3b3547'; ctx.fillRect(o.x, o.base-30, o.w, 25);    // Tafel
  ctx.fillStyle='#4a4358'; ctx.fillRect(o.x+1, o.base-29, o.w-2, 2);
  ctx.fillStyle='#e8c46a'; ctx.fillRect(o.x+3, o.base-26, o.w-6, 2); // Kopfzeile
  ctx.fillStyle='#8d8d9c';                                            // Zeilen
  for(let i=0;i<4;i++) ctx.fillRect(o.x+3, o.base-21+i*4, o.w-8, 1);
}

/* ============ DANCEFLOOR & RAVESTICKS ============
   Auf dem Dancefloor ist so viel los, dass man niemanden gezielt findet.
   Hat man aber den Ravestick einer Person dabei, sieht sie das Leuchten
   und kommt von selbst zu einem. Sticks bekommt man teils geschenkt,
   teils findet man sie herumliegend. */
function addDancefloor(tx,ty,bw,bh){
  const x=tx*TILE, y=ty*TILE, w=bw*TILE, h=bh*TILE;
  const o = { type:'dancefloor', x, y, w, h, base:y+h,
    ax:x+w/2, ay:y+h, label:'Dancefloor' };
  o.talk = ()=>dancefloorTalk(o);
  stageObjects.push(o);
  // bewusst KEIN Solid: man kann mittendrin stehen, findet nur niemanden
}
// Wessen Stick habe ich dabei, und wen habe ich hier noch nicht getroffen?
function dancefloorTreffer(){
  return RAVESTICKS.filter(rs => getItem(rs.id) && !state.flags['df_'+rs.person]);
}
function dancefloorTalk(o){
  const moeglich = dancefloorTreffer();
  if(!moeglich.length){
    const hatIrgendeinen = RAVESTICKS.some(rs=>getItem(rs.id));
    startDialog(lin([{ who:'sys', name:'Dancefloor', text: hatIrgendeinen
      ? 'Dichtes Gedränge. Wen du hier kennst, hast du schon gefunden.'
      : 'Dichtes Gedränge, überall Leute. So findest du hier niemanden – dazu müsste dich jemand sehen können.' }]), {breakable:true});
    return;
  }
  // Wer den passenden Stick sieht, kommt zuerst
  const rs = moeglich[0];
  state.flags['df_'+rs.person] = true;
  state.letzterStickTreffer = rs;
  addSympathy(rs.person, 3);
  startDialog('dancefloorTreffen', {breakable:true});
}
function drawDancefloor(o){
  // Tanzende Silhouetten, dicht gedrängt – reine Deko, keine echten NPCs
  const reihen = Math.floor(o.h/22), spalten = Math.floor(o.w/18);
  for(let r=0;r<reihen;r++){
    for(let c=0;c<spalten;c++){
      const seed = r*7+c*13;
      const bx = o.x + 6 + c*18 + ((r%2)?9:0);
      const wippe = Math.sin(state.time*3 + seed)*2;
      const by = o.y + 8 + r*22 + wippe;
      if(bx > o.x+o.w-10) continue;
      ctx.fillStyle='rgba(28,24,38,0.55)';
      ctx.fillRect(bx, by+10, 8, 10);            // Körper
      ctx.fillRect(bx+1, by+3, 6, 6);            // Kopf
      const arm = Math.sin(state.time*3 + seed + 1)*3;
      ctx.fillRect(bx-2, by+8+arm, 3, 6);        // Arme
      ctx.fillRect(bx+7, by+8-arm, 3, 6);
    }
  }
}
// Leuchtende Sticks am Spieler – wird NACH der Figur gezeichnet, sonst
// verdeckt die Figur das Leuchten (Tiefensortierung).
function drawGetrageneSticks(){
  if(state.scene!=='stage') return;
  const dabei = RAVESTICKS.filter(rs=>getItem(rs.id));
  if(!dabei.length) return;
  dabei.forEach((rs,i)=>{
    const gx = Math.round(player.x - (dabei.length*5)/2 + i*5);
    const gy = Math.round(player.y - 26 + Math.sin(state.time*3 + i)*2);
    const r=parseInt(rs.farbe.slice(1,3),16), g=parseInt(rs.farbe.slice(3,5),16), b=parseInt(rs.farbe.slice(5,7),16);
    ctx.fillStyle = 'rgba('+r+','+g+','+b+',0.30)';
    ctx.fillRect(gx-2, gy-2, 6, 12);             // weicher Schein
    ctx.fillStyle = rs.farbe; ctx.fillRect(gx, gy, 2, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(gx, gy+1, 2, 3);
  });
}
// Ein herumliegender Ravestick zum Aufsammeln
function addStickFund(objListe, tx, ty, stickId){

function drawHindernis(o){
  if(state.flags[o.flag]) return;    // überwunden: verschwindet komplett
  const t = o.werkzeug;
  if(t==='cutter'){                  // Absperrband quer gespannt
    ctx.fillStyle='#c9402f'; ctx.fillRect(o.x, o.y+o.h/2-3, o.w, 6);
    ctx.fillStyle='#fdf3dc';
    for(let x=0;x<o.w;x+=10) ctx.fillRect(o.x+x, o.y+o.h/2-3, 5, 6);
    ctx.fillStyle='#5a4632';
    ctx.fillRect(o.x, o.y+o.h/2-8, 2, 16); ctx.fillRect(o.x+o.w-2, o.y+o.h/2-8, 2, 16);
  } else if(t==='schrauber'){         // verschraubtes Gitterelement
    ctx.fillStyle='#6a6a78'; ctx.fillRect(o.x, o.y+2, o.w, o.h-4);
    ctx.fillStyle='#8d8d9c';
    for(let x=2;x<o.w-2;x+=6) ctx.fillRect(o.x+x, o.y+4, 2, o.h-8);
    ctx.fillStyle='#4a4a56'; ctx.fillRect(o.x, o.y+2, o.w, 2); ctx.fillRect(o.x, o.y+o.h-4, o.w, 2);
    ctx.fillStyle='#c9a03f';          // Schraubenköpfe
    ctx.fillRect(o.x+3, o.y+5, 2, 2); ctx.fillRect(o.x+o.w-5, o.y+5, 2, 2);
    ctx.fillRect(o.x+3, o.y+o.h-7, 2, 2); ctx.fillRect(o.x+o.w-5, o.y+o.h-7, 2, 2);
  } else if(t==='stiefel'){           // Matschloch
    ctx.fillStyle='#5a4632'; ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle='#6d5540';
    for(let i=0;i<o.w;i+=7) ctx.fillRect(o.x+i, o.y+3+((i*5)%(o.h-6)), 4, 3);
    ctx.fillStyle='#7a6552'; ctx.fillRect(o.x+2, o.y+2, o.w-4, 2);
  } else if(t==='stirnlampe'){        // dunkler Bereich
    ctx.fillStyle='rgba(10,8,16,0.88)'; ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle='rgba(40,34,55,0.7)'; ctx.fillRect(o.x+2, o.y+2, o.w-4, o.h-4);
  } else if(t==='tape'){              // kaputte Plane / Loch
    ctx.fillStyle='#8a7f6d'; ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle='#5a4632';
    ctx.fillRect(o.x+o.w/2-4, o.y+2, 8, o.h-4);
    ctx.fillStyle='#a89a84'; ctx.fillRect(o.x, o.y, o.w, 2);
  }
}

const NPC_VORLIEBEN = {
  jonas: ['ruhig','herzhaft'],
  elias: ['elektronisch','ruhig'],
  noah:  ['fruehRaus','fische'],
  milo:  ['party','nachtmensch','elektronisch'],
  finn:  ['ruhig','fruehRaus'],
  lina:  ['suess','allesMoegliche'],
  nora:  ['herzhaft','hunde'],
  sofie: ['party','nachtmensch'],
  mira:  ['ruhig','katzen'],
  ela:   ['ruhigeToene','nachtmensch']
};
// Teilt man eine Vorliebe mit jemandem, geht die Sympathie mit ihr/ihm
// spürbar leichter von der Hand.
function sympathieMultiplikator(id){
  const vorlieben = NPC_VORLIEBEN[id];
  if(!vorlieben || !state.fragebogen.antworten.length) return 1;
  return vorlieben.some(v=>state.fragebogen.antworten.includes(v)) ? 1.5 : 1;
}
function addSympathy(id,d){
  const s=state.sympathy.find(s=>s.id===id);
  if(s) s.val=clamp(s.val + Math.round(d*sympathieMultiplikator(id)), -10, 10);
}
function sympathyAll(d){ state.sympathy.forEach(s=>s.val=clamp(s.val+d,-10,10)); }
function setFriend(name){
  state.friendName = name;
  const s = state.sympathy.find(s=>s.id==='friend'); if(s) s.name=name;
  const n = npcs.find(n=>n.id==='friend'); if(n) n.name=name;
}
// Sobald man jemanden wirklich kennenlernt (Name aufgedeckt), landet die
// Nummer automatisch im Handy – man muss nichts extra "hinzufügen".
function registriereKontakt(id, name){
  const s = state.sympathy.find(s=>s.id===id); if(s) s.name=name;
  if(!state.kontakte.includes(id)){
    state.kontakte.push(id);
    toast('Nummer von '+name+' gespeichert.');
  }
}
function kontaktName(id){
  if(id==='friend') return state.friendName || '???';
  const s = state.sympathy.find(s=>s.id===id);
  return s ? s.name : '???';
}

const toasts = [];
function toast(text){
  toasts.push({text, t:4});
  toneImpuls(760, {dauer:0.1, vol:0.035, typ:'sine'});
  toneImpuls(950, {dauer:0.12, vol:0.03, typ:'sine', verzoegerung:0.05});
}
function updateToasts(dt){
  for(const t of toasts) t.t-=dt;
  for(let i=toasts.length-1;i>=0;i--) if(toasts[i].t<=0) toasts.splice(i,1);
}

function statusUpdate(dt){
  state.energy = clamp(state.energy - (player.moving?CFG.ENERGY_DRAIN_MOVE:CFG.ENERGY_DRAIN_IDLE)*dt, 0, 100);
  if(state.energy<20 && !state.flags.lowEnergyWarned){
    state.flags.lowEnergyWarned = true;
    toast('Du bist ziemlich erschöpft... iss etwas! (Menü: Tasche)');
  }
  if(state.energy>=25) state.flags.lowEnergyWarned = false;
  const regen = state.smoke.phase==='smoking' ? 2 : (player.moving ? 0 : 0.4);
  state.social = clamp(state.social + regen*dt, 0, 100);
}

// Bricht die Brille evtl. nach einem Gespräch – Festival-Alltag halt.
function maybeBreakGlasses(){
  if(!state.flags.introDone || !state.wearingGlasses) return;
  // Frisch aufgesetzt: erst mal eine Schonfrist, sonst fühlt es sich willkürlich an
  state.brillenGespraeche = (state.brillenGespraeche||0) + 1;
  if(state.brillenGespraeche <= CFG.GLASSES_SAFE_TALKS) return;
  if(Math.random() < CFG.GLASSES_BREAK_CHANCE){
    state.brillenGespraeche = 0;
    const it = getItem('glasses');
    if(it){ it.n--; if(it.n<=0) removeItem(it); }
    state.wearingGlasses = false;
    const left = getItem('glasses');
    toast('Knack! Deine Sonnenbrille ist kaputtgegangen.' + (left ? ' Mit B setzt du eine neue auf.' : ' Das war die letzte...'));
  }
}

/* --- Sonnenbrille auf/ab: Taste B, HUD-Knopf und Menü nutzen alle das hier --- */
function toggleGlasses(){
  if(state.wearingGlasses){
    state.wearingGlasses = false;
    toast(darkness() > 0.4 ? 'Brille ab. Schon besser zu sehen.' : 'Brille ab. Autsch, hell!');
    return;
  }
  if(!getItem('glasses')){ toast('Du hast keine Sonnenbrille dabei.'); return; }
  state.wearingGlasses = true; state.brillenGespraeche = 0;   // Schonfrist neu starten
  toast(darkness() > 0.4 ? 'Brille auf. Nachts... eher so mittel.' : 'Sonnenbrille auf. Ahh, besser.');
}

/* --- Das Fahrrad: aufsteigen mit R, doppeltes Tempo --- */
function bikeTalk(){
  if(!state.flags.bikeTaken){
    state.flags.bikeTaken = true;
    state.onBike = true;
    state.journal.memories.push('Ein herrenloses Fahrrad übernommen.');
    toast('Fahrrad geschnappt. Mit R auf- und absteigen.');
    return;
  }
  toggleBike();
}
function toggleBike(){
  if(!state.flags.bikeTaken){ toast('Du hast kein Rad.'); return; }
  if(state.onBike){ state.onBike=false; toast('Abgestiegen.'); return; }
  if(state.scene==='tent'){ toast('Im Zelt? Eher nicht.'); return; }
  if(getItem('wood')){ toast('Mit einem Arm voll Bretter? Keine Chance.'); return; }
  state.onBike = true;
  toast('Aufgestiegen. Jetzt geht es schneller.');
}

/* --- Taschenlampe an/aus: Taste F, HUD-Knopf und Menü nutzen alle das hier --- */
function toggleLamp(){
  if(state.flashlight){
    state.flashlight = false;
    toast('Taschenlampe aus.');
    return;
  }
  if(!getItem('lamp')){ toast('Du hast keine Taschenlampe dabei.'); return; }
  state.flashlight = true;
  toast('Taschenlampe an.');
}
function doItemAction(item, act){
  const def = ITEMS[item.id];
  if(act==='eat'){
    state.energy = clamp(state.energy + def.energy, 0, 100);
    item.n--;
    toast(def.name+' gegessen: +'+def.energy+' Energie');
    if(item.n<=0){ removeItem(item); state.menu.sel = -1; }
  } else if(act==='wear'){
    toggleGlasses();
  } else if(act==='toggle'){
    toggleLamp();
  } else if(act==='use'){
    toast('Panzertape: Dafür gibt es (noch) keine Verwendung...');
  } else if(act==='call'){
    state.menu = {tab:'telefon', sel:-1};
    toneImpuls(440, {dauer:0.07, vol:0.045, typ:'triangle'});
  }
}

/* ============ 8. RAUCH-MECHANIK ============
   Wer zu lange rumsteht, dreht sich automatisch eine. */
function smokeUpdate(dt){
  if(state.fragebogen.raucht==='nein') return;   // raucht laut Fragebogen gar nicht
  const sm = state.smoke;
  if(player.moving){
    if(sm.phase==='smoking') finishCig();
    sm.phase='none'; sm.t=0; state.idleSince=0;
    return;
  }
  state.idleSince += dt;
  const wartezeit = state.fragebogen.raucht==='ja' ? CFG.IDLE_SMOKE_SEC*0.6 : CFG.IDLE_SMOKE_SEC;
  if(sm.phase==='none' && state.idleSince>=wartezeit){
    sm.phase='rolling'; sm.t=0;
  } else if(sm.phase==='rolling'){
    sm.t += dt;
    if(sm.t>=CFG.ROLL_SEC){ sm.phase='smoking'; sm.t=0; }
  } else if(sm.phase==='smoking'){
    sm.t += dt;
    if(sm.t>0.6){                       // regelmäßig ein Rauchwölkchen
      sm.t=0;
      particles.push({x:player.x+ (player.facing==='left'?-5:5), y:player.y-11,
        vx:(Math.random()-0.5)*3, vy:-8-Math.random()*4, life:1.6, col:'rgba(200,200,210,0.5)', size:2});
    }
  }
}
function finishCig(){
  if(state.ashtray < CFG.ASH_CAPACITY){
    state.ashtray++;
    toast('Stummel im Taschenascher verstaut ('+state.ashtray+'/'+CFG.ASH_CAPACITY+').');
  } else {
    // Die sichtbare Bodenmarkierung wird bisher nur auf dem Campingplatz
    // gezeichnet – anderswo würde sie mit falschen Koordinaten later dort
    // auftauchen. Die Sympathie-Strafe gilt trotzdem überall.
    if(state.scene==='camp') stubsOnGround.push({ x:player.x+(Math.random()*8-4), y:player.y+1 });
    sympathyAll(-CFG.LITTER_PENALTY);
    toast('Taschenascher voll! Stummel auf den Boden geworfen: -'+deNum(CFG.LITTER_PENALTY)+' Sympathie bei allen.');
  }
}
function particlesUpdate(dt){
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);
}
function fireEmit(dt){
  for(const o of objects){
    if(o.type!=='fire') continue;
    o.emitT -= dt;
    if(o.emitT<=0){
      o.emitT = 0.5+Math.random()*0.4;
      particles.push({x:o.x+(Math.random()*4-2), y:o.base-12,
        vx:(Math.random()-0.5)*2, vy:-10, life:1.4, col:'rgba(120,110,105,0.4)', size:2});
    }
  }
}

function nodeText(node){
  // Beim aktiven Knoten den einmal festgelegten Text verwenden – sonst würde
  // ein zufälliger text() bei jedem Bildaufbau neu würfeln und flackern.
  const d = state.dialog;
  if(d && d.node===node && d.textFest != null) return d.textFest;
  return typeof node.text==='function' ? node.text() : node.text;
}
function nodeChoices(node){
  if(!node.choices) return null;
  return typeof node.choices==='function' ? node.choices() : node.choices;
}
function resolveNode(ref){ return typeof ref==='string' ? DIALOGS[ref] : ref; }

// Baut aus einer einfachen Liste von Zeilen eine Dialog-Kette
function lin(arr){
  let next=null;
  for(let i=arr.length-1;i>=0;i--){
    const n=Object.assign({},arr[i]); n.next=next; next=n;
  }
  return next;
}

function startDialog(ref, opts){
  toneImpuls(520, {dauer:0.09, vol:0.05, typ:'sine'});
  state.dialog = { node:null, chars:0, choiceIdx:0, choiceCount:0,
                   inputActive:false, breakable: !!(opts&&opts.breakable) };
  interactQueued = false;
  state.idleSince = 0;
  setNode(resolveNode(ref));
}
function setNode(node){
  const d=state.dialog;
  d.node=node; d.chars=0; d.choiceIdx=0; d.choiceCount=0; d.inputActive=false;
  d.textFest=null;
  if(node.onEnter){
    const redirect = node.onEnter();
    if(redirect){ setNode(resolveNode(redirect)); return; }
  }
  d.textFest = typeof node.text==='function' ? node.text() : node.text;
  if(node.input){ d.inputActive=true; showFriendInput(); }
}
function goNext(ref){
  if(typeof ref === 'function') ref = ref();     // Ziel darf sich zur Laufzeit ergeben
  if(ref==null) endDialog();
  else setNode(resolveNode(ref));
}
function advanceDialog(){
  const d=state.dialog; if(!d) return;
  if(d.inputActive) return;                        // erst Namen eintippen
  toneImpuls(680, {dauer:0.04, vol:0.03, typ:'square'});
  const full=nodeText(d.node);
  if(d.chars < full.length){ d.chars = full.length; return; }  // Text sofort komplett zeigen
  const ch = nodeChoices(d.node);
  if(ch && ch.length){
    const c = ch[clamp(d.choiceIdx,0,ch.length-1)];
    if(c.fx) c.fx();
    state.social = clamp(state.social-2, 0, 100);
    goNext(c.next);
    return;
  }
  state.social = clamp(state.social-1.5, 0, 100);
  goNext(d.node.next);
}
function endDialog(){
  const br = state.dialog && state.dialog.breakable;
  state.dialog = null;
  hideFriendInput();
  if(br) maybeBreakGlasses();
}

/* --- Der Stuhl: mit Panzertape lässt er sich retten --- */
function chairTalk(o){
  if(state.flags.chairFixed){
    startDialog(lin([{ who:'sys', name:'Campingstuhl',
      text:'Steht wieder. Ein breiter Streifen Panzertape hält die Lehne zusammen.' }]), {breakable:true});
    return;
  }
  const tape = getItem('tape');
  if(!tape){
    startDialog(lin([{ who:'sys', name:'Campingstuhl',
      text:'Ein Bein ist verbogen, der Stoff eingerissen. Mit dem richtigen Material wäre das zu retten.' }]), {breakable:true});
    return;
  }
  startDialog('chairFix1', {breakable:true});
}

function veraTalk(){
  const s = state.sympathy.find(s=>s.id==='vera');
  if(s && s.name==='???') registriereKontakt('vera','Vera');
  if(!state.flags.veraMet){
    state.flags.veraMet = true;
    startDialog('veraFirst1', {breakable:true});
    return;
  }
  // --- Tag 2: das Bühnendesign ---
  // Läuft erst, wenn Tag 1 durch ist (Bändchen) und ein neuer Tag begonnen hat.
  if(state.flags.bandGot && state.clock.day>=2){
    if(!state.flags.designAngeboten){
      startDialog('veraDesign1', {breakable:true});
      return;
    }
    if(!state.buehne.thema){          // Thema noch nicht gewählt
      startDialog('veraDesignWahl', {breakable:true});
      return;
    }
    if(!state.buehne.fertig){
      const fehlt = fehlendeMaterialien();
      if(fehlt.length===0){           // alles beisammen: aufbauen
        startDialog('veraDesignFertig', {breakable:true});
        return;
      }
      const namen = fehlt.map(m=>BAU_MATERIAL[m].name).join(', ');
      startDialog(lin([{ who:'vera', text:'Dir fehlt noch: '+namen+'. Schau im Wald und an den Rändern, da liegt genug rum.' }]), {breakable:true});
      return;
    }
  }
  // Holz abliefern
  if(getItem('wood') && !state.flags.woodDone){
    startDialog('veraWood1', {breakable:true});
    return;
  }
  // Werkzeug abliefern
  if(getItem('tools') && !state.flags.bandGot){
    startDialog('veraGive1', {breakable:true});
    return;
  }
  if(!state.flags.woodDone){
    startDialog(lin([{ who:'vera', text: pick([
      'Das Materiallager liegt im Süden, hinter den Camps. Bretter. Ein Stapel reicht erstmal.',
      'Ich kann hier nicht weg, sonst würde ich selbst fahren.',
      'Je eher das Holz hier ist, desto eher steht der Bühnenboden.'
    ]) }]), {breakable:true});
    return;
  }
  if(!state.flags.bandGot){
    startDialog(lin([{ who:'vera', text: pick([
      'Camp Süd. Pinkes Zelt. Die Kiste steht daneben.',
      'Momo weiß Bescheid. Sag einfach, du kommst von mir.',
      'Ohne Werkzeug komme ich hier keinen Meter weiter.'
    ]) }]), {breakable:true});
    return;
  }
  startDialog(lin([{ who:'vera', text: pick([
    'Der Aufbau läuft wieder. Heute Abend wird das hier laut.',
    'Wenn du backstage gehst: Die Kiste mit meinem Namen bleibt zu.',
    'Nächste Schicht fängt gleich an. Bleib in der Nähe.'
  ]) }]), {breakable:true});
}

// Variationen von NPC1: eigene Haut-, Haar-, Bikini- und Augenfarbe pro Figur.
// Zuordnung der Buchstaben ist mein bester Blick auf die Zeichnung –
// b/h Haut, c/e/f Haar, d/k Bikini, o/q Augen. Sag Bescheid, falls etwas falsch sitzt.
// Wie hell ist eine Farbe (0-255)? Für den Kontrastschutz unten.
function farbHelligkeit(c){
  const r=parseInt(c.slice(1,3),16), g=parseInt(c.slice(3,5),16), b=parseInt(c.slice(5,7),16);
  return 0.299*r + 0.587*g + 0.114*b;
}
// Zieht Haut/Haar/Outfit für eine Zufallsfigur – aber nie alles hell auf
// einmal, sonst wird die Figur auf hellem Boden zur durchsichtigen Hülle.
// EINE Stelle für alle Zufallsfiguren (Helden-Sprite wie NPC1-Sprite).
function zufallsFarbenMitKontrast(){
  let s=pick(SKINS), h=pick(HAIRS), o=pick(OUTFITS);
  const hell = c => farbHelligkeit(c) > 175;
  if(hell(s.s) && hell(h.h) && hell(o.c)){
    const dunkle = OUTFITS.filter(x=>!hell(x.c));
    if(dunkle.length) o = pick(dunkle);
  }
  return {s,h,o};
}
function npc1RandomPal(){
  const {s:skin, h:hair, o:outfit} = zufallsFarbenMitKontrast();
  // Benutzt bewusst dieselbe Funktion wie die festen Figuren – so gibt es
  // nur EINE Stelle, an der die Farben einer NPC1-Figur entstehen.
  return bastelNpc1Pal(skin, hair, outfit, pick(NPC1_AUGEN));
}

// Kartengröße der aktuellen Szene in Pixeln – für Spawn-Grenzen wie bei den Trip-Tieren
function sceneMapSize(){
  if(state.scene==='tent') return {w:TENT.W, h:TENT.H};
  if(state.scene==='stage') return {w:STAGE.W*TILE, h:STAGE.H*TILE};
  if(state.scene==='food') return {w:FOOD.W*TILE, h:FOOD.H*TILE};
  if(state.scene==='wald') return {w:WALD.W*TILE, h:WALD.H*TILE};
  if(state.scene==='waldstage') return {w:WSTAGE.W*TILE, h:WSTAGE.H*TILE};
  if(state.scene==='ownstage') return {w:OWNSTAGE.W*TILE, h:OWNSTAGE.H*TILE};
  if(state.scene==='eingang') return {w:EING.W*TILE, h:EING.H*TILE};
  return {w:MAPW*TILE, h:MAPH*TILE};
}
function spawnTripAnimal(){
  const def=pick(ANIMAL_KINDS);
  const groesse = sceneMapSize();
  const hindernisse = sceneSolids();
  for(let tries=0; tries<8; tries++){        // freien Fleck in Spielernähe suchen
    const x=player.x+(Math.random()*120-60), y=player.y+(Math.random()*80-40);
    if(x<40||y<40||x>groesse.w-40||y>groesse.h-40) continue;
    if(hindernisse.some(s=>rectsOverlap({x:x-5,y:y-6,w:10,h:6},s))) continue;
    tripAnimals.push({ kind:def.kind, label:def.label, lines:def.lines,
      x, y, seed:Math.random()*10, age:0, life:CFG.TRIP_ANIMAL_LIFE });
    return;
  }
}
function tripAnimalsUpdate(dt){
  if(state.trip.t>0){
    state.trip.animalT -= dt;
    if(state.trip.animalT<=0 && tripFactor()>0.5 && tripAnimals.length<3){
      state.trip.animalT = 15+Math.random()*10;
      spawnTripAnimal();
    }
  }
  for(const a of tripAnimals){ a.age+=dt; a.life-=dt; }
  for(let i=tripAnimals.length-1;i>=0;i--){
    if(tripAnimals[i].life<=0 || state.trip.t<=0){
      const a=tripAnimals[i];                // Abgang mit kleinem Funkel-Plopp
      for(let k=0;k<5;k++) particles.push({x:a.x, y:a.y-5, vx:(Math.random()-0.5)*20,
        vy:-Math.random()*14, life:0.5, col:'rgba(255,220,160,0.8)', size:1});
      tripAnimals.splice(i,1);
    }
  }
}
function animalTalk(a){
  const neuGesehen = tierNotieren(a.kind);
  const zeilen = [{ who:'sys', name:a.label, text:pick(a.lines) }];
  if(neuGesehen && state.flags.tierMission){
    const n = state.tiereGesehen.length, ges = ANIMAL_KINDS.length;
    zeilen.push({ who:'sys', name:'', text: n>=ges
      ? 'Alle '+ges+' Tiere gesehen! Das musst du Tomás erzählen.'
      : a.label+' notiert. ('+n+' von '+ges+')' });
  }
  startDialog(lin(zeilen), {breakable:false});
}
// Hält fest, mit welchen Tieren man schon geredet hat
function tierNotieren(kind){
  if(!state.tiereGesehen) state.tiereGesehen = [];
  if(state.tiereGesehen.includes(kind)) return false;
  state.tiereGesehen.push(kind);
  if(state.tiereGesehen.length >= ANIMAL_KINDS.length){
    const m = state.journal.missions.find(m=>m.key==='tiere');
    if(m) m.done = true;
  }
  return true;
}
function tiereFehlen(){
  if(!state.tiereGesehen) state.tiereGesehen = [];
  return ANIMAL_KINDS.length - state.tiereGesehen.length;
}

/* ============ RÜCKBLENDE IM GLITCH ============
   Während des kurzen Farbblitzes im Acid-Trip springt die Grafik für einen
   Moment in den alten Stil zurück: klobigere Figuren, gröberer Boden,
   flachere Farben – so, wie das Spiel früher aussah (und Harvey noch aussieht). */
let retroStil = false;

// Der alte Boden entsteht aus dem neuen: halbe Auflösung, gröbere Farben.
const retroGruende = new WeakMap();
function retroGrundVon(quelle){
  if(retroGruende.has(quelle)) return retroGruende.get(quelle);
  const w = quelle.width, hh = quelle.height;
  const c = document.createElement('canvas');
  c.width = w; c.height = hh;
  const k = c.getContext('2d');
  k.imageSmoothingEnabled = false;
  // Erst auf ein Viertel schrumpfen, dann wieder aufziehen: klobige Blöcke
  const klein = document.createElement('canvas');
  klein.width = Math.max(1, Math.floor(w/4)); klein.height = Math.max(1, Math.floor(hh/4));
  const kk = klein.getContext('2d');
  kk.imageSmoothingEnabled = false;
  kk.drawImage(quelle, 0, 0, klein.width, klein.height);
  k.drawImage(klein, 0, 0, w, hh);
  // Farben auf die alte, kräftigere Palette ziehen
  const alt = [[163,207,107],[148,193,92],[178,218,123],   // altes Grün
               [220,194,142],[203,180,126],[230,211,162]]; // alter Sandweg
  const bild = k.getImageData(0,0,w,hh);
  const d = bild.data;
  for(let i=0;i<d.length;i+=4){
    let best=alt[0], bd=1e9;
    for(const a of alt){
      const dd=(d[i]-a[0])**2+(d[i+1]-a[1])**2+(d[i+2]-a[2])**2;
      if(dd<bd){ bd=dd; best=a; }
    }
    d[i]=best[0]; d[i+1]=best[1]; d[i+2]=best[2];
  }
  k.putImageData(bild,0,0);
  retroGruende.set(quelle, c);
  return c;
}
// Überall dort benutzen, wo sonst der normale Boden gezeichnet wird
function bodenBild(quelle){ return retroStil ? retroGrundVon(quelle) : quelle; }

function drawAnimalRetro(a){
  const t = RETRO_TIERE[a.kind];
  if(!t) return;
  const x = Math.round(a.x), y = Math.round(a.y);
  const b = t.breit, hh = t.hoch;
  ctx.fillStyle='rgba(40,30,20,0.25)'; ctx.fillRect(x-b/2, y-2, b, 3);
  ctx.fillStyle=t.dunkel; ctx.fillRect(x-b/2, y-hh, b, hh);          // Körper
  ctx.fillStyle=t.koerper; ctx.fillRect(x-b/2+1, y-hh+1, b-2, hh-2);
  ctx.fillStyle=t.dunkel;
  if(t.ohren){ ctx.fillRect(x-b/2+1, y-hh-3, 2, 3); ctx.fillRect(x+b/2-3, y-hh-3, 2, 3); }
  if(t.horn){  ctx.fillRect(x-b/2-1, y-hh-2, 3, 2); ctx.fillRect(x+b/2-2, y-hh-2, 3, 2); }
  if(t.beine){ for(let i=0;i<3;i++){ ctx.fillRect(x-b/2-2, y-4-i*3, 2, 2); ctx.fillRect(x+b/2, y-4-i*3, 2, 2); } }
  if(t.schnabel){ ctx.fillStyle='#d8a03f'; ctx.fillRect(x+b/2-1, y-hh+3, 3, 2); }
  ctx.fillStyle='#161016';                                            // Augen
  ctx.fillRect(x-3, y-hh+3, 2, 2); ctx.fillRect(x+1, y-hh+3, 2, 2);
}

function drawAnimal(a){
  const fade=Math.min(1, a.age/0.6, a.life/0.6);
  if(retroStil){ ctx.globalAlpha=fade; drawAnimalRetro(a); ctx.globalAlpha=1; return; }
  const spr = TIER_SPRITES[a.kind];
  if(!spr) return;
  const wippen = (a.kind==='ente'||a.kind==='frosch')
    ? Math.round(Math.sin(state.time*3+a.seed)*1.2) : 0;
  const x = Math.round(a.x), y = Math.round(a.y)+wippen;
  const hoch = spr.grid.length;
  // Erscheinungen leuchten leicht – sonst gehen sie im Farbstich des Trips unter
  const puls = 0.55 + Math.sin(state.time*2.2 + a.seed)*0.2;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y-hoch/2, 2, x, y-hoch/2, hoch*0.9);
  g.addColorStop(0, 'rgba(255,244,210,'+(0.34*puls).toFixed(3)+')');
  g.addColorStop(0.55,'rgba(255,226,170,'+(0.16*puls).toFixed(3)+')');
  g.addColorStop(1, 'rgba(255,220,160,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y-hoch/2, hoch*0.9, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // Schatten und Tier
  ctx.globalAlpha=fade;
  ctx.fillStyle='rgba(50,35,25,0.25)';
  ctx.fillRect(x-4, Math.round(a.y)-1, 8, 2);
  drawSprite(spr, a.x, a.y+wippen, fade);
  // Kleine Funken, damit man sie auch aus dem Augenwinkel bemerkt
  for(let i=0;i<3;i++){
    const w = state.time*1.4 + a.seed + i*2.1;
    const fx = x + Math.cos(w)*(hoch*0.55);
    const fy = y - hoch*0.5 + Math.sin(w*1.3)*(hoch*0.4);
    ctx.fillStyle = 'rgba(255,248,220,'+(0.5*fade*puls).toFixed(2)+')';
    ctx.fillRect(Math.round(fx), Math.round(fy), 1, 1);
  }
  ctx.globalAlpha=1;
}

/* --- Ausgänge & Wanderer (Hintergrund-NPCs) ---
   Drei Ausgänge (Baumlücken) am Kartenrand. Jeder Wanderer kommt aus
   einem Ausgang und läuft direkt zu einem ANDEREN – über 1–2 leicht
   versetzte Zwischenpunkte, damit nicht alle dieselbe Linie laufen.
   Der Bestand wird konstant bei WANDERER_MIN gehalten. */
const EXITS = [

  { id:'sued',    x:232, y:538 },   // unten
  { id:'suedost', x:648, y:538 }    // unten rechts, nahe Stellas Camp
