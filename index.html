/* ============ TON: alles synthetisch erzeugt, keine Audiodateien ============
   Läuft über die Web Audio API direkt im Code: Rauschen, Oszillatoren, Filter.
   Startet erst nach der ersten Nutzereingabe (Browser-Autoplay-Regel). */
let audioCtx = null, masterGain = null, ambientGain = null, sfxGain = null;
let soundOn = (localStorage.getItem('dataluma_sound') ?? '1') === '1';
let audioBereit = false;

function tonInit(){
  if(audioBereit) return;
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = soundOn?1:0;
    masterGain.connect(audioCtx.destination);
    ambientGain = audioCtx.createGain(); ambientGain.gain.value = 0.55;
    ambientGain.connect(masterGain);
    sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.8;
    sfxGain.connect(masterGain);
    audioBereit = true;
  }catch(e){ audioBereit = false; }   // Web Audio nicht verfügbar: Spiel bleibt stumm, aber lauffähig
}
// Bei jeder ersten Nutzereingabe aufgerufen – Browser blockieren Ton sonst.
function tonFreigeben(){
  if(!audioBereit) tonInit();
  else if(audioCtx.state==='suspended') audioCtx.resume();
}
function soundUmschalten(){
  soundOn = !soundOn;
  try{ localStorage.setItem('dataluma_sound', soundOn?'1':'0'); }catch(e){}
  if(audioBereit) masterGain.gain.setTargetAtTime(soundOn?1:0, audioCtx.currentTime, 0.05);
  toast(soundOn ? 'Ton an.' : 'Ton aus.');
}

// Zwei Sekunden Rauschen, wiederverwendet für Schritte, Knistern, Wind ...
let laermPuffer = null;
function getLaerm(){
  if(laermPuffer) return laermPuffer;
  const len = audioCtx.sampleRate*2;
  laermPuffer = audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d = laermPuffer.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return laermPuffer;
}
// Ein kurzer, gefilterter Rauschimpuls – Schritte, Knacken, Klicks
function laermImpuls(ziel, opts){
  if(!audioBereit || !soundOn) return;
  const {freq=1000,q=1,vol=0.2,dauer=0.06,typ='bandpass'} = opts||{};
  const t = audioCtx.currentTime;
  const src = audioCtx.createBufferSource(); src.buffer = getLaerm();
  const filt = audioCtx.createBiquadFilter(); filt.type=typ; filt.frequency.value=freq; filt.Q.value=q;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dauer);
  src.connect(filt); filt.connect(g); g.connect(ziel||sfxGain);
  src.start(t); src.stop(t+dauer+0.02);
}
// Ein einzelner Ton – UI-Blips, kleine Jingles
function toneImpuls(freq, opts){
  if(!audioBereit || !soundOn) return;
  const {dauer=0.12,vol=0.12,typ='sine',ziel=null,verzoegerung=0} = opts||{};
  const t = audioCtx.currentTime+verzoegerung;
  const osc = audioCtx.createOscillator(); osc.type=typ; osc.frequency.setValueAtTime(freq,t);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t+dauer);
  osc.connect(g); g.connect(ziel||sfxGain);
  osc.start(t); osc.stop(t+dauer+0.02);
}

/* --- Ambient-Kulisse: pro Ort eine passende Klanglandschaft, die weich
   ein- und ausgeblendet wird, statt Dateien abzuspielen wird sie aus
   Rauschen und Oszillatoren gebaut und läuft in Dauerschleife. --- */
let ambientSzene = null;                    // welche Kulisse gerade läuft
const ambientKnoten = {};                   // aktive Loop-Knoten je Stimme
let feuerTickT = 0, ansageBassPhase = 0;

function ambientStimmeStart(name, bauen){
  if(ambientKnoten[name]) return;
  ambientKnoten[name] = bauen();
}
function ambientStimmeStop(name){
  const k = ambientKnoten[name];
  if(!k) return;
  const t = audioCtx.currentTime;
  try{
    k.gain.gain.cancelScheduledValues(t);
    k.gain.gain.setTargetAtTime(0, t, 0.4);
    setTimeout(()=>{ try{ k.quellen.forEach(q=>q.stop()); }catch(e){} }, 900);
  }catch(e){}
  delete ambientKnoten[name];
}
function ambientAlleStop(){
  for(const name of Object.keys(ambientKnoten)) ambientStimmeStop(name);
}

// Wind: leises, tiefpassgefiltertes Rauschen – für alle Außenorte
function windStarten(){
  ambientStimmeStart('wind', ()=>{
    const src = audioCtx.createBufferSource(); src.buffer=getLaerm(); src.loop=true;
    const filt = audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=380;
    const g = audioCtx.createGain(); g.gain.value=0;
    src.connect(filt); filt.connect(g); g.connect(ambientGain);
    src.start();
    g.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.6);
    return { gain:g, quellen:[src] };
  });
}
// Menschengemurmel: bandpassgefiltertes Rauschen, sanft moduliert –
// für Foodcourt, Plaza, Camp (dort leiser)
function murmelnStarten(lautstaerke){
  ambientStimmeStart('murmeln', ()=>{
    const src = audioCtx.createBufferSource(); src.buffer=getLaerm(); src.loop=true;
    const filt = audioCtx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=850; filt.Q.value=0.7;
    const lfo = audioCtx.createOscillator(); lfo.frequency.value=0.15;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value=180;
    lfo.connect(lfoGain); lfoGain.connect(filt.frequency); lfo.start();
    const g = audioCtx.createGain(); g.gain.value=0;
    src.connect(filt); filt.connect(g); g.connect(ambientGain);
    src.start();
    g.gain.setTargetAtTime(lautstaerke, audioCtx.currentTime, 0.7);
    return { gain:g, quellen:[src,lfo] };
  });
}
// Dumpfer Bass Richtung Mainstage – wird lauter, je näher man am
// nördlichen Tor auf der Plaza steht
function bassStarten(){
  ambientStimmeStart('bass', ()=>{
    const osc = audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=58;
    const g = audioCtx.createGain(); g.gain.value=0;
    osc.connect(g); g.connect(ambientGain);
    osc.start();
    return { gain:g, quellen:[osc], osc };
  });
}

// Wählt die passende Kulisse für den aktuellen Ort und blendet um
function ambientWechsel(){
  if(!audioBereit) return;
  const szene = state.scene;
  if(szene === ambientSzene) return;
  ambientSzene = szene;
  ambientAlleStop();
  if(szene==='camp'){ windStarten(); murmelnStarten(0.035); }
  else if(szene==='food'){ murmelnStarten(0.09); }
  else if(szene==='wald'){ windStarten(); murmelnStarten(0.05); bassStarten(); }
  else if(szene==='waldstage'){ windStarten(); }
  else if(szene==='eingang'){ windStarten(); }
  // 'tent': bewusst keine Außenkulisse – wirkt gedämpft und ruhig
}
// Läuft jeden Frame: passt Lautstärken an Feuer-Nähe, Bass-Nähe usw. an
function ambientUpdate(dt){
  if(!audioBereit || state.mode!=='game') return;
  ambientWechsel();
  // Bass zum Mainstage-Tor hin lauter – nur auf der Plaza spürbar
  if(ambientKnoten.bass){
    let naehe = 0;
    if(state.scene==='wald'){
      const dNord = Math.hypot(player.x-14*TILE, player.y-2*TILE);
      naehe = clamp(1 - dNord/(9*TILE), 0, 1);
    }
    ansageBassPhase += dt*2.05;                        // ~123 bpm Pulsieren
    const puls = 0.5 + 0.5*Math.sin(ansageBassPhase*Math.PI);
    ambientKnoten.bass.gain.gain.setTargetAtTime(naehe*0.10*puls, audioCtx.currentTime, 0.08);
  }
  // Lagerfeuer-Knistern: einzelne Knackser, häufiger und lauter, je näher
  const feuerListen = { camp:objects, food:foodObjects, wald:waldObjects,
                        waldstage:wstageObjects, eingang:eingObjects };
  const liste = feuerListen[state.scene];
  if(liste){
    let bestD = 1e9;
    for(const o of liste){
      if(o.type==='fire' || o.type==='plazaFeuer'){
        const d = Math.hypot(player.x-o.x, player.y-(o.base||o.y));
        if(d<bestD) bestD = d;
      }
    }
    if(bestD < 130){
      feuerTickT -= dt;
      if(feuerTickT<=0){
        const naehe = clamp(1-bestD/130, 0, 1);
        feuerTickT = 0.5 + Math.random()*1.2 - naehe*0.5;
        laermImpuls(ambientGain, { freq:2200+Math.random()*1400, q:2.2,
          vol:0.03*naehe, dauer:0.03+Math.random()*0.03, typ:'bandpass' });
      }
    }
  }
}

// Schritte: kurzer, gefilterter Impuls, Klangfarbe je nach Untergrund
let letzterSchrittFrame = 0;
function schrittUpdate(){
  if(!audioBereit || !soundOn) return;
  if(!player.moving || (player.frame!==1 && player.frame!==3) || player.frame===letzterSchrittFrame){
    letzterSchrittFrame = player.frame;
    return;
  }
  letzterSchrittFrame = player.frame;
  let art = 'gras';
  if(state.scene==='tent') art = 'zelt';
  else if(state.scene==='camp' && tileIsPath(Math.floor(player.x/TILE), Math.floor(player.y/TILE))) art = 'weg';
  else if(state.scene!=='camp') art = 'weg';           // Foodcourt/Plaza/etc.: befestigter Boden
  const presets = {
    gras: { freq:950+Math.random()*250,  q:0.6, vol:0.045, dauer:0.075, typ:'lowpass' },
    weg:  { freq:2100+Math.random()*500, q:1.5, vol:0.055, dauer:0.045, typ:'bandpass' },
    zelt: { freq:480+Math.random()*140,  q:0.5, vol:0.035, dauer:0.09,  typ:'lowpass' }
  };
  laermImpuls(sfxGain, presets[art]);
}

/* ============ DJ-SOUNDCHECK: kleines Rhythmus-Minispiel ============
   Freigeschaltet über Vera, sobald man das Bändchen hat. Ein fester Beat
   läuft (synthetisch erzeugt wie der Rest des Sounds), man drückt im
   richtigen Moment die Interact-Taste. Timing entscheidet über die
   Stimmung im Publikum. */
const DJ_BPM = 128;
const DJ_BEATS = 24;
function djPultTalk(){
  if(!state.flags.djInvited){
    startDialog(lin([{ who:'sys', name:'', text:'Die Hauptbühne. Noch steht kein Mensch drauf, aber die Anlage brummt schon.' }]), {breakable:true});
    return;
  }
  if(state.clock.min < 18*60){
    startDialog(lin([{ who:'sys', name:'', text:'Noch nicht so weit. Vera meinte, ab 18 Uhr ist der Slot frei.' }]), {breakable:true});
    return;
  }
  startDialog(lin([{ who:'sys', name:'', text: state.flags.djDone
      ? 'Nochmal auflegen? Zum Üben schadet das nicht.'
      : 'Der Soundcheck-Slot. Auflegen?', choices:[
    { t:'Ja, los.', next:null, fx(){ starteDjSession(); } },
    { t:'Gleich vielleicht.', next:null }
  ] }]), {breakable:true});
}
function starteDjSession(kontext){
  const beatDur = 60/DJ_BPM;
  state.dj = {
    beatDur, naechsterBeat: state.time + beatDur, beatI: 0,
    letzteWertung: null, anzeigeT: 0,
    energie: 40, treffer: { perfekt:0, gut:0, verpasst:0 },
    kontext: kontext || 'vera'
  };
  state.mode = 'dj';
}
function djBeatSound(){
  laermImpuls(sfxGain, { freq:120, q:1.2, vol:0.16, dauer:0.09, typ:'lowpass' });
  toneImpuls(180, { dauer:0.05, vol:0.05, typ:'square' });
}
function djHitSound(gut){
  toneImpuls(gut?880:520, { dauer:0.07, vol:0.06, typ:'sine' });
}
function djUpdate(dt){
  const d = state.dj;
  d.anzeigeT = Math.max(0, d.anzeigeT - dt);
  // Beat abgelaufen, ohne dass gedrückt wurde -> verpasst gewertet
  if(state.time >= d.naechsterBeat){
    if(d.letzteWertung===null || d._diesBeatGewertet!==d.beatI){
      d.treffer.verpasst++; d.energie = Math.max(0, d.energie-2);
      d.letzteWertung='verpasst'; d.anzeigeT=0.35;
    }
    djBeatSound();
    d.beatI++;
    d._diesBeatGewertet = -1;
    d.naechsterBeat += d.beatDur;
    if(d.beatI >= DJ_BEATS){ beendeDjSession(); return; }
  }
  if(interactQueued){
    interactQueued = false;
    const abstand = Math.abs(state.time - d.naechsterBeat);   // Nähe zum nächsten Beat
    const abstandZurueck = Math.abs(state.time - (d.naechsterBeat - d.beatDur)); // ...oder zum letzten
    const naehe = Math.min(abstand, abstandZurueck);
    if(d._diesBeatGewertet !== d.beatI){
      let gut;
      if(naehe < 0.08){ d.treffer.perfekt++; d.energie=Math.min(100,d.energie+3); d.letzteWertung='perfekt'; gut=true; }
      else if(naehe < 0.18){ d.treffer.gut++; d.energie=Math.min(100,d.energie+1); d.letzteWertung='gut'; gut=true; }
      else { d.treffer.verpasst++; d.energie=Math.max(0,d.energie-2); d.letzteWertung='verpasst'; gut=false; }
      d.anzeigeT = 0.35;
      d._diesBeatGewertet = d.beatI;
      djHitSound(gut);
    }
  }
}
function beendeDjSession(){
  const d = state.dj;
  const gesamt = d.treffer.perfekt + d.treffer.gut + d.treffer.verpasst;
  const quote = gesamt ? (d.treffer.perfekt + d.treffer.gut*0.5) / gesamt : 0;
  let text, symBonus;
  if(d.kontext==='eigen'){
    // Die eigene Bühne hat noch kein Publikum – die Texte dürfen also
    // keins voraussetzen, anders als bei Veras Soundcheck vorm Zaun.
    if(d.energie>=75){ text='Das saß richtig gut. Fühlt sich an, als könntest du das wirklich.'; symBonus=4; }
    else if(d.energie>=45){ text='Ein paar Stellen holprig, aber insgesamt solide.'; symBonus=2; }
    else { text='Holprig. Aber du übst ja erst noch.'; symBonus=1; }
  } else {
    if(d.energie>=75){ text='Die ersten Leute vorm Zaun fangen an zu tanzen. Läuft!'; symBonus=4; }
    else if(d.energie>=45){ text='Kein Ausraster, aber ein paar Köpfe nicken mit.'; symBonus=2; }
    else { text='Holprig. Aber du warst oben, und niemand ist gegangen.'; symBonus=1; }
  }
  if(d.kontext==='eigen'){
    // Die eigene Bühne hat mit Vera und Rocco nichts zu tun – dafür ein
    // bisschen Energie/Sozial-Aufschwung, und eine eigene, einmalige Erinnerung.
    state.social = clamp(state.social + symBonus, 0, 100);
    if(!state.flags.eigeneBuehneGespielt){
      state.flags.eigeneBuehneGespielt = true;
      state.journal.memories.push('Zum ersten Mal auf der eigenen Bühne aufgelegt: '+text);
    }
  } else {
    addSympathy('vera', symBonus);
    addSympathy('rocco', Math.max(1, Math.round(symBonus/2)));
    if(!state.flags.djDone){
      state.flags.djDone = true;
      const m = state.journal.missions.find(m=>m.key==='dj');
      if(m) m.done = true;
      state.journal.memories.push('Ersten Soundcheck-Slot gespielt: '+text);
    }
  }
  state.mode = 'game';
  state.dj = null;
  startDialog(lin([{ who:'sys', name:'', text: text+' ('+d.treffer.perfekt+'x perfekt, '+d.treffer.gut+'x gut, '+d.treffer.verpasst+'x verpasst)' }]), {breakable:true});
}
function drawDj(){
  ctx.fillStyle='#0d0a14'; ctx.fillRect(0,0,GAME_W,GAME_H);
  ctx.textAlign='left';   // vorsichtshalber zurücksetzen, falls ein voriger Bildschirm es geändert hat
  const d = state.dj;
  // Energie-Balken oben: bei Vera echtes Publikum, bei der eigenen Bühne der eigene Flow
  ctx.font='bold 9px monospace'; ctx.fillStyle='#fdf3dc'; ctx.textBaseline='top';
  ctx.fillText(d.kontext==='eigen' ? 'FLOW' : 'PUBLIKUM', 14, 14);
  const barBreite = Math.max(80, Math.round(GAME_W*0.42));
  ctx.fillStyle='#3b2f2f'; ctx.fillRect(90,14,barBreite,10);
  ctx.fillStyle = d.energie>=75 ? '#5f9b4e' : d.energie>=45 ? '#c9a03f' : '#c9402f';
  ctx.fillRect(91,15,Math.round((barBreite-2)*d.energie/100),8);
  ctx.fillText(Math.round(d.energie)+'%', 96+barBreite, 14);
  // Beat-Zähler auf einer eigenen Zeile, damit es bei schmalen Bildschirmen
  // nicht mit der Prozentanzeige zusammenstößt.
  ctx.fillText('Beat '+Math.min(d.beatI+1,DJ_BEATS)+' / '+DJ_BEATS, 14, 28);
  // Pulsierender Kreis: Größe folgt dem Takt, Zenit = richtiger Moment
  const phase = 1 - clamp((d.naechsterBeat-state.time)/d.beatDur, 0, 1);   // 0 direkt nach Beat -> 1 kurz davor
  const radius = 20 + Math.sin(phase*Math.PI)*22;
  ctx.beginPath(); ctx.arc(GAME_W/2, GAME_H/2-10, radius, 0, Math.PI*2);
  ctx.fillStyle='rgba(233,140,80,0.28)'; ctx.fill();
  ctx.beginPath(); ctx.arc(GAME_W/2, GAME_H/2-10, 30, 0, Math.PI*2);
  ctx.strokeStyle='#e8c46a'; ctx.lineWidth=2; ctx.stroke();
  ctx.font='bold 10px monospace'; ctx.fillStyle='#e8c46a'; ctx.textAlign='center';
  ctx.fillText('E im Takt drücken', GAME_W/2, GAME_H/2+40);
  ctx.font='8px monospace'; ctx.fillStyle='#7a6a50';
  ctx.fillText('Esc zum Abbrechen', GAME_W/2, GAME_H-16);
  if(d.anzeigeT>0 && d.letzteWertung){
    const txt = d.letzteWertung==='perfekt' ? 'PERFEKT!' : d.letzteWertung==='gut' ? 'gut' : 'verpasst';
    ctx.fillStyle = d.letzteWertung==='perfekt' ? '#5f9b4e' : d.letzteWertung==='gut' ? '#c9a03f' : '#c9402f';
    ctx.font='bold 13px monospace';
    ctx.fillText(txt, GAME_W/2, GAME_H/2-70);
  }
  ctx.textAlign='left';
}

function update(dt){
  state.time+=dt;
  updateToasts(dt);
  state.whiteAlpha += (state.whiteTarget-state.whiteAlpha)*Math.min(1,dt*2.2);
  if(Math.abs(state.whiteAlpha-state.whiteTarget)<0.005) state.whiteAlpha=state.whiteTarget;
  // Augen gewöhnen sich langsam: Helligkeit gleitet zum Zielwert
  const eT = exposure();
  state.expo += (eT-state.expo)*Math.min(1,dt*2.6);
  if(Math.abs(eT-state.expo)<0.002) state.expo = eT;
  fadeUpdate(dt);
  ambientUpdate(dt);
  schrittUpdate();

  // Acid-Trip: zählt in "gefühlten Spielminuten" herunter. Früher hing das
  // an der laufenden Uhr – die steht jetzt still, also läuft es mit dem
  // gleichen Tempo wie vorher, aber unabhängig von der Uhrzeit weiter.
  if(state.trip.t>0){
    state.trip.t -= dt * CLOCK.SPEED;
    state.trip.gw -= dt;
    if(state.trip.gw<=0 && tripFactor()>0.6){
      state.trip.gw = 4+Math.random()*6;         // nächster Glitch in 4–10 s
      state.trip.glitch = 0.22;                  // Blitzdauer – lang genug, dass man den alten Stil sieht
      state.trip.glitchHue = Math.random()*360;  // Blitzfarbe
    }
    if(state.trip.glitch>0) state.trip.glitch -= dt;
    if(state.trip.t<=0){
      state.trip.t=0;
      if(state.high.t<=0) trail.length=0;
      toast('Die Farben beruhigen sich langsam wieder.');
      // Phase 2: Tomás hat es deutlich härter erwischt
      if(state.flags.tomasTripDone && !state.flags.tomasGrounded){
        state.flags.tomasBadTrip = true;
        toast('Tomás sah eben gar nicht gut aus...');
      }
    }
  }

  if(state.mode==='title'){ interactQueued=false; escQueued=false; return; }
  if(state.mode==='create'){ creation.t+=dt; interactQueued=false; escQueued=false; return; }
  if(state.mode==='fragebogen'){ interactQueued=false; escQueued=false; return; }
  if(state.mode==='dj'){
    if(escQueued){ escQueued=false; interactQueued=false; state.mode='game'; state.dj=null; return; }
    djUpdate(dt); return;
  }
  if(state.bauModus && state.scene==='ownstage' && escQueued){
    escQueued=false; state.bauModus=false; return;
  }
  if(state.helpTimer>0) state.helpTimer-=dt;
  if(escQueued){
    escQueued=false;
    if(!state.dialog && !state.cutscene){
      const auf = !state.menu;
      state.menu = state.menu ? null : {tab:'bag', sel:-1};
      toneImpuls(auf?440:330, {dauer:0.07, vol:0.045, typ:'triangle'});
      state.idleSince=0;
    }
  }
  if(state.menu){ interactQueued=false; return; }
  if(state.dialog){
    const d=state.dialog;
    if(!d.inputActive) d.chars += CFG.TYPE_SPEED*dt;
    if(interactQueued){ interactQueued=false; advanceDialog(); }
    particlesUpdate(dt); fireEmit(dt);
    return;
  }
  if(state.cutscene){
    introUpdate(dt); particlesUpdate(dt); fireEmit(dt);
    interactQueued=false;
    return;
  }
  // Während der Schwarzblende steht alles still, auch die Uhr
  if(state.fadeDir!==0){ player.moving=false; interactQueued=false; return; }
  // Die Uhr läuft nicht mehr von selbst – nur der Anzeige-Effekt für
  // einen gerade erfolgten Zeitsprung wird heruntergezählt.
  if(state.zeitSprung && state.zeitSprung.t>0){
    state.zeitSprung.t -= dt;
    if(state.zeitSprung.t<=0) state.zeitSprung = null;
  }
  if(state.excuseCool>0) state.excuseCool -= dt;
  // Im Zelt läuft nur das Nötige: laufen, Gegenstände, Statuswerte
  if(state.scene==='tent'){
    playerUpdate(dt);
    smokeUpdate(dt);
    statusUpdate(dt);
    particlesUpdate(dt);
    // Wer durch die Zeltöffnung nach unten läuft, steht wieder draußen
    if(player.y > TENT.H - 4 && player.x > 70 && player.x < 120){
      leaveTent();
      interactQueued=false;
      return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  // Auf dem Plaza: laufen, und an drei Seiten geht es weiter
  if(state.scene==='wald'){
    playerUpdate(dt);
    rempelUpdate(dt);
    naturUpdate(dt);
    smokeUpdate(dt);
    statusUpdate(dt);
    particlesUpdate(dt);
    waldWanderersUpdate(dt);
    waldChatsUpdate(dt);
    if(player.y > WALD.H*TILE - 22 && player.x > 10*TILE && player.x < 18*TILE){
      leaveWald(); interactQueued=false; return;              // runter zum Foodcourt
    }
    if(player.x < 2*TILE+6 && player.y > 8*TILE && player.y < 14*TILE){
      enterWaldStage(); interactQueued=false; return;         // links zur Waldbühne
    }
    if(player.y < 22 + 8 && player.x > 11*TILE && player.x < 17*TILE){
      enterStage(); interactQueued=false; return;             // hoch zur Mainstage
    }
    if(player.x > WALD.W*TILE - 26 && player.y > 8*TILE && player.y < 14*TILE){
      enterOwnStage(); interactQueued=false; return;           // rechts zur eigenen Bühne
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  // Auf der Waldbühne
  if(state.scene==='waldstage'){
    playerUpdate(dt);
    rempelUpdate(dt);
    naturUpdate(dt);
    smokeUpdate(dt);
    statusUpdate(dt);
    particlesUpdate(dt);
    if(player.x > WSTAGE.W*TILE - 26 && player.y > 8*TILE && player.y < 13*TILE){
      leaveWaldStage(); interactQueued=false; return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  // Auf der eigenen Bühne
  if(state.scene==='ownstage'){
    playerUpdate(dt);
    smokeUpdate(dt);
    statusUpdate(dt);
    particlesUpdate(dt);
    if(player.x < 24 && player.y > 8*TILE && player.y < 14*TILE){
      leaveOwnStage(); interactQueued=false; return;
    }
    if(state.bauModus){
      if(interactQueued){ interactQueued=false; bauAktion(); }
      return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  // Am Einlass
  if(state.scene==='eingang'){
    playerUpdate(dt);
    smokeUpdate(dt);
    statusUpdate(dt);
    particlesUpdate(dt);
    if(player.y < 22 + 10 && player.x > 10*TILE && player.x < 16*TILE){
      leaveEingang(); interactQueued=false; return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  // Im Foodcourt: laufen, Publikum, Kaffee
  if(state.scene==='food'){
    if(!spielerStehtAn()) playerUpdate(dt);   // in der Schlange steht man still
    zombieUpdate(dt);
    rempelUpdate(dt);
    smokeUpdate(dt);
    statusUpdate(dt);
    particlesUpdate(dt);
    foodCrowdUpdate(dt);
    for(const o of foodObjects) if(o.type==='teufel') teufelUpdate(o, dt);
    foodRunnersUpdate(dt);
    coffeeTeamUpdate(dt);
    coffeeUpdate(dt);
    // In der Schlange erreicht man den Van nicht mehr – E öffnet trotzdem
    if(spielerStehtAn()){
      currentCandidate = null;
      if(interactQueued){ interactQueued=false; vanTalk(); }
      return;
    }
    // Links unten hinaus geht es zurück zum Campingplatz
    if(!spielerStehtAn() && player.x < 3*TILE-6 && player.y > 22*TILE && player.y < 28*TILE){
      leaveFood();
      interactQueued=false;
      return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  // Auf dem Festivalgelände: laufen, Crew, Gegenstände
  if(state.scene==='stage'){
    playerUpdate(dt);
    npcUpdate(dt);           // damit auch Vera/Rocco auf "Excuse me" reagieren
    rempelUpdate(dt);
    smokeUpdate(dt);
    statusUpdate(dt);
    particlesUpdate(dt);
    // Wer unten durch die Lücke läuft, geht zurück zum Campingplatz
    if(player.y > STAGE.H*TILE - 22 && player.x > 17*TILE && player.x < 23*TILE){
      leaveStage();
      interactQueued=false;
      return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  playerUpdate(dt);
  // High-Zustand: Zeit läuft nur beim aktiven Spielen ab
  if(state.high.t>0){
    state.high.t -= dt;
    // Glitzer-Partikel schweben um die Figur
    state.high.spark = (state.high.spark||0) - dt;
    if(state.high.spark<=0 && highFactor()>0.3){
      state.high.spark = 0.22;
      particles.push({ x:player.x+(Math.random()*60-30), y:player.y-(Math.random()*22),
        vx:(Math.random()-0.5)*4, vy:-5-Math.random()*6, life:2.2,
        col:pick(['rgba(255,214,140,0.7)','rgba(255,170,190,0.6)','rgba(170,220,255,0.6)','rgba(200,255,180,0.6)']),
        size:1+Math.floor(Math.random()*2) });
    }
    if(state.high.t<=0){
      state.high.t=0;
      if(state.trip.t<=0) trail.length=0;
      toast('Langsam wird dein Kopf wieder klar.');
      // Phase 2: Kobi geht es inzwischen gar nicht gut
      if(state.flags.kobiJointDone && !state.flags.kobiCalmed){
        state.flags.kobiBadTrip = true;
        toast('Irgendwas sagt dir: Schau mal nach Kobi.');
      }
    }
  }

  tripAnimalsUpdate(dt);
  // Nachzieheffekt: Positionen der letzten Momente merken
  if((highFactor()>0 || tripFactor()>0) && player.moving){
    trail.push({ x:player.x, y:player.y, facing:player.facing, frame:player.frame });
    const cap = tripFactor()>0 ? 20 : 10;        // Acid: deutlich längerer Trail
    while(trail.length>cap) trail.shift();
  } else if(state.high.t<=0 && state.trip.t<=0 && trail.length) trail.length=0;
  npcUpdate(dt);
  wanderersUpdate(dt);
  rempelUpdate(dt);
  naturUpdate(dt);
  chatsUpdate(dt);
  smokeUpdate(dt);
  statusUpdate(dt);
  particlesUpdate(dt);
  fireEmit(dt);
  findCandidate();
  if(interactQueued){ interactQueued=false; tryInteract(); }
}
/* --- Das Zeltinnere zeichnen: der Raum ist kleiner als der Bildschirm
       und wird deshalb mittig eingepasst statt von der Kamera verfolgt. --- */
function drawIndoor(){
  // Kamera so setzen, dass der Raum in der Mitte sitzt
  camX = -Math.round((GAME_W - TENT.W)/2);
  camY = -Math.round((GAME_H - TENT.H)/2);
  // Dunkler Rand außerhalb der Plane
  ctx.fillStyle='#15111f'; ctx.fillRect(0,0,GAME_W,GAME_H);
  ctx.save();
  ctx.translate(-camX,-camY);
  drawTentInterior();
  // Gegenstände und Spieler nach Tiefe sortiert
  const list=[];
  for(const o of tentObjects){ if(o.type!=='exit') list.push({y:o.base, f:()=>drawTentObject(o)}); }
  list.push({y:player.y, f:()=>drawEntity(player)});
  list.sort((a,b)=>a.y-b.y);
  for(const it of list) it.f();
  // E-Hinweis über dem Gegenstand, vor dem du stehst
  if(currentCandidate && !state.dialog && !state.menu){
    const c=currentCandidate;
    ctx.font='bold 9px monospace'; ctx.textBaseline='top';
    const w=ctx.measureText('E').width+8;
    ctx.fillStyle='rgba(30,25,40,0.72)'; ctx.fillRect(c.x-w/2, c.y, w, 12);
    ctx.fillStyle='#e8c46a'; ctx.fillText('E', c.x-w/2+4, c.y+2);
  }
  ctx.restore();
  drawLighting();
  zeichneAcidWelle();
  zeichneHighSchleier();
  drawHUD();
  drawTouchPad();
  drawTouchButton();
  if(state.dialog) drawDialog();
  if(state.menu) drawMenu();
  drawToasts();
  drawFade();
}

/* --- Schwarzblende beim Wechsel zwischen drinnen und draußen --- */
function drawFade(){
  if(state.fade <= 0.002) return;
  ctx.fillStyle = 'rgba(12,10,18,'+Math.min(1,state.fade).toFixed(3)+')';
  ctx.fillRect(0,0,GAME_W,GAME_H);
}

function draw(){
  // Kurzer Rückfall in den alten Grafikstil, solange der Glitch blitzt
  retroStil = state.trip.glitch > 0 && tripFactor() > 0.25;
  uiRegions.length=0;
  ctx.fillStyle='#241f2e'; ctx.fillRect(0,0,GAME_W,GAME_H);
  if(state.mode==='title'){ drawTitle(); drawToasts(); return; }
  if(state.mode==='create'){ drawCreation(); drawToasts(); return; }
  if(state.mode==='fragebogen'){ drawFragebogen(); drawToasts(); return; }
  if(state.mode==='dj'){ drawDj(); drawToasts(); return; }
  if(state.scene==='tent'){ drawIndoor(); return; }
  if(state.scene==='stage'){ drawStage(); return; }
  if(state.scene==='food'){ drawFood(); return; }
  if(state.scene==='wald'){ drawWald(); return; }
  if(state.scene==='waldstage'){ drawWaldStageScene(); return; }
  if(state.scene==='ownstage'){ drawOwnStage(); return; }
  if(state.scene==='eingang'){ drawEingang(); return; }
  camX=clamp(Math.round(player.x-GAME_W/2), 0, MAPW*TILE-GAME_W);
  camY=clamp(Math.round(player.y-GAME_H/2-10), 0, MAPH*TILE-GAME_H);
  const hf = highFactor();
  const tf = tripFactor();
  const camF = Math.max(hf, tf);
  ctx.save();
  if(camF>0){
    // Sanftes 'Atmen': pulsiert zwischen 1,00 und 1,02 (nie unter 1,
    // damit keine Kartenränder ins Bild rutschen)
    const puls = 1 + (Math.sin(state.time*1.2)*0.5+0.5)*0.02*camF;
    // Neigung und Schweben – im Acid-Trip deutlich stärker als beim High
    const rot = Math.sin(state.time*0.6)*(0.01*hf + 0.018*tf);
    ctx.translate(GAME_W/2, GAME_H/2); ctx.scale(puls,puls); ctx.rotate(rot); ctx.translate(-GAME_W/2,-GAME_H/2);
    ctx.translate(Math.sin(state.time*0.8)*(3*hf+5*tf), Math.cos(state.time*0.55)*(2*hf+4*tf));
  }
  ctx.translate(-camX,-camY);
  ctx.drawImage(bodenBild(ground),0,0);
  for(const s of stubsOnGround) drawStub(s);
  // Nachzieheffekt: verblasste 'Geister' der letzten Positionen
  const trailF = Math.max(hf, tf);
  if(trailF>0){
    const stp = tf>0 ? 1 : 2;                     // Acid: jeder Geist, Weed: jeder zweite
    for(let i=0;i<trail.length;i+=stp){
      const g=trail[i];
      ctx.globalAlpha = (0.05 + (tf>0?0.16:0.10)*(i/trail.length)) * trailF;
      drawEntity({ x:g.x, y:g.y, facing:g.facing, moving:true, frame:g.frame,
                   pal:player.pal, gridSet:player.gridSet });
    }
    ctx.globalAlpha=1;
  }
  const list=[];
  // Hüllfunktion: lässt ein Objekt im Acid-Trip leicht 'atmen'
  // (jedes mit eigener Phase über seine x-Position, Fußpunkt bleibt stehen)
  const wob=(x,base,f)=>()=>{
    if(tf<=0){ f(); return; }
    const p=1+Math.sin(state.time*1.6 + x*0.13)*0.05*tf;
    ctx.save(); ctx.translate(x,base); ctx.scale(p,p); ctx.translate(-x,-base); f(); ctx.restore();
  };
  for(const o of objects){
    if(o.type==='tree'||o.type==='bush') list.push({y:o.base, f:wob(o.x,o.base,()=>drawObject(o))});
    else list.push({y:o.base, f:()=>drawObject(o)});
  }
  list.push({y:player.y, f:drawPlayerEnt});
  for(const n of npcs){
    let base = ()=>drawEntity(n);
    if(n.id==='kobi'  && state.flags.kobiBadTrip  && !state.flags.kobiCalmed)   base = ()=>drawKobiCrouch(n);
    if(n.id==='tomas' && state.flags.tomasBadTrip && !state.flags.tomasGrounded) base = ()=>drawTomasPanic(n);
    list.push({y:n.y, f:wob(n.x,n.y,base)});
  }
  for(const a of tripAnimals) list.push({y:a.y, f:()=>drawAnimal(a)});
  naturInListe(list);
  // Wer gerade in seinem Zelt ist, wird nicht gezeichnet
  for(const w of wanderers) if(w.phase!=='drin') list.push({y:w.y, f:wob(w.x,w.y,()=>drawGruppenMitglied(w))});
  list.sort((a,b)=>a.y-b.y);
  for(const it of list) it.f();
  // Sprechblasen über allen Figuren, damit sie niemand verdeckt
  for(const n of npcs) drawChatBubble(n);
  for(const w of wanderers){ drawChatBubble(w); drawTextBubble(w); }
  drawTextBubble(player);
  for(const p of particles){
    ctx.fillStyle=p.col;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
  }
  drawBunting(96,56,176,42);      // Wimpel im Spieler-Camp
  drawBunting(560,378,640,392);   // Wimpel im Camp im Südosten
  ctx.restore();
  // Beleuchtung liegt auf der Welt – der Acid-Trip verzerrt sie danach mit
  drawLighting();
  zeichneAcidWelle();
  // 'E'-Hinweis über interagierbaren Dingen
  if(!state.dialog && !state.menu && !state.cutscene && currentCandidate){
    const bx=Math.round(currentCandidate.x-camX)-5, by=Math.round(currentCandidate.y-camY)-12;
    ctx.fillStyle='#fdf3dc'; ctx.fillRect(bx,by,11,12);
    ctx.fillStyle='#5a4632';
    ctx.fillRect(bx,by,11,1); ctx.fillRect(bx,by+11,11,1);
    ctx.fillRect(bx,by,1,12); ctx.fillRect(bx+10,by,1,12);
    ctx.font='bold 8px monospace'; ctx.fillStyle='#5a4632'; ctx.textBaseline='top';
    ctx.fillText('E',bx+3,by+2);
  }
  drawSmokeBubble();
  // Warmer Farbfilter während des Highs (über der Welt, unter HUD und Dialogen)
  if(hf>0){
    ctx.fillStyle='rgba(255,168,70,'+(CFG.HIGH_TINT_ALPHA*hf).toFixed(3)+')';
    ctx.fillRect(0,0,GAME_W,GAME_H);
    // Farbschimmer am Bildrand, der langsam durchs Farbspektrum wandert
    const hue=(state.time*16)%360;
    const vg=ctx.createRadialGradient(GAME_W/2,GAME_H/2,110,GAME_W/2,GAME_H/2,300);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'hsla('+hue.toFixed(0)+',75%,62%,'+(0.20*hf).toFixed(3)+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,GAME_W,GAME_H);
  }
  // Acid: kräftigere Regenbogen-Vignette (zwei Farbtöne, dreimal schnellerer Lauf)
  if(tf>0){
    const hue2=(state.time*48)%360;
    const vg2=ctx.createRadialGradient(GAME_W/2,GAME_H/2,80,GAME_W/2,GAME_H/2,300);
    vg2.addColorStop(0,'rgba(0,0,0,0)');
    vg2.addColorStop(0.6,'hsla('+((hue2+120)%360).toFixed(0)+',85%,60%,'+(0.10*tf).toFixed(3)+')');
    vg2.addColorStop(1,'hsla('+hue2.toFixed(0)+',85%,60%,'+(0.28*tf).toFixed(3)+')');
    ctx.fillStyle=vg2; ctx.fillRect(0,0,GAME_W,GAME_H);
    // Gelegentlicher Farbblitz mit zwei verrutschten Bildstreifen
    if(state.trip.glitch>0){
      ctx.fillStyle='hsla('+state.trip.glitchHue.toFixed(0)+',90%,65%,'+(0.16*tf).toFixed(3)+')';
      ctx.fillRect(0,0,GAME_W,GAME_H);
      const gy=(state.trip.glitchHue*1.7)%(GAME_H-40);
      ctx.drawImage(canvas, 0,gy,GAME_W,10, 6,gy,GAME_W,10);
      ctx.drawImage(canvas, 0,gy+22,GAME_W,8, -5,gy+22,GAME_W,8);
    }
  }
  // Intro-Überblendung liegt über allem (nur während der Cutscene aktiv)
  if(state.whiteAlpha>0.004){
    ctx.fillStyle='rgba(255,247,225,'+state.whiteAlpha.toFixed(3)+')';
    ctx.fillRect(0,0,GAME_W,GAME_H);
  }
  drawHUD();
  drawTouchPad();
  drawTouchButton();
  if(state.dialog) drawDialog();
  if(state.menu) drawMenu();
  drawToasts();
  drawFade();
  if(state.helpTimer>0 && !state.dialog && !state.menu){
    ctx.font='8px monospace'; ctx.textBaseline='top';
    const msg='WASD · E: reden · I: Menü · B: Brille · F: Lampe · R: Rad';
    const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(30,25,40,0.6)'; ctx.fillRect(GAME_W/2-w/2-5,GAME_H-17,w+10,13);
    ctx.fillStyle='#fdf3dc'; ctx.fillText(msg,GAME_W/2-w/2,GAME_H-14);
  }
}

/* --- Eingaben --- */
const keys={};
let interactQueued=false, escQueued=false;
const uiRegions=[];
function region(x,y,w,h,cb){ uiRegions.push({x,y,w,h,cb}); }

addEventListener('keydown', e=>{
  tonFreigeben();
  if(document.activeElement===nameInput || document.activeElement===friendInput){
    if(e.key==='Enter'){
      e.preventDefault();
      if(document.activeElement===nameInput) confirmCreation(); else submitFriendName();
    }
    return;
  }
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(state.dialog && state.dialog.choiceCount>0){
    if(k==='arrowup'||k==='w'){
      state.dialog.choiceIdx=(state.dialog.choiceIdx-1+state.dialog.choiceCount)%state.dialog.choiceCount;
      return;
    }
    if(k==='arrowdown'||k==='s'){
      state.dialog.choiceIdx=(state.dialog.choiceIdx+1)%state.dialog.choiceCount;
      return;
    }
  }
  keys[k]=true;
  if(k==='e'||k===' '||k==='enter') interactQueued=true;
  if(k==='i'||k==='escape') escQueued=true;
  if(k==='b' && !state.dialog && !state.cutscene && !state.menu){ toggleGlasses(); state.idleSince=0; }
  if(k==='q' && !state.dialog && !state.cutscene && !state.menu){ excuseMe(); state.idleSince=0; }
  if(k==='g' && !state.cutscene){ state.rasterAn = !state.rasterAn; toast(state.rasterAn?'Raster an (G)':'Raster aus'); }
  if(k==='f' && !state.dialog && !state.cutscene && !state.menu){ toggleLamp(); state.idleSince=0; }
  if(k==='r' && !state.dialog && !state.cutscene && !state.menu){ toggleBike(); state.idleSince=0; }
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

canvas.addEventListener('click', e=>{
  tonFreigeben();
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)/SCALE, my=(e.clientY-r.top)/SCALE;
  for(let i=uiRegions.length-1;i>=0;i--){
    const u=uiRegions[i];
    if(mx>=u.x && mx<u.x+u.w && my>=u.y && my<u.y+u.h){ u.cb(); return; }
  }
  if(state.dialog) advanceDialog();
});
addEventListener('resize', fitCanvas);
// Rotation des Handys: sofort anpassen und nochmal kurz danach
// (manche Browser melden direkt nach dem Drehen noch die alte Größe)
addEventListener('orientationchange', ()=>{ fitCanvas(); setTimeout(fitCanvas, 250); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
document.addEventListener('fullscreenchange', ()=>setTimeout(fitCanvas,60));
document.addEventListener('webkitfullscreenchange', ()=>setTimeout(fitCanvas,60));
// Pinch-Zoom unterbinden (iOS Safari ignoriert 'user-scalable=no' teilweise)
document.addEventListener('gesturestart', e=>e.preventDefault());
// Kontextmenü bei langem Fingerdruck auf dem Spielfeld unterbinden
canvas.addEventListener('contextmenu', e=>e.preventDefault());

/* ============ TOUCH-STEUERUNG (virtueller Joystick) ============ */
// Erkennung: Ist das ein Touch-Gerät? Auf dem Laptop mit Maus bleibt alles unsichtbar.
const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
// Ob die Bedienelemente auf dem Bildschirm angezeigt werden – lässt sich abschalten
let touchUI = (localStorage.getItem('dataluma_touchui') ?? (IS_TOUCH ? '1' : '0')) === '1';
function touchUIUmschalten(){
  touchUI = !touchUI;
  try{ localStorage.setItem('dataluma_touchui', touchUI ? '1':'0'); }catch(e){}
  toast(touchUI ? 'Bildschirm-Steuerung an.' : 'Bildschirm-Steuerung aus.');
}

// Aktueller Zustand: dx/dy ist die Richtung, in die der Finger drückt (-1 bis 1)
const touch = { id:null, dx:0, dy:0 };
// Position & Größe des Joysticks unten links (in Spiel-Pixeln, nicht Bildschirm-Pixeln)
const PAD = { x:56, y:GAME_H-56, r:34, knob:13, dead:8 };   // Lage wird in layoutTouchControls gesetzt
// Interaktions-Button unten rechts (macht dasselbe wie die E-Taste)
const BTN_A = { x:GAME_W-48, y:GAME_H-48, r:22 };

// Rechnet eine Finger-Position vom Bildschirm in Spiel-Koordinaten um
function touchPos(t){
  const r = canvas.getBoundingClientRect();
  return { x:(t.clientX-r.left)/SCALE, y:(t.clientY-r.top)/SCALE };
}
// Berechnet aus der Fingerposition die Laufrichtung, gerastet auf 8 Richtungen
function setStick(px,py){
  const dx=px-PAD.x, dy=py-PAD.y;
  if(Math.hypot(dx,dy) < PAD.dead){ touch.dx=0; touch.dy=0; return; }  // tote Zone in der Mitte
  const snap = Math.round(Math.atan2(dy,dx)/(Math.PI/4)) * (Math.PI/4);
  touch.dx = Math.round(Math.cos(snap)*100)/100;
  touch.dy = Math.round(Math.sin(snap)*100)/100;
}
canvas.addEventListener('touchstart', e=>{
  tonFreigeben();
  for(const t of e.changedTouches){
    const p=touchPos(t);
    // Interaktions-Button gedrückt? Wirkt wie ein Druck auf die E-Taste.
    if(state.mode==='game' && !state.menu && Math.hypot(p.x-BTN_A.x, p.y-BTN_A.y) < BTN_A.r+6){
      interactQueued=true;
      e.preventDefault();
      continue;
    }
    // Nur Berührungen in der Nähe des Joysticks steuern ihn (Rest bleibt für Antippen frei)
    if(touch.id===null && Math.hypot(p.x-PAD.x, p.y-PAD.y) < PAD.r*1.8){
      touch.id=t.identifier;
      setStick(p.x,p.y);
      e.preventDefault();   // verhindert Scrollen/Zoomen während des Steuerns
    }
  }
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    if(t.identifier===touch.id){ const p=touchPos(t); setStick(p.x,p.y); e.preventDefault(); }
  }
},{passive:false});
function releaseStick(e){
  for(const t of e.changedTouches){
    if(t.identifier===touch.id){ touch.id=null; touch.dx=0; touch.dy=0; }
  }
}
canvas.addEventListener('touchend', releaseStick);
canvas.addEventListener('touchcancel', releaseStick);

// Zeichnet den Joystick (halbtransparent, Knopf folgt dem Finger)
function drawTouchPad(){
  if(!touchUI || state.mode!=='game' || state.dialog || state.menu || state.cutscene) return;
  ctx.globalAlpha=0.45;
  pixCircle(PAD.x, PAD.y, PAD.r,   '#3b2f2f');   // dunkler Ring
  pixCircle(PAD.x, PAD.y, PAD.r-3, '#fdf3dc');   // helle Fläche
  ctx.fillStyle='#8a7a5e';                        // vier Richtungs-Markierungen
  ctx.fillRect(PAD.x-1, PAD.y-PAD.r+6, 2, 5);
  ctx.fillRect(PAD.x-1, PAD.y+PAD.r-11, 2, 5);
  ctx.fillRect(PAD.x-PAD.r+6, PAD.y-1, 5, 2);
  ctx.fillRect(PAD.x+PAD.r-11, PAD.y-1, 5, 2);
  const kx=PAD.x+touch.dx*(PAD.r-15), ky=PAD.y+touch.dy*(PAD.r-15);
  pixCircle(kx, ky, PAD.knob,   '#5a4632');       // Knopf
  pixCircle(kx, ky, PAD.knob-3, '#e8944a');
  ctx.globalAlpha=1;
}
// Zeichnet den Interaktions-Button (leuchtet auf, wenn etwas in Reichweite ist)
function drawTouchButton(){
  if(!touchUI || state.mode!=='game' || state.menu || state.cutscene) return;
  const active = !state.dialog && !!currentCandidate;   // etwas Ansprechbares in der Nähe?
  ctx.globalAlpha = (active || state.dialog) ? 0.9 : 0.4;
  pixCircle(BTN_A.x, BTN_A.y, BTN_A.r,   '#3b2f2f');
  pixCircle(BTN_A.x, BTN_A.y, BTN_A.r-3, active ? '#e8944a' : '#fdf3dc');
  ctx.font='bold 12px monospace'; ctx.textBaseline='top';
  ctx.fillStyle = active ? '#fdf3dc' : '#5a4632';
  ctx.fillText('E', BTN_A.x-4, BTN_A.y-6);
  ctx.globalAlpha=1;
}

/* --- Start --- */
buildWorld();
buildStage();
buildFood();
buildWald();
buildWaldStage();
// Alle festen Figuren aufs Kachelraster ausrichten. Sie standen frei
// platziert daneben (bis zu 8px), wodurch beim kachelweisen Anlaufen von
// der ungünstigen Seite eine unschöne Lücke von ~11px statt 3px entstand.
function figurenAufsRasterSetzen(){
  for(const n of [...npcs, ...stageNpcs]){
    const k = kachelVon(n.x, n.y);
    const m = kachelMitte(k.tx, k.ty);
    n.x = m.x; n.y = m.y;
    n.heimX = m.x; n.heimY = m.y;      // Heimatplatz merken (für "Excuse me")
  }
}
buildOwnStage();
buildEingang();
buildCoffeeTeam();
addNPC('harvey','Harvey',120,116,HARVEY_PAL,HARVEY_GRIDS,PORTRAIT_HARVEY,PORTRAIT_HARVEY_PAL,harveyTalk);
addNPC('friend','???',588,468,SPR_STELLA.pal,STELLA_GRIDS,PORTRAIT_PLAYER,PORTRAIT_FRIEND_PAL,friendTalk);
addNPC('kobi','Kobi',632,86,KOBI_PAL,HERO_GRIDS,PORTRAIT_PLAYER,PORTRAIT_KOBI_PAL,kobiTalk);
addNPC('tomas','Tomás',604,90,TOMAS_PAL,HERO_GRIDS,PORTRAIT_PLAYER,PORTRAIT_TOMAS_PAL,tomasTalk);
addNPC('momo','Momo',252,432,MOMO_PAL,HERO_GRIDS,PORTRAIT_PLAYER,PORTRAIT_MOMO_PAL,momoTalk);
addNPC('kip','Kip',312,428,KIP_PAL,HERO_GRIDS,PORTRAIT_PLAYER,PORTRAIT_KIP_PAL,kipTalk);
DATE_NPCS.forEach(baueDateNpc);
// Die Campingplatz-Figuren werden erst hier angelegt – also nach
// verteileCamp(). Sie müssen deshalb separat mitgestreckt werden, sonst
// stehen sie noch an den alten, engen Plätzen (z.B. Harvey).
for(const n of npcs){
  n.x = Math.round((n.x-8)/TILE*CAMP_STRECKUNG)*TILE + 8;
  n.y = Math.round(n.y/TILE*CAMP_STRECKUNG)*TILE;
}
figurenAufsRasterSetzen();   // erst wenn wirklich alle Figuren existieren
alleKachelSperrenBauen();    // Sperrkarte für die Freiplatz-Suche unten
// Nach dem Strecken kann eine Figur in einem Hindernis stehen (z.B. weil
// ein Zelt woanders gerundet wurde). Solche Figuren rücken auf die nächste
// freie Kachel – sonst sind sie nicht mehr ansprechbar.
(function figurenAusHindernissenHolen(){
  const merk = state.scene; state.scene = 'camp';
  for(const n of npcs){
    const k = kachelVon(n.x, n.y);
    if(!kachelGesperrt(k.tx, k.ty)) continue;
    let gefunden = null;
    for(let r=1; r<=4 && !gefunden; r++){
      for(let dx=-r; dx<=r && !gefunden; dx++) for(let dy=-r; dy<=r; dy++){
        if(Math.abs(dx)!==r && Math.abs(dy)!==r) continue;      // nur der Ring
        const tx=k.tx+dx, ty=k.ty+dy;
        if(tx<1||ty<1||tx>=MAPW-1||ty>=MAPH-1) continue;
        if(kachelGesperrt(tx,ty)) continue;
        gefunden = kachelMitte(tx,ty); break;
      }
    }
    if(gefunden){ n.x=gefunden.x; n.y=gefunden.y; n.heimX=gefunden.x; n.heimY=gefunden.y; }
  }
  state.scene = merk;
})();
alleKachelSperrenBauen();    // Kachel-Kollisionskarte je Szene vorberechnen
player.pal=playerPal();
fitCanvas();
// Spielstände aus der Zeit übernehmen, als das Spiel noch anders hieß
try {
  for(let n=1;n<=SAVE_SLOTS;n++){
    const alt = speicherLesen('festivalfieber_save_'+n);
    if(alt && !speicherLesen(slotKey(n))) speicherSchreiben(slotKey(n), alt);
  }
  const legacy = speicherLesen('festivalfieber_save');
  if(legacy && !speicherLesen(slotKey(1))) speicherSchreiben(slotKey(1), legacy);
} catch(err) {}
// Das Spiel startet immer mit der Slot-Auswahl
state.mode='title';
let last=performance.now();
function frameLoop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  draw();
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
</script>
