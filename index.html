/* ============ 2. HILFSFUNKTIONEN ============ */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
// Kleiner deterministischer Zufallsgenerator (damit die Wiese immer gleich aussieht)
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function deNum(v){ return (Math.round(v*10)/10).toString().replace('.',','); }

/* --- Spiel-Uhr: läuft NICHT mehr von selbst. Zeit vergeht nur noch in
   Sprüngen, wenn die Geschichte voranschreitet (Mission erledigt, Gig
   besucht, schlafen gehen). Siehe zeitVor(). --- */
const CLOCK = {
  // Nur noch als Umrechnungsfaktor für Dinge, die "gefühlte Spielzeit"
  // brauchen (z.B. wie lange sich ein Trip anfühlen soll).
  SPEED: 0.8,
  DUSK_START: 19,  // ab hier wird es langsam dunkel
  DUSK_END:   21,  // ab hier volle Nacht
  DAWN_START:  5,  // ab hier wird es langsam hell
  DAWN_END:    7   // ab hier voller Tag
};
// Das Festival beginnt am Dienstag und läuft eine Woche.
const WOCHENTAGE = ['Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag','Montag'];
function wochentag(){ return WOCHENTAGE[(state.clock.day-1) % 7]; }
function istLetzterTag(){ return state.clock.day >= 7; }
// Zeit springt vorwärts – der einzige Weg, wie Zeit vergeht.
// grund: kurzer Text, der dem Spieler zeigt, wodurch Zeit verging.
function zeitVor(minuten, grund){
  const c = state.clock;
  c.min += minuten;
  while(c.min >= 1440){ c.min -= 1440; c.day++; }
  state.zeitSprung = { t: 1.6, text: grund || '', minuten };
  if(grund) toast(grund);
}
// Aktuelle Uhrzeit als "21:47"
function clockText(){
  const total = Math.floor(state.clock.min + 1e-6);
  const h = Math.floor(total/60) % 24, m = total % 60;
  return (h<10?'0':'')+h + ':' + (m<10?'0':'')+m;
}
// Wie dunkel ist es gerade? 0 = heller Tag, 1 = tiefste Nacht
function darkness(){
  const h = state.clock.min / 60;
  if(h >= CLOCK.DUSK_END || h < CLOCK.DAWN_START) return 1;             // Nacht
  if(h >= CLOCK.DUSK_START)                                              // Abenddämmerung
    return (h - CLOCK.DUSK_START) / (CLOCK.DUSK_END - CLOCK.DUSK_START);
  if(h < CLOCK.DAWN_END)                                                 // Morgendämmerung
    return 1 - (h - CLOCK.DAWN_START) / (CLOCK.DAWN_END - CLOCK.DAWN_START);
  return 0;                                                              // Tag
}

/* --- Helligkeitsmodell ---
   Die Umgebung ist tagsüber gleißend hell (+) und nachts dunkel (-).
   Die Sonnenbrille zieht immer denselben festen Betrag ab.
   Tags gleicht sie die Blendung genau aus, nachts macht sie es zu dunkel. */
const GLASSES_TINT = 0.5;   // so viel schluckt die Brille, immer
function ambientLight(){
  // Im Zelt kommt nur wenig Licht durch die Plane: tagsüber dämmrig, nachts fast schwarz
  if(state.scene==='tent') return -0.28 - 0.60 * darkness();
  return GLASSES_TINT * (1 - darkness()) - CFG.NIGHT_DARK * darkness();
}
// Was am Ende auf dem Bildschirm landet: >0 blendet weiß, <0 ist Dunkelheit
function exposure(){
  return ambientLight() - (state.wearingGlasses ? GLASSES_TINT : 0);
}
// Hellt eine Hex-Farbe auf (f > 0) oder dunkelt sie ab (f < 0), f zwischen -1 und 1
function shade(hex, f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const t = f<0 ? 0 : 255, a = Math.abs(f);
  r=Math.round(r+(t-r)*a); g=Math.round(g+(t-g)*a); b=Math.round(b+(t-b)*a);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

// Ergänzt eine vorhandene Figurenpalette um die Töne, die das neue Sprite braucht.
// So behalten Charaktereditor und alle NPCs ihre eigenen Farben.
function heldenPalette(pal){
  const p = Object.assign({}, pal);
  p.o = '#151015';                                   // harter dunkler Umriss
  const hose = pal.p || '#474c66';
  p.n = hose;              p.N = shade(hose,-0.22);  // Mütze und Hose
  p.h = pal.h;             p.d = pal.d;              // Haar wie gehabt
  p.M = shade(pal.h,-0.12); p.R = shade(pal.d,-0.34);
  p.s = pal.s;             p.S = pal.S;
  p.A = shade(pal.s,-0.14);                          // Wange
  p.w = '#ffffff';         p.W = '#ebebeb';
  p.i = '#e1b83d';         p.I = '#c7b26d';          // Augen
  p.x = '#78524e';         // Lidschatten im Profil
  p.l = pal.c;             p.L = shade(pal.c,-0.16); // Shirt
  p.J = shade(pal.k,-0.35);                          // offene Jacke
  p.u = '#5e747e';         p.U = '#546770';          // Gürtel
  p.r = '#af5f56';         p.v = '#0072a6';          // Anstecker
  p.y = '#ffde70';                                   // gelber Anstecker
  return p;
}

// Zeichnet ein Text-Bild Pixel für Pixel auf den Canvas.
// cell = Größe einer Zelle in Canvas-Pixeln (0.5 für hochauflösende Sprites)
function drawGrid(grid, pal, dx, dy, flip, cell){
  cell = cell || 1;
  for(let r=0; r<grid.length; r++){
    const row = grid[r];
    for(let c=0; c<row.length; c++){
      const col = pal[row[c]];
      if(col){
        ctx.fillStyle = col;
        ctx.fillRect(dx + (flip ? row.length-1-c : c)*cell, dy + r*cell, cell, cell);
      }
    }
  }
}

function baueDateNpc(def){
  const skin=SKINS[def.skin], hair=HAIRS[def.hair], outfit=OUTFITS[def.outfit];
  let gridSet, pal, portrait=PORTRAIT_PLAYER, pPal;
  if(def.gridSet==='hero'){
    gridSet = HERO_GRIDS;
    pal = bastelHeldenPal(skin,hair,outfit);
  } else {
    gridSet = NPC1_GRIDS;
    pal = bastelNpc1Pal(skin,hair,outfit, NPC1_AUGEN[def.augen]);
  }
  pPal = bastelPortraitPal(skin,hair,outfit);
  addNPC(def.id, def.name, def.x, def.y, pal, gridSet, portrait, pPal, ()=>dateNpcTalk(def.id));
}
// Gespräch mit einer der zehn datebaren Figuren: erst kennenlernen, dann
// normales Geplauder, ab einer Sympathieschwelle eine Verabredungs-Option.
const DATE_SCHWELLE = 5;
function dateNpcTalk(id){
  const def = DATE_NPCS.find(d=>d.id===id);
  const s = state.sympathy.find(s=>s.id===id);
  if(s.name==='???'){
    registriereKontakt(id, def.name);
    startDialog(lin([
      { who:id, text:'Hey, ich bin '+def.name+'.' },
      { who:id, text: pick(def.lines) }
    ]), {breakable:true});
    return;
  }
  const r = state.romance[id] || (state.romance[id] = {});
  // Ab genug Sympathie schenkt die Person dir ihren Ravestick, damit sie
  // dich im Gedränge auf dem Dancefloor wiederfindet.
  const meinStick = RAVESTICKS.find(rs=>rs.person===id);
  if(meinStick && !state.flags['stick_geschenkt_'+id] && s.val >= 3 && !getItem(meinStick.id)){
    state.flags['stick_geschenkt_'+id] = true;
    giveItem(meinStick.id, 1);
    state.journal.memories.push(def.name+' hat dir einen Ravestick in '+meinStick.name+' geschenkt.');
    startDialog(lin([
      { who:id, text:'Warte – nimm den hier mit.' },
      { who:'sys', name:'', text:'Du hast einen RAVESTICK ('+meinStick.name.toUpperCase()+') erhalten!' },
      { who:id, text:'Wenn du den auf dem Dancefloor dabeihast, seh ich dich im Gedränge. Dann komm ich zu dir.' }
    ]), {breakable:true});
    return;
  }
  // Verabredung steht an: erst nach der vereinbarten Uhrzeit passiert die Szene
  if(r.verabredet){
    const jetztMin = state.clock.min;
    const faellig = ((jetztMin - r.verabredet.stunde*60 + 1440) % 1440) < 300; // 5-Stunden-Fenster ab dem Termin
    if(faellig){
      startDialog(lin([
        { who:id, text:'Da bist du ja! Ich hab schon gewartet.' },
        { who:id, text:'Schön, dass wir das gemacht haben.' }
      ]), {breakable:true});
      addSympathy(id, 3);
      r.verabredet = null; r.zusammen = true;
      state.journal.memories.push('Date mit '+def.name+': von jetzt an mehr als nur Camp-Bekanntschaft.');
      return;
    }
    startDialog(lin([{ who:id, text:'Bis später, ja? Ich freu mich schon.' }]), {breakable:true});
    return;
  }
  if(r.zusammen){
    startDialog(lin([{ who:id, text: pick([
      'Schön, dich zu sehen.', 'Wie läuft dein Tag?', pick(def.lines)
    ]) }]), {breakable:true});
    return;
  }
  if(s.val >= DATE_SCHWELLE){
    startDialog(lin([{ who:id, text: pick(def.lines), choices:[
      { t:'Lust auf ein Date?', next:null, fx(){ ladeZumDateEin(id); } },
      { t:'(nur kurz reden)',   next:null }
    ]}]), {breakable:true});
    return;
  }
  startDialog(lin([{ who:id, text: pick(def.lines) }]), {breakable:true});
}
function ladeZumDateEin(id){
  const def = DATE_NPCS.find(d=>d.id===id);
  const stunde = 20;
  state.romance[id] = state.romance[id] || {};
  state.romance[id].verabredet = { stunde };
  state.journal.memories.push('Mit '+def.name+' verabredet: heute um 20:00 Uhr, dort wo ihr euch immer trefft.');
  toast('Verabredung mit '+def.name+' um 20:00 Uhr.');
}

/* Der Campingplatz war mit 44x34 Kacheln zu eng: alles klebte aneinander
   und es blieb kein Raum für neue Ideen. Er wird deshalb um den Faktor
   CAMP_STRECKUNG auseinandergezogen – die vorhandene Anordnung bleibt
   erhalten, bekommt aber überall mehr Luft. verteileCamp() macht das
   nachträglich mit ALLEN Objekten, damit die 142 einzelnen Koordinaten
   im Aufbau unverändert bleiben können. */
const CAMP_STRECKUNG = 1.7;
const MAPW = Math.round(44*CAMP_STRECKUNG), MAPH = Math.round(34*CAMP_STRECKUNG);
function streck(t){ return Math.round(t*CAMP_STRECKUNG); }   // Kachel -> gestreckte Kachel
function streckPx(v){ return Math.round(v/TILE*CAMP_STRECKUNG)*TILE; }

// Wo verläuft der Trampelpfad? (Kachel-Rechtecke: x, y, Breite, Höhe)
const PATH_RECTS = [
  [13, 8, 14, 2],   // vom Camp nach Osten
  [25, 8,  2, 19],  // nach Süden
  [26,13,  7,  3],  // Vorplatz der Dixi-Klos
  [27,25,  9,  2],  // nach Osten zu Stellas Camp
  [33,25,  8,  5],  // Lichtung Stellas Camp
  [ 6, 6,  7,  5]   // Lichtung Spieler-Camp
];
function tileIsPath(tx,ty){
  // Wege werden mitgestreckt und dabei etwas breiter, damit sie im
  // größeren Gelände nicht wie schmale Trampelpfade wirken.
  return PATH_RECTS.some(r => {
    const x0=streck(r[0]), y0=streck(r[1]);
    const w=Math.max(2, streck(r[2])), hh=Math.max(2, streck(r[3]));
    return tx>=x0 && tx<x0+w && ty>=y0 && ty<y0+hh;
  });
}

// Malt die gezeichnete Graskachel einmal in einen kleinen Puffer,
// damit der Boden danach schnell damit gefüllt werden kann.
let grasKachel = null;
function baueGrasKachel(){
  const g = SPR_GRAS.grid;
  grasKachel = document.createElement('canvas');
  grasKachel.width = g[0].length; grasKachel.height = g.length;
  const k = grasKachel.getContext('2d');
  for(let r=0;r<g.length;r++)
    for(let c=0;c<g[r].length;c++){
      const col = SPR_GRAS.pal[g[r][c]];
      if(col){ k.fillStyle=col; k.fillRect(c,r,1,1); }
    }
}
// Füllt eine Fläche lückenlos mit der Graskachel
function fuelleGras(g2d, w, h){
  if(!grasKachel) baueGrasKachel();
  for(let y=0;y<h;y+=grasKachel.height)
    for(let x=0;x<w;x+=grasKachel.width)
      g2d.drawImage(grasKachel, x, y);
}

function buildGround(){
  ground = document.createElement('canvas');
  ground.width = MAPW*TILE; ground.height = MAPH*TILE;
  const g = ground.getContext('2d');
  const rnd = mulberry32(1337);
  fuelleGras(g, MAPW*TILE, MAPH*TILE);      // gezeichnete Graskachel als Untergrund
  for(let ty=0; ty<MAPH; ty++){
    for(let tx=0; tx<MAPW; tx++){
      const path = tileIsPath(tx,ty);
      if(path){
        g.fillStyle = '#dcc28e';
        g.fillRect(tx*TILE, ty*TILE, TILE, TILE);
        for(let i=0;i<5;i++){
          const px = tx*TILE + Math.floor(rnd()*15);
          const py = ty*TILE + Math.floor(rnd()*15);
          g.fillStyle = rnd()<0.5 ? '#cbb47e' : '#e6d3a2';
          g.fillRect(px,py,1,1);
        }
      }
      if(!path){
        const r = rnd();
        if(r < 0.05){ // Grasbüschel
          const px=tx*TILE+4+Math.floor(rnd()*8), py=ty*TILE+4+Math.floor(rnd()*8);
          g.fillStyle='#7fb35f'; g.fillRect(px,py,1,3); g.fillRect(px+2,py+1,1,2);
        } else if(r < 0.075){ // Blümchen
          const px=tx*TILE+4+Math.floor(rnd()*8), py=ty*TILE+4+Math.floor(rnd()*8);
          const cols=['#f2e6b8','#e8a0b8','#f2c46a','#d9e8f2'];
          g.fillStyle=cols[Math.floor(rnd()*4)];
          g.fillRect(px,py-1,1,1); g.fillRect(px,py+1,1,1);
          g.fillRect(px-1,py,1,1); g.fillRect(px+1,py,1,1);
          g.fillStyle='#c9a03f'; g.fillRect(px,py,1,1);
        }
      }
    }
  }
}

/* Zieht den fertig aufgebauten Campingplatz auseinander. Jede Position
   wird mit CAMP_STRECKUNG multipliziert und wieder aufs Kachelraster
   gesetzt, damit die mühsam erreichte Rastertreue erhalten bleibt.
   Breiten und Höhen bleiben unverändert – die Dinge werden nicht größer,
   sie stehen nur weiter auseinander. */
function verteileCamp(){
  const p = v => Math.round(v/TILE*CAMP_STRECKUNG)*TILE;
  for(const o of objects){
    // WICHTIG: Ein Objekt wird als Ganzes verschoben, nicht Feld für Feld.
    // Sonst zerreißt es die inneren Beziehungen – bei Zelten ist z.B.
    // base = y + Höhe, und getrennt gerundet wanderte der Schatten weg
    // vom Zelt. Deshalb: einen Versatz bestimmen und auf alles anwenden.
    const refX = (typeof o.x==='number') ? o.x : (typeof o.ax==='number' ? o.ax : null);
    const refY = (typeof o.y==='number') ? o.y : (typeof o.base==='number' ? o.base
                : (typeof o.ay==='number' ? o.ay : null));
    const dx = (refX===null) ? 0 : p(refX) - refX;
    const dy = (refY===null) ? 0 : p(refY) - refY;
    if(typeof o.x==='number')    o.x    += dx;
    if(typeof o.ax==='number')   o.ax   += dx;
    if(typeof o.y==='number')    o.y    += dy;
    if(typeof o.base==='number') o.base += dy;
    if(typeof o.ay==='number')   o.ay   += dy;
    if(o.solid){ o.solid.x += dx; o.solid.y += dy; }
  }
  for(const s of solids){ s.x = p(s.x); s.y = p(s.y); }
  for(const l of lights){ if(typeof l.x==='number') l.x = p(l.x); if(typeof l.y==='number') l.y = p(l.y); }
  // Treffpunkte der Gruppen wandern mit
  if(Array.isArray(treffpunkte)){
    for(const t of treffpunkte){
      if(typeof t.x==='number') t.x = p(t.x);
      if(typeof t.y==='number') t.y = p(t.y);
      if(t.plaetze) for(const pl of t.plaetze){ pl.x = p(pl.x); pl.y = p(pl.y); }
    }
  }
}
/* Nach dem Auseinanderziehen ist viel leere Wiese entstanden. Hier
   kommen zusätzliche Camps, Baumgruppen und Kleinkram dazu – bewusst
   NACH verteileCamp(), damit direkt in den echten neuen Koordinaten
   gearbeitet wird. Es wird nur auf freie Kacheln gesetzt, ohne Wege und
   ohne bestehende Dinge zu blockieren. */
function fuelleCampAuf(){
  const rnd = mulberry32(4711);
  const belegt = (tx,ty,rand=1) => {
    for(let dx=-rand; dx<=rand; dx++) for(let dy=-rand; dy<=rand; dy++){
      const bx=(tx+dx)*TILE, by=(ty+dy)*TILE;
      const box={x:bx,y:by,w:TILE,h:TILE};
      if(tileIsPath(tx+dx,ty+dy)) return true;
      for(const o of objects){
        const ox=(o.x||o.ax||0), oy=(o.base||o.ay||0);
        // Zelte sind breit – aber nicht so viel Abstand, dass gar nichts
        // mehr passt. Zwei Kacheln reichen, damit sie sich nicht berühren.
        const noetig = (o.type==='tent') ? TILE*2 : TILE*1.2;
        if(Math.abs(ox-bx)<noetig && Math.abs(oy-by)<noetig) return true;
      }
      // Um Figuren großzügig Platz lassen – sonst baut man sie zu
      for(const n of npcs) if(Math.abs(n.x-bx)<TILE*3.5 && Math.abs(n.y-by)<TILE*3.5) return true;
    }
    return false;
  };
  // Deko steht bewusst dicht am Camp – hier reicht es zu prüfen, dass die
  // Kachel selbst frei ist und kein Weg darunterliegt. Die großzügige
  // belegt()-Prüfung oben würde jeden Dekoplatz im Camp ablehnen.
  const dekoFrei = (tx,ty) => {
    if(tileIsPath(tx,ty)) return false;
    const bx=tx*TILE, by=ty*TILE;
    for(const o of objects){
      const ox=(o.x||o.ax||0), oy=(o.base||o.ay||0);
      if(Math.abs(ox-bx)<TILE && Math.abs(oy-by)<TILE) return false;
      if(o.solid && rectsOverlap({x:bx,y:by,w:TILE,h:TILE}, o.solid)) return false;
    }
    for(const n of npcs) if(Math.abs(n.x-bx)<TILE*2 && Math.abs(n.y-by)<TILE*2) return false;
    return true;
  };
  const farben = Object.values(TENT_COLORS);
  const zeltTexte = [
    'Ein Zelt mit halb offener Plane. Drinnen: Chaos.',
    'Davor stehen drei leere Dosen und ein Klappstuhl.',
    'Jemand hat eine Lichterkette drübergehängt.',
    'Ordentlich aufgebaut. Verdächtig ordentlich.',
    'Vor dem Eingang liegt ein einzelner Schuh.',
    'Ein Zelt, das schon bessere Festivals gesehen hat.'
  ];
  /* --- Camps als Großkacheln ---
     Statt Camps zufällig zu streuen und mühsam Abstände zu prüfen, wird die
     Wiese in ein Raster aus Blöcken zu CAMP_BLOCK Kacheln geteilt. Ein Block
     ist entweder ein ganzes Camp oder bleibt frei. Der Rand jedes Blocks
     bleibt immer leer – dadurch entstehen von selbst Gassen zwischen den
     Camps, und innerhalb eines Blocks darf die Deko dicht stehen. */
  const CAMP_BLOCK = 7;          // Blockgröße in Kacheln
  const BLOCK_RAND = 1;          // umlaufende Gasse, bleibt immer frei
  const CAMP_ARTEN = [
    { name:'Lagerfeuer-Camp', mitte:'feuer',   deko:['stuhl','stuhl','stumpf'], licht:false,
      texte:['Vor dem Zelt steht ein Klappstuhl mit Getränkehalter.',
             'Hier riecht es nach Rauch und angebranntem Brot.'] },
    { name:'Lichterketten-Camp', mitte:'teppich', deko:['stuhl','busch'], licht:true,
      texte:['Über den Zelten hängt eine Lichterkette.',
             'Jemand hat sich hier richtig häuslich eingerichtet.'] },
    { name:'Chill-Camp', mitte:'teppich', deko:['haengematte','stumpf','busch'], licht:false,
      texte:['Zwischen den Zelten hängt eine Hängematte.',
             'Alles ein bisschen schief, aber gemütlich.'] },
    { name:'Ordentliches Camp', mitte:'teppich', deko:['stuhl','stuhl','muell'], licht:false,
      texte:['Verdächtig ordentlich aufgebaut. Sogar ein Mülleimer.',
             'Die Heringe sitzen alle im gleichen Winkel.'] },
    { name:'Rad-Camp', mitte:'feuer', deko:['rad','stuhl','stumpf'], licht:false,
      texte:['Daneben lehnt ein Fahrrad am Zelt.',
             'Die sind offenbar mit dem Rad angereist.'] },
    { name:'Laternen-Camp', mitte:'teppich', deko:['laterne','stuhl','busch'], licht:false,
      texte:['Eine Laterne wirft warmes Licht auf die Zeltwand.',
             'Nachts sieht man dieses Camp schon von Weitem.'] }
  ];
  const teppichFarben = ['rot','blau','senf','gruen','lila'];
  // Ist der ganze Block frei? (Wege, bestehende Dinge, Figuren)
  function blockFrei(bx,by){
    // Es reicht, die INNENFLÄCHE zu prüfen – der umlaufende Rand ist ohnehin
    // die Gasse und darf ruhig an etwas angrenzen. Vorher wurde der ganze
    // Block geprüft, wodurch schon ein einzelner Baum daneben alles ablehnte.
    for(let ty=by+BLOCK_RAND-1; ty<by+CAMP_BLOCK-BLOCK_RAND+1; ty++){
      for(let tx=bx+BLOCK_RAND-1; tx<bx+CAMP_BLOCK-BLOCK_RAND+1; tx++){
        if(tx<2||ty<2||tx>=MAPW-2||ty>=MAPH-2) return false;
        if(tileIsPath(tx,ty)) return false;
        const px=tx*TILE, py=ty*TILE;
        // Nur echte Überschneidung ablehnen, nicht schon Nähe – der
        // Blockrand ist der Abstand. Vorher wurden 51 von 54 Blöcken
        // abgelehnt, weil irgendwo in der Nähe etwas stand.
        for(const o of objects){
          const ox=(o.x||o.ax||0), oy=(o.base||o.ay||0);
          if(Math.abs(ox-px)<TILE*0.9 && Math.abs(oy-py)<TILE*0.9) return false;
          if(o.solid && rectsOverlap({x:px,y:py,w:TILE,h:TILE}, o.solid)) return false;
        }
        for(const n of npcs) if(Math.abs(n.x-px)<TILE*1.5 && Math.abs(n.y-py)<TILE*1.5) return false;
      }
    }
    return true;
  }
  // Alle Blöcke des Rasters durchgehen und passende zu Camps machen
  let camps = 0;
  const bloecke = [];
  /* Das Raster wird in mehreren Versätzen durchprobiert. Ein einziges,
     starres Raster trifft die Lücken zwischen dem bereits vorhandenen
     Inhalt kaum – mit vier versetzten Durchgängen passen die Blöcke
     dagegen gut in die freien Zwischenräume. Bereits vergebene Flächen
     werden über blockFrei() ohnehin ausgeschlossen. */
  const versaetze = [[0,0],[3,3],[0,4],[4,0],[2,5],[5,2]];
  for(const [ox,oy] of versaetze){
    for(let by=5+oy; by+CAMP_BLOCK<MAPH-5; by+=CAMP_BLOCK)
      for(let bx=5+ox; bx+CAMP_BLOCK<MAPW-5; bx+=CAMP_BLOCK) bloecke.push([bx,by]);
  }
  // Reihenfolge mischen, damit die Camps nicht alle links oben liegen
  for(let i=bloecke.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [bloecke[i],bloecke[j]]=[bloecke[j],bloecke[i]]; }
  for(const [bx,by] of bloecke){
    if(camps>=24) break;
    if(!blockFrei(bx,by)) continue;
    if(rnd() < 0.15) continue;                 // nicht jeder freie Block wird bebaut
    const art = CAMP_ARTEN[camps % CAMP_ARTEN.length];
    // Innenfläche des Blocks (ohne die umlaufende Gasse)
    const ix = bx+BLOCK_RAND, iy = by+BLOCK_RAND;
    const iw = CAMP_BLOCK-BLOCK_RAND*2;        // z.B. 5x5 Kacheln Innenfläche
    // Zelte an den Ecken und Kanten der Innenfläche
    const zeltPlaetze = [[0,0],[iw-2,0],[0,iw-2],[iw-2,iw-2],[Math.floor(iw/2)-1,-1]];
    const anzahl = 3 + Math.floor(rnd()*3);
    for(let i=0;i<anzahl && i<zeltPlaetze.length;i++){
      const [dx,dy] = zeltPlaetze[i];
      addTent(ix+dx, iy+dy, farben[Math.floor(rnd()*farben.length)],
              art.texte[Math.floor(rnd()*art.texte.length)], 'Zelt');
    }
    // Mitte des Camps
    const mx = ix+Math.floor(iw/2)-1, my = iy+Math.floor(iw/2);
    if(art.mitte==='feuer') addFire(mx, my, true);
    else addTeppich(mx, my, teppichFarben[Math.floor(rnd()*teppichFarben.length)]);
    // Deko im Inneren – hier darf es dicht sein, der Block gehört dem Camp
    const dekoPlaetze = [[1,Math.floor(iw/2)],[iw-2,Math.floor(iw/2)],
                         [Math.floor(iw/2),1],[Math.floor(iw/2),iw-2],[1,1],[iw-2,1]];
    let di = 0;
    for(const stueck of art.deko){
      const dp = dekoPlaetze[di % dekoPlaetze.length]; di++;
      const dx2 = ix+dp[0], dy2 = iy+dp[1];
      if(stueck==='stuhl')            addChair(dx2,dy2);
      else if(stueck==='stumpf')      addStumpf(dx2,dy2);
      else if(stueck==='busch')       addBush(dx2,dy2);
      else if(stueck==='rad')         addBike(dx2,dy2);
      else if(stueck==='laterne')     addLantern(dx2,dy2);
      else if(stueck==='muell')       addBin(dx2,dy2, rnd()<0.5?'rest':'plastik');
      else if(stueck==='haengematte') addHammock(dx2,dy2);
    }
    // Lichterkette diagonal über das Camp
    if(art.licht){
      addFairyLights(ix*TILE+16, iy*TILE+6, (ix+iw-2)*TILE+16, (iy+iw-2)*TILE+6, 7, 9);
    }
    camps++;
  }
  // --- Baumgruppen, damit die Wiese nicht kahl wirkt ---
  let baeume = 0;
  for(let versuch=0; versuch<600 && baeume<60; versuch++){
    const tx = 3 + Math.floor(rnd()*(MAPW-6));
    const ty = 3 + Math.floor(rnd()*(MAPH-6));
    if(belegt(tx,ty,1)) continue;
    addTree(tx,ty); baeume++;
    if(rnd()<0.5 && !belegt(tx+2,ty+1,1)){ addTree(tx+2,ty+1); baeume++; }
  }
  // --- Kleinkram: Büsche und Stümpfe ---
  let kram = 0;
  for(let versuch=0; versuch<500 && kram<45; versuch++){
    const tx = 3 + Math.floor(rnd()*(MAPW-6));
    const ty = 3 + Math.floor(rnd()*(MAPH-6));
    if(belegt(tx,ty,1)) continue;
    if(rnd()<0.6) addBush(tx,ty); else addStumpf(tx,ty);
    kram++;
  }
}
/* ============ ALLES AUF KACHELN ============
   Die Kachel ist der Arbeitsbereich – nichts liegt dazwischen. Diese
   Funktion setzt am Ende des Aufbaus jedes Objekt exakt auf sein Feld und
   zieht seine Kollisionsbox auf die vollen Kacheln auf, die es berührt.
   Damit gilt: eine Kachel ist entweder frei oder ganz belegt. Vorher waren
   98% der Boxen krumm und kleine Dinge (Bäume, Stümpfe) sperrten wegen
   ihrer Größe gar keine Kachel – daher die fehlenden Kollisionen. */
function aufKachelnAusrichten(){
  const aufKachel = v => Math.round(v/TILE)*TILE;
  for(const o of objects){
    // Ankerpunkt (Fußpunkt) auf die Kachelmitte ziehen …
    if(typeof o.base==='number'){
      const dy = aufKachel(o.base) - o.base;
      o.base += dy;
      if(typeof o.y==='number') o.y += dy;
      if(typeof o.ay==='number') o.ay += dy;
      if(o.solid) o.solid.y += dy;
    }
    if(typeof o.x==='number'){
      // Objekte mit Breite (Zelte) an der linken Kante ausrichten,
      // punktförmige (Bäume, Stümpfe) an der Kachelmitte.
      const breit = typeof o.w==='number' && o.w>TILE;
      const ziel = breit ? aufKachel(o.x) : aufKachel(o.x-8)+8;
      const dx = ziel - o.x;
      o.x += dx;
      if(typeof o.ax==='number') o.ax += dx;
      if(o.solid) o.solid.x += dx;
    }
    // … und die Kollisionsbox auf ganze Kacheln aufziehen
    if(o.solid){
      const x0 = Math.floor(o.solid.x/TILE)*TILE;
      const y0 = Math.floor(o.solid.y/TILE)*TILE;
      const x1 = Math.ceil((o.solid.x+o.solid.w)/TILE)*TILE;
      const y1 = Math.ceil((o.solid.y+o.solid.h)/TILE)*TILE;
      o.solid.x=x0; o.solid.y=y0; o.solid.w=Math.max(TILE,x1-x0); o.solid.h=Math.max(TILE,y1-y0);
    }
  }
}

/* --- Zeichenfunktionen der Objekte --- */
function pixCircle(cx,cy,r,col){
  ctx.fillStyle=col;
  for(let dy=-r; dy<=r; dy++){
    const hw=Math.floor(Math.sqrt(r*r-dy*dy));
    ctx.fillRect(cx-hw, cy+dy, hw*2+1, 1);
  }
}
function drawTent(o){
  const cx=o.x+o.w/2;
  ctx.fillStyle='rgba(50,35,25,0.2)'; ctx.fillRect(o.x+4,o.base-3,o.w-8,4);
  for(let i=0;i<o.h;i++){
    const half=Math.max(2, Math.round((i/o.h)*(o.w/2)));
    ctx.fillStyle = (Math.floor(i/(retroStil?7:4))%2===0) ? o.col.c1 : o.col.c1b;  // Streifen
    ctx.fillRect(cx-half, o.y+i, half*2, 1);
    ctx.fillStyle=o.col.c2;
    ctx.fillRect(cx-half, o.y+i, 1, 1); ctx.fillRect(cx+half-1, o.y+i, 1, 1);
  }
  // Eingang
  const dh=Math.round(o.h*0.45);
  for(let j=0;j<dh;j++){
    const hw=Math.max(1, Math.round((j/dh)*(o.w*0.16)));
    ctx.fillStyle='#3b2f2f';
    ctx.fillRect(cx-hw, o.y+o.h-dh+j, hw*2, 1);
  }
  ctx.fillStyle='#e8e0d0'; ctx.fillRect(cx-1, o.y, 2, 2);  // Zeltspitze
}
function drawTree(o){
  ctx.fillStyle='rgba(50,35,25,0.2)'; ctx.fillRect(o.x-7,o.base-2,14,3);
  ctx.fillStyle='#7a5230'; ctx.fillRect(o.x-2,o.base-9,4,9);
  ctx.fillStyle='#5e3f24'; ctx.fillRect(o.x-2,o.base-9,1,9);
  pixCircle(o.x,   o.base-16, 9, '#4d7c3e');

/* ============ 6. FIGUREN & BEWEGUNG ============ */
const player = { x:204, y:150, facing:'down', moving:false, animT:0, frame:0, schritt:null,
                 pal:null, gridSet:HERO_GRIDS };
const npcs = [];
function addNPC(id,name,x,y,pal,gridSet,portrait,pPal,talk){
  // Nur Figuren, die das Helden-Sprite benutzen, brauchen die ergänzten Töne.
  // Eigens gezeichnete Figuren bringen ihre komplette Palette schon mit.
  if(gridSet === HERO_GRIDS) pal = heldenPalette(pal);
  const n = { id, name, x, y, facing:'down', moving:false, animT:0, frame:0,
              pal, gridSet, portrait, pPal, talk };
  npcs.push(n);
  return n;
}

function entBox(e){ return { x:e.x-5, y:e.y-7, w:10, h:7 }; }
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
// Bewegt eine Figur Achse für Achse und stoppt an Hindernissen
// Welche Hindernisse gelten gerade? Jede Szene hat ihre eigenen.
function sceneSolids(){
  if(state.scene==='tent')  return ohneGeoeffnete(tentSolids);
  if(state.scene==='stage')
    return ohneGeoeffnete(state.flags.backstageOpen ? stageSolids.filter(s=>!s.gate) : stageSolids);
  if(state.scene==='food')  return ohneGeoeffnete(foodSolids);
  if(state.scene==='wald')  return ohneGeoeffnete(waldSolids);
  if(state.scene==='waldstage') return ohneGeoeffnete(wstageSolids);
  if(state.scene==='ownstage') return ohneGeoeffnete(ownstageSolids);
  if(state.scene==='eingang')   return ohneGeoeffnete(eingSolids);
  return ohneGeoeffnete(solids.concat(borderWalls));
}

// Alles, was der Figur e in der aktuellen Szene im Weg steht. Der (dx,dy)-
// Schritt wird gebraucht, damit Passanten vorher entscheiden können, ob sie
// ausweichen oder stehen bleiben (rempelEntscheiden).
// Nur die beweglichen/stehenden Figuren als Hindernisse (ohne die feste
// Karte – die läuft bei Kachelbewegung über kachelGesperrt()).
function sammleFiguren(e, dx, dy, ignoreNpcs){
  const blockers = [];
  // Die Leute vom Campingplatz stehen nur dort im Weg, nicht auf anderen Karten
  if(!ignoreNpcs && state.scene==='camp'){
    for(const n of npcs){ if(n!==e) blockers.push(entBox(n)); }
    if(e!==player) blockers.push(entBox(player));
  }
  // Im Zelt blockieren zusätzlich Matratze und Rucksack
  if(state.scene==='tent'){
    for(const o of tentObjects){ if(o.solid) blockers.push(o.solid); }
  }
  // Auf dem Gelände stehen Crew und Security im Weg
  if(state.scene==='stage' && !ignoreNpcs){
    for(const n of stageNpcs){ if(n!==e) blockers.push(entBox(n)); }
  }
  // Laufende Passanten sind echte Hindernisse – aber wer gerade zur Seite
  // ausweicht, blockiert währenddessen nicht (siehe rempelEntscheiden).
  if(e===player){
    for(const p of laufendeLeute()) blockers.push(entBox(p));
  }
  return blockers;
}
function sammleBlocker(e, dx, dy, ignoreNpcs){
  return sceneSolids().concat(sammleFiguren(e, dx, dy, ignoreNpcs));
}
function moveEntity(e, dx, dy, ignoreNpcs){
  const blockers = sammleBlocker(e, dx, dy, ignoreNpcs);
  e.x += dx;
  let box = entBox(e);
  for(const s of blockers){
    if(rectsOverlap(box,s)){
      if(dx>0) e.x = s.x - 5; else if(dx<0) e.x = s.x + s.w + 5;
      box = entBox(e);
    }
  }
  e.y += dy;
  box = entBox(e);
  for(const s of blockers){
    if(rectsOverlap(box,s)){
      if(dy>0) e.y = s.y - 0.01; else if(dy<0) e.y = s.y + s.h + 7;
      box = entBox(e);
    }
  }
}

/* ============ KACHELBEWEGUNG (wie Pokémon HeartGold) ============
   Der Spieler läuft nicht mehr frei, sondern Kachel für Kachel (16px) und
   nur in vier Richtungen. Ein Schritt wird vor dem Losgehen auf Hindernisse
   geprüft – ist die Zielkachel belegt, dreht sich die Figur nur um. Während
   eines Schritts gleitet sie gleichmäßig zur Zielkachel; Eingaben werden
   erst nach der Ankunft wieder gelesen. Spielerposition: x = Kachelmitte,
   y = untere Kante der Kachel (so stehen auch alle NPCs). */
function kachelVon(px, py){ return { tx: Math.round((px-8)/TILE), ty: Math.round(py/TILE)-1 }; }
function kachelMitte(tx, ty){ return { x: tx*TILE+8, y: (ty+1)*TILE }; }
// Gewünschte Richtung aus Tastatur und Touch – bei zwei Tasten gleichzeitig
// gewinnt die, die quer zur aktuellen Blickrichtung liegt (fühlt sich wie
// "abbiegen" an, statt dass eine Taste immer die andere überstimmt).
function kachelRichtung(){
  let dx=0, dy=0;
  if(keys['w']||keys['arrowup'])    dy-=1;
  if(keys['s']||keys['arrowdown'])  dy+=1;
  if(keys['a']||keys['arrowleft'])  dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  // Touch-Joystick: dominante Achse
  if(dx===0 && dy===0 && (touch.dx!==0 || touch.dy!==0)){
    if(Math.abs(touch.dx) > Math.abs(touch.dy)) dx = touch.dx>0?1:-1; else dy = touch.dy>0?1:-1;
  }
  if(dx!==0 && dy!==0){
    const waagerecht = (player.facing==='left'||player.facing==='right');
    if(waagerecht) dx=0; else dy=0;
  }
  return [dx,dy];
}
/* Bewegung in festen Ticks (60 pro Sekunde) mit GANZEN Pixeln:
   - Vorher lief der Schritt mit Kommazahlen und wurde beim Zeichnen
     gerundet. Math.round rundet x,5 immer aufwärts – nach rechts landete
     dadurch ein 2-Pixel-Sprung direkt neben dem Kachelwechsel (Ruckler),
     nach links nicht. Jetzt wird der Versatz als Betrag gerundet und dann
     mit der Richtung multipliziert: beide Richtungen sind identisch.
   - Am Kachelende ging ein Frame verloren, weil der nächste Schritt erst im
     Folgeframe startete. Jetzt schließt der nächste Schritt im selben Tick
     an, solange die Taste gehalten wird.
   - Erschöpft wird ein Schritt einfach auf mehr Ticks verteilt; die
     Pixel verteilen sich dabei gleichmäßig statt zufällig. */
const BEWEGUNGS_TICK = 1/60;
function schrittTicks(){
  const spd = CFG.PLAYER_SPEED * (state.energy<20 ? 0.6 : 1)
            * (1 - (1-CFG.HIGH_SPEED_FACTOR)*highFactor())
            * (state.onBike ? CFG.BIKE_SPEED_FACTOR : 1);
  const roh = TILE/spd/BEWEGUNGS_TICK;
  // Auf eine Tickzahl runden, bei der sich 16 Pixel gleichmäßig verteilen
  // (z.B. 24 Ticks = immer "1,0,1"-Muster). Krumme Zahlen wie 23 erzeugen
  // ein unregelmäßiges Muster, das man als Ruckeln wahrnimmt.
  const GLATT = [4,6,7,8,10,12,14,16,20,24,28,32,40,48];
  let best = GLATT[0];
  for(const n of GLATT) if(Math.abs(n-roh) < Math.abs(best-roh)) best = n;
  return best;
}
// Versucht, einen neuen Schritt zu beginnen. true = läuft los.
function kachelSchrittStarten(){
  const [dx,dy] = kachelRichtung();
  if(dx===0 && dy===0) return false;
  // Umdrehen ist sofort, auch wenn der Weg blockiert ist
  if(dx<0) player.facing='left'; else if(dx>0) player.facing='right';
  else if(dy<0) player.facing='up'; else player.facing='down';
  const hier = kachelVon(player.x, player.y);
  if(kachelGesperrt(hier.tx+dx, hier.ty+dy)) return false;
  if(kachelBelegtVonFigur(hier.tx+dx, hier.ty+dy, player)){
    rempelZusammenstoss(hier.tx+dx, hier.ty+dy);   // wer stehen blieb, sagt jetzt was
    return false;
  }
  const ziel = kachelMitte(hier.tx+dx, hier.ty+dy);
  player.schritt = { vonX:player.x, vonY:player.y, zuX:ziel.x, zuY:ziel.y,
                     rx:dx, ry:dy, k:0, n:schrittTicks(), vonTx:hier.tx, vonTy:hier.ty };
  return true;
}
function kachelTick(){
  const s = player.schritt;
  if(s){
    s.k++;
    const weg = Math.round(TILE * s.k / s.n);        // Betrag runden – symmetrisch
    player.x = s.vonX + s.rx*weg;
    player.y = s.vonY + s.ry*weg;
    if(s.k < s.n) return;
    player.x = s.zuX; player.y = s.zuY; player.schritt = null;
  }
  // Kein Schritt aktiv (oder gerade beendet): nahtlos weiterlaufen?
  kachelSchrittStarten();
}
function kachelUpdate(dt){
  player.tickRest = Math.min(0.1, (player.tickRest||0) + dt);
  while(player.tickRest >= BEWEGUNGS_TICK){
    player.tickRest -= BEWEGUNGS_TICK;
    kachelTick();
  }
  if(player.schritt){
    player.moving = true;
    player.animT += dt; player.frame = Math.floor(player.animT*7)%4;
  } else {
    player.moving = false; player.frame = 0; player.animT = 0;
  }
}

function playerUpdate(dt){
  if(CFG.KACHEL_BEWEGUNG){ kachelUpdate(dt); return; }
  let dx=0, dy=0;
  if(keys['w']||keys['arrowup'])    dy-=1;
  if(keys['s']||keys['arrowdown'])  dy+=1;
  if(keys['a']||keys['arrowleft'])  dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  // Virtueller Joystick (Touch) fließt hier einfach mit ein
  dx += touch.dx;
  dy += touch.dy;
  const moving = (dx!==0 || dy!==0);
  player.moving = moving;
  if(moving){
    const len=Math.hypot(dx,dy); dx/=len; dy/=len;
    if(dx<0) player.facing='left'; else if(dx>0) player.facing='right';
    else if(dy<0) player.facing='up'; else player.facing='down';
    let spd = CFG.PLAYER_SPEED * (state.energy<20 ? 0.6 : 1)
            * (1 - (1-CFG.HIGH_SPEED_FACTOR)*highFactor())    // High: sanft rein und raus
            * (state.onBike ? CFG.BIKE_SPEED_FACTOR : 1);     // Rad: deutlich flotter
    moveEntity(player, dx*spd*dt, dy*spd*dt, false);
    player.animT += dt;
    player.frame = Math.floor(player.animT*7)%4;
  } else {
    player.frame = 0; player.animT = 0;
  }
}
function npcUpdate(dt){
  // Stehende Figuren führen einen angefangenen Ausweichschritt aus und
  // kehren danach an ihren Platz zurück (siehe excuseMe / heimkehrUpdate).
  for(const n of [...npcs, ...stageNpcs]){
    if(n.kSchritt) kSchrittWeiter(n, dt);
    else if(n.moving && n.heimX!==undefined) n.moving = false;
  }
  heimkehrUpdate(dt);
  for(const n of npcs){
    if(n.id==='harvey' && !state.cutscene){
      n.wanderT = (n.wanderT||0) - dt;               // Harvey schaut sich gelegentlich um
      if(n.wanderT<=0){ n.wanderT = 4+Math.random()*4; n.facing = pick(['down','left','right']); }
    }
  }
}

// Zeichnet eine Figur (Spieler oder NPC) inkl. Schatten & Lauf-Animation.
// Liest Zellgröße, Körperzeilen und Bein-Zeilen aus dem gridSet, damit
// einfache (12x16) und hochauflösende (24x32) Sprites gleich behandelt werden.
// Bringt ein schmaleres Raster auf die Größe der gezeichneten Bilder
function padGrid(grid, pad, padTop){
  const leer = ' '.repeat(grid[0].length + pad*2);
  const oben = []; for(let i=0;i<padTop;i++) oben.push(leer);
  return oben.concat(grid.map(z => ' '.repeat(pad) + z + ' '.repeat(pad)));
}
// Ersatzpalette für Figuren, die eine eigene Sprite-Palette mitbringen
const RETRO_PAL = { o:'#4a3a35', h:'#6d4a2f', d:'#4a3020', s:'#e0b088', S:'#c08e66',
                    e:'#2e2430', c:'#5f9b6a', k:'#457a4f', p:'#474c66', b:'#6d4a2f',
                    q:'#8a5a34', Q:'#6d4426' };
function drawEntity(e){
  // Im Glitch fallen alle Figuren auf die alten, klobigen Sprites zurück
  const gs = retroStil ? PLAYER_GRIDS : e.gridSet;
  const cell = gs.cell || 1;
  const bodyRows = gs.bodyRows || 13;
  const legsSet = gs.legsSet || { idle:LEGS_IDLE, a:LEGS_A, b:LEGS_B };
  let richtung = (e.facing==='up') ? 'up' : (e.facing==='down') ? 'down' : 'side';
  let flip = (e.facing==='right');
  // Eigene rechts-Zeichnung vorhanden (z.B. NPC1): nicht spiegeln, direkt nehmen
  if(gs.frames && gs.frames.right && (e.facing==='left' || e.facing==='right')){
    richtung = e.facing;               // 'left' oder 'right', beides eigene Bilder
    flip = false;
    e._letzteSeite = e.facing;
  }
  // Nur links gezeichnet, rechts wird gespiegelt (z.B. der Held)
  else if(gs.frames && gs.frames.left && (e.facing==='left' || e.facing==='right')){
    richtung = 'left';
    flip = (e.facing==='right');
    e._letzteSeite = e.facing;
  }
  // Kein Bild für oben/unten: in der zuletzt genutzten Seitenansicht stehen bleiben
  else if((e.facing==='up' || e.facing==='down') && gs.frames &&
          !gs.frames.up && !gs.frames.down && (gs.frames.left || gs.frames.right)){
    const seite = e._letzteSeite || 'right';
    if(gs.frames.right){ richtung = seite; flip = false; }
    else { richtung = 'left'; flip = (seite==='right'); }
  }
  const schritt = e.moving ? (e.frame===1?'a' : e.frame===3?'b' : 'idle') : 'idle';
  let grid;
  if(gs.frames && gs.frames[richtung]){
    // Gezeichnete Bilderfolge: die Bilder wechseln sich streng ab, kein Stehbild.
    // Beim Stillstehen bleibt es auf dem ersten Bild der Folge stehen.
    const folge = gs.frames[richtung];
    grid = folge[ e.moving ? (e.frame % folge.length) : 0 ];
  } else {
    const baseGrid = richtung==='up' ? gs.up : richtung==='down' ? gs.down : gs.side;
    grid = baseGrid.slice(0,bodyRows).concat(legsSet[schritt] || legsSet.idle);
    if(gs.pad) grid = padGrid(grid, gs.pad, gs.padTop||0);
  }
  const bob = (!gs.frames || !gs.frames[richtung]) && e.moving && (e.frame===1||e.frame===3) ? -1 : 0;
  const breite = grid[0].length * cell;
  const sx = Math.round(e.x - breite/2), sy = Math.round(e.y-grid.length*cell+bob);
  ctx.fillStyle='rgba(50,35,25,0.25)';
  ctx.fillRect(sx+2, Math.round(e.y)-1, 8, 2);
  // Eigene Sprite-Paletten passen nicht zu den alten Sprites – dann Ersatz nehmen
  const pal = (retroStil && !(e.pal && e.pal.h)) ? RETRO_PAL : e.pal;
  drawGrid(grid, pal, sx, sy, flip, cell);
  return {sx, sy, flip};
}
// Unter der Figur mitfahrende Räder, wenn man auf dem Rad sitzt
function drawBikeUnder(e){
  if(!state.onBike) return;
  const y = e.y - 1;
  const seit = (e.facing==='left'||e.facing==='right');
  ctx.strokeStyle='#3b6f8a'; ctx.lineWidth=2;
  if(seit){
    ctx.beginPath(); ctx.arc(e.x-6,y,5,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(e.x+6,y,5,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#c94f6f'; ctx.fillRect(e.x-6,y-5,12,2);
  } else {
    ctx.beginPath(); ctx.arc(e.x,y,5,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#c94f6f'; ctx.fillRect(e.x-2,y-6,4,3);
    ctx.fillStyle='#8d8d95'; ctx.fillRect(e.x-6,y-7,12,2);
  }
}

function drawPlayerEnt(){
  drawBikeUnder(player);
  const pos = drawEntity(player);
  // Sonnenbrille sitzt auf der Nase (Augenhöhe des HD-Sprites: ~4 px)
  if(state.wearingGlasses && player.facing!=='up'){
    const yE = pos.sy+4;
    ctx.fillStyle='#241d26';
    if(player.facing==='down'){
      ctx.fillRect(pos.sx+3,yE,2,2); ctx.fillRect(pos.sx+7,yE,2,2); ctx.fillRect(pos.sx+5,yE,2,1);
    } else if(player.facing==='left'){
      ctx.fillRect(pos.sx+2,yE,3,2);
    } else {
      ctx.fillRect(pos.sx+7,yE,3,2);
    }
  }
  // Zigarette in der Hand – Position anhand der tatsächlichen Augenposition
  // vermessen (Mundhöhe = 2px unter dem Auge, dicht am Gesicht statt weit weg).
  if(state.smoke.phase==='smoking' && player.facing!=='up'){
    let ax, ay, flip;
    if(player.facing==='left'){ ax=pos.sx-2; ay=pos.sy+10; flip=true; }
    else if(player.facing==='right'){ ax=pos.sx+9; ay=pos.sy+10; flip=false; }
    else { ax=pos.sx+11; ay=pos.sy+10; flip=false; }   // 'down'
    zeichneKippe(ax, ay, flip);
  }
}

/* --- Rein und raus, mit kurzer Schwarzblende --- */
function enterTent(){
  state.outdoorPos = { x:player.x, y:player.y, facing:player.facing };
  fadeTo(()=>{
    state.scene = 'tent';
    state.onBike = false;                        // vorm Zelt abgestellt
    player.x = TENT.W/2; player.y = TENT.H-22;   // direkt hinter dem Eingang
    player.facing = 'up';
  });
}
function leaveTent(){
  fadeTo(()=>{
    state.scene = 'camp';
    const p = state.outdoorPos;
    if(p){ player.x=p.x; player.y=p.y; player.facing='down'; }
    state.outdoorPos = null;
  });
}
// Blendet schwarz, führt dann die Aktion aus und blendet wieder auf
let fadeAction = null;
// Der Spieler soll immer exakt auf einer Kachel stehen – die Start- und
// Eintrittspunkte der Szenen waren frei gesetzt und lagen daneben.
function spielerAufsRaster(){
  const k = kachelVon(player.x, player.y);
  const m = kachelMitte(k.tx, k.ty);
  player.x = m.x; player.y = m.y;
  player.schritt = null;
}
function fadeTo(fn){
  if(state.fadeDir!==0) return;             // läuft schon
  player.schritt = null;                    // angefangener Kachelschritt verfällt beim Szenenwechsel
  fadeAction = fn; state.fadeDir = 1;
}
function fadeUpdate(dt){
  if(state.fadeDir === 0) return;
  state.fade += state.fadeDir * dt * 3.2;
  if(state.fadeDir > 0 && state.fade >= 1){
    state.fade = 1;
    if(fadeAction){ fadeAction(); fadeAction = null; spielerAufsRaster(); }
    state.fadeDir = -1;                     // wieder aufblenden
    state.expo = exposure();                // Helligkeit sofort passend setzen
  } else if(state.fadeDir < 0 && state.fade <= 0){
    state.fade = 0; state.fadeDir = 0;
  }
}

/* --- Auf der Matratze schlafen: bis zum nächsten Morgen --- */
function tentSleep(){
  fadeTo(()=>{
    const c = state.clock;
    const ziel = 7*60;                      // 7:00 morgens
    if(c.min >= ziel) c.day++;              // nach 7: bis morgen früh
    c.min = ziel;
    state.energy = clamp(state.energy + 55, 0, 100);
    herzenAuffuellen();                     // Schlaf heilt, wie bei Zelda
    state.flashlight = false;               // im Schlaf ausgeschaltet
    state.expo = exposure();
    toast('Du schläfst tief und fest. Guten Morgen!');
  });
}

// Boden des Geländes: festgetretene Wiese, vor der Bühne blanke Erde
function buildStageGround(){
  stageGround = document.createElement('canvas');
  stageGround.width = STAGE.W*TILE; stageGround.height = STAGE.H*TILE;
  const g = stageGround.getContext('2d');
  const rnd = mulberry32(4711);
  for(let ty=0; ty<STAGE.H; ty++){
    for(let tx=0; tx<STAGE.W; tx++){
      // Direkt vor der Bühne ist das Gras längst plattgetreten
      const pit = (ty>=11 && ty<=24 && tx>=8 && tx<=32);
      g.fillStyle = pit ? '#c2ab7e' : '#a3cf6b';
      g.fillRect(tx*TILE, ty*TILE, TILE, TILE);
      for(let i=0;i<5;i++){
        const px = tx*TILE + Math.floor(rnd()*15);
        const py = ty*TILE + Math.floor(rnd()*15);
        if(pit) g.fillStyle = rnd()<0.5 ? '#b09a70' : '#d0ba8e';
        else    g.fillStyle = rnd()<0.5 ? '#94c15c' : '#b2da7b';
        g.fillRect(px,py,1,1);
      }
      if(pit && rnd()<0.06){            // Müll und Becher im Publikumsbereich
        const px=tx*TILE+3+Math.floor(rnd()*10), py=ty*TILE+3+Math.floor(rnd()*10);
        g.fillStyle = rnd()<0.5 ? '#e8e0d0' : '#d9c48a';
        g.fillRect(px,py,2,2);
      } else if(!pit && rnd()<0.05){
        const px=tx*TILE+4+Math.floor(rnd()*8), py=ty*TILE+4+Math.floor(rnd()*8);
        g.fillStyle='#7fb35f'; g.fillRect(px,py,1,3); g.fillRect(px+2,py+1,1,2);
      }
    }
  }
}

function drawStage(){
  camX=clamp(Math.round(player.x-GAME_W/2), 0, STAGE.W*TILE-GAME_W);
  camY=clamp(Math.round(player.y-GAME_H/2-10), 0, STAGE.H*TILE-GAME_H);
  ctx.save();
  ctx.translate(-camX,-camY);
  ctx.drawImage(bodenBild(stageGround),0,0);
  const list=[];
  for(const o of stageObjects) list.push({y:o.base, f:()=>drawStageObject(o)});
  for(const n of stageNpcs)    list.push({y:n.y, f:()=>drawEntity(n)});
  list.push({y:player.y, f:()=>drawPlayerEnt()});
  list.sort((a,b)=>a.y-b.y);
  for(const it of list) it.f();
  drawGetrageneSticks();
  for(const p of particles){
    ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
  }
  if(currentCandidate && !state.dialog && !state.menu){

    const w=ctx.measureText('E').width+8;

    ctx.fillStyle='#e8c46a'; ctx.fillText('E', c.x-w/2+4, c.y+2);
  }
  ctx.restore();
  drawLighting();
  zeichneAcidWelle();
  zeichneHighSchleier();
  drawHUD();
  drawTouchPad();
  drawTouchButton();
  if(state.dialog) drawDialog();
  if(state.menu) drawMenu();
  drawToasts();
  drawFade();
}

/* ============ DER FOODCOURT ============
   Vierter Schauplatz. Man kommt von links herein, läuft an den Ständen
   nach rechts und dann nach Norden hoch zur zweiten Bühne. */
const FOOD = { W:34, H:32 };
const foodObjects = [];
const foodSolids  = [];
const foodLights  = [];
let foodGround = null;

// Wo überall gelaufen wird: der waagerechte Gang und der Weg nach oben
const FOOD_PATHS = [
  [2, 22, 15, 6],    // kurzer Gang von links herein
  [12, 2, 8, 26]     // die lange Kante nach Norden – hier stehen die Stände
];
function foodIsPath(tx,ty){
  return FOOD_PATHS.some(r => tx>=r[0] && tx<r[0]+r[2] && ty>=r[1] && ty<r[1]+r[3]);
}
function buildFoodGround(){
  foodGround = document.createElement('canvas');
  foodGround.width = FOOD.W*TILE; foodGround.height = FOOD.H*TILE;
  const g = foodGround.getContext('2d');
  const rnd = mulberry32(9182);
  for(let ty=0; ty<FOOD.H; ty++){
    for(let tx=0; tx<FOOD.W; tx++){
      const weg = foodIsPath(tx,ty);
      g.fillStyle = weg ? '#c7b183' : '#a3cf6b';
      g.fillRect(tx*TILE, ty*TILE, TILE, TILE);
      for(let i=0;i<5;i++){
        const px = tx*TILE + Math.floor(rnd()*15);
        const py = ty*TILE + Math.floor(rnd()*15);
        g.fillStyle = weg ? (rnd()<0.5?'#b39f74':'#d6c295') : (rnd()<0.5?'#94c15c':'#b2da7b');
        g.fillRect(px,py,1,1);
      }
      // Auf dem Gang liegen Becher und Servietten herum
      if(weg && rnd()<0.07){
        const px=tx*TILE+3+Math.floor(rnd()*10), py=ty*TILE+3+Math.floor(rnd()*10);
        g.fillStyle = rnd()<0.5 ? '#e8e0d0' : '#d9b48a';
        g.fillRect(px,py,2,2);
      }
    }
  }
}

function teufelNeuesZiel(o){
  for(let versuch=0; versuch<8; versuch++){
    const wx = o.heimX + (Math.random()*2-1)*TEUFEL_RADIUS;
    const wy = o.heimY + (Math.random()*2-1)*TEUFEL_RADIUS*0.5;   // eher breit als hoch
    // Nicht nur den Zielpunkt selbst prüfen, sondern auch etwas Platz drumherum –
    // sonst führt der Weg dorthin manchmal hauchdünn an einem Baum o.Ä. vorbei
    // und er schleift sichtbar an der Kante entlang.
    const frei = istFrei(wx, wy, foodSolids)
      && istFrei(wx-12, wy, foodSolids) && istFrei(wx+12, wy, foodSolids)
      && istFrei(wx, wy-12, foodSolids) && istFrei(wx, wy+12, foodSolids);
    if(frei){
      o.ziel = {x:wx, y:wy};
      // Blickrichtung für die ganze Sequenz einmal festlegen, damit
      // die Animation nicht mittendrin die Richtung wechselt.
      o.facing = (wx >= o.x) ? 'right' : 'left';
      o.schrittIndex = 0; o.schrittT = 0; o.angekommen = false;
      return;
    }
  }
  o.ziel = null;
}
function teufelUpdate(o, dt){
  if(o.modus==='idle'){
    o.blinkT -= dt;
    if(o.blinkT<=0){
      if(!o.blinkAn){ o.blinkAn=true; o.blinkT=0.12; }        // kurzer Lidschlag
      else { o.blinkAn=false; o.blinkT=2+Math.random()*3.5; } // dann wieder länger offen
    }
  }
  if(o.modus==='idle' || o.modus==='zepter'){
    o.modusT -= dt;
    if(o.modusT<=0){
      if(o.modus==='idle' && Math.random()<0.4){
        o.modus='zepter'; o.modusT=0.9;               // kurzer Auftakt mit hochgestrecktem Zepter
      } else {
        o.modus='laufen'; teufelNeuesZiel(o);
        if(!o.ziel) { o.modus='idle'; o.modusT=2+Math.random()*3; }
      }
    }
  } else if(o.modus==='laufen'){
    const dx=o.ziel.x-o.x, dy=o.ziel.y-o.y, dist=Math.hypot(dx,dy);
    if(!o.angekommen){
      if(dist < 5){
        o.angekommen = true;                          // Ziel erreicht, Schritt wird trotzdem zu Ende geführt
      } else {
        // Der Teufel hat nur Bilderfolgen für links/rechts – seine
        // Blickrichtung für die Sequenz bleibt daher fest, auch wenn der
        // Kachelschritt gerade nach oben oder unten geht.
        const richtungVorher = o.facing;
        if(npcKachelZiel(o, o.ziel.x, o.ziel.y, 22, dt, foodSolids)) o.base = o.y;
        else o.angekommen = true;                      // kommt nicht weiter – Sequenz trotzdem beenden
        o.facing = richtungVorher;
      }
    }
    // Die Schrittfolge läuft unabhängig von der Bewegung gleichmäßig durch
    // und beendet sich nur an ihrem eigenen Zyklusende.
    o.schrittT += dt;
    const folge = TEUFEL_ANIM[o.facing];
    while(o.schrittT >= TEUFEL_SCHRITT_DAUER){
      o.schrittT -= TEUFEL_SCHRITT_DAUER;
      o.schrittIndex++;
      if(o.schrittIndex >= folge.length){
        o.schrittIndex = 0;
        if(o.angekommen){ o.modus='idle'; o.modusT=2+Math.random()*4; break; }
      }
    }
  }
  if(o.modus==='zepter' || o.modus==='idle') o.animT += dt;
  o.ax = o.x; o.ay = o.y;
}
function drawTeufel(o){
  const wipp = Math.sin(state.time*2.4 + o.heimX) * 1.4;
  let frame;
  if(o.modus==='zepter') frame = TEUFEL_ANIM.zepter[0];
  else if(o.modus==='laufen') frame = TEUFEL_ANIM[o.facing][o.schrittIndex] || TEUFEL_ANIM[o.facing][0];
  else if(o.facing==='right') frame = TEUFEL_ANIM.idleRechts[0];   // echte Zeichnung, nicht gespiegelt
  else frame = o.blinkAn ? TEUFEL_ANIM.idle[1] : TEUFEL_ANIM.idle[0];
  ctx.fillStyle='rgba(40,20,30,0.2)';
  ctx.fillRect(o.x-6, o.y-2, 12, 3);
  // Laufbilder sind für beide Richtungen eigens gezeichnet – nicht spiegeln.
  // Idle und Zepter gibt es nur einmal (Grundform zeigt nach links), darum
  // beim Blick nach rechts spiegeln, sonst klappt der Kopf beim Stehenbleiben um.
  // Nur die Zepter-Pose gibt es lediglich einmal – die wird bei Blick nach
  // rechts gespiegelt. Idle nach rechts hat inzwischen eine echte Zeichnung.
  const flip = o.modus==='zepter' && o.facing==='right';
  const br = frame[0].length;
  ctx.save();
  drawGrid(frame, TEUFEL_PAL, Math.round(o.x - br/2), Math.round(o.y + wipp - frame.length), flip, 1);
  ctx.restore();
}

function drawEinlass(o){
  ctx.fillStyle='rgba(20,16,30,0.22)'; ctx.fillRect(o.x, o.base-4, o.w, 5);
  // Zwei Häuschen mit Durchgang dazwischen
  for(const hx of [o.x, o.x+5*TILE]){
    ctx.fillStyle='#6a5340'; ctx.fillRect(hx, o.base-34, 3*TILE, 34);
    ctx.fillStyle='#7d6349'; ctx.fillRect(hx+2, o.base-32, 3*TILE-4, 30);

    ctx.fillStyle='#4a4358'; ctx.fillRect(hx, o.base-40, 3*TILE, 3);

    ctx.fillStyle='#f2e2a8'; ctx.fillRect(hx+10, o.base-24, 2*TILE-8, 8);
  }
  // Drehkreuze im Durchgang
  ctx.fillStyle='#8d8d9c';
  for(let i=0;i<3;i++) ctx.fillRect(o.x+3*TILE+8+i*16, o.base-20, 3, 20);
  ctx.fillStyle='#e8c46a'; ctx.font='bold 7px monospace'; ctx.textBaseline='top';
  const t='EINLASS';

function drawEingObject(o){
  switch(o.type){
    case 'einlass':       drawEinlass(o); break;

    case 'tree':          drawTree(o); break;
    case 'sign':          drawSign(o); break;

}
function drawEingang(){
  camX=clamp(Math.round(player.x-GAME_W/2), 0, EING.W*TILE-GAME_W);
  camY=clamp(Math.round(player.y-GAME_H/2-10), 0, EING.H*TILE-GAME_H);
  ctx.save(); ctx.translate(-camX,-camY);
  ctx.drawImage(bodenBild(eingGround),0,0);
  const list=[];
  for(const o of eingObjects) list.push({y:o.base, f:()=>drawEingObject(o)});
  list.push({y:player.y, f:()=>drawPlayerEnt()});
  list.sort((a,b)=>a.y-b.y);
  for(const it of list) it.f();
  if(currentCandidate && !state.dialog && !state.menu){

    ctx.font='bold 9px monospace'; ctx.textBaseline='top';
    const w=ctx.measureText('E').width+8;
    ctx.fillStyle='rgba(30,25,40,0.72)'; ctx.fillRect(c.x-w/2, c.y, w, 12);

  ctx.restore();
  drawLighting();
  zeichneAcidWelle();
  zeichneHighSchleier();
  drawHUD(); drawTouchPad(); drawTouchButton();

// Baut alle selbst platzierten Objekte aus state.ownStage.items neu auf –
// bei jedem Betreten der Szene und nach jeder Änderung im Baumodus.
function ownStageNeuAufbauen(){
  // (am Ende wird die Kachelkarte neu berechnet)
  for(let i=ownstageObjects.length-1;i>=0;i--) if(!ownstageObjects[i].fest) ownstageObjects.splice(i,1);
  for(let i=ownstageSolids.length-1;i>=0;i--) if(!ownstageSolids[i].fest) ownstageSolids.splice(i,1);
  for(let i=ownstageLights.length-1;i>=0;i--) if(!ownstageLights[i].fest) ownstageLights.splice(i,1);
  for(const it of state.ownStage.items){
    const def = BAU_ITEMS.find(b=>b.id===it.type);
    if(def && def.bauen) def.bauen(it.tx, it.ty);
  }
  if(typeof kachelSperren==='object') baueKachelSperren('ownstage', ohneGeoeffnete(ownstageSolids));
}

  }
  ctx.restore();
  drawLighting();
  zeichneAcidWelle();
  zeichneHighSchleier();
  drawHUD(); drawTouchPad(); drawTouchButton();
  if(state.bauModus) drawBauleiste();
  if(state.dialog) drawDialog();
  if(state.menu) drawMenu();

function bauModusUmschalten(){
  state.bauModus = !state.bauModus;
  toast(state.bauModus ? 'Baumodus an. Unten auswählen, mit E platzieren. X zum Verlassen.' : 'Baumodus aus.');
}
function bauAktion(){
  const [fx,fy] = facingVec();
  const tx = Math.round((player.x+fx*TILE)/TILE), ty = Math.round((player.y+fy*TILE)/TILE);
  const gewaehlt = BAU_ITEMS[state.bauAuswahl];
  if(gewaehlt.id==='radieren'){
    const idx = state.ownStage.items.findIndex(it=>it.tx===tx && it.ty===ty);
    if(idx>=0){ state.ownStage.items.splice(idx,1); ownStageNeuAufbauen(); toast('Entfernt.'); }
    else toast('Hier steht nichts.');
    return;
  }
  if(tx<1 || tx>=OWNSTAGE.W-1 || ty<1 || ty>=OWNSTAGE.H-1){ toast('Das ist außerhalb der Fläche.'); return; }
  if(state.ownStage.items.some(it=>it.tx===tx && it.ty===ty)){ toast('Hier steht schon etwas.'); return; }
  const box = {x:tx*TILE, y:ty*TILE, w:TILE, h:TILE};
  if(ownstageSolids.some(s=>s.fest && rectsOverlap(box,s))){ toast('Hier ist kein Platz.'); return; }
  state.ownStage.items.push({type:gewaehlt.id, tx, ty});
  ownStageNeuAufbauen();
  toast(gewaehlt.name+' aufgestellt.');
}
function eigeneDjSession(){
  startDialog(lin([{ who:'sys', name:'', text:'Auf deiner eigenen Bühne auflegen?', choices:[
    { t:'Ja, los.', next:null, fx(){ starteDjSession('eigen'); } },
    { t:'Gleich vielleicht.', next:null }
  ]}]), {breakable:true});
}

  else if(id==='lantern'){ ctx.fillStyle='#4a4038'; ctx.fillRect(7,1,3,14); ctx.fillStyle='#e8c46a'; ctx.fillRect(5,9,7,5); }
  else if(id==='fence'){ ctx.fillStyle='#6a6a78'; ctx.fillRect(1,7,14,4); ctx.fillStyle='#8d8d9c'; ctx.fillRect(1,7,14,1); }
  else if(id==='stumpf'){ ctx.fillStyle='#6d4a2f'; ctx.fillRect(3,7,10,7); ctx.fillStyle='#8a6a4a'; ctx.fillRect(3,7,10,2); }
  else if(id==='bush'){ ctx.fillStyle='#63994b'; ctx.fillRect(3,6,10,8); ctx.fillStyle='#7fb35f'; ctx.fillRect(4,5,6,3); }
  else if(id==='djbooth'){ ctx.fillStyle='#3b3547'; ctx.fillRect(1,5,14,9); ctx.fillStyle='#15121d'; ctx.fillRect(3,7,4,4); ctx.fillRect(9,7,4,4); }
  else if(id==='radieren'){ ctx.fillStyle='#c9402f'; ctx.fillRect(3,3,10,10); ctx.fillStyle='#fdf3dc'; ctx.fillRect(5,7,6,2); }
}
function drawBauleiste(){
  const n = BAU_ITEMS.length, slotW=40;

/* ============ LEBEN IM FOODCOURT ============
   Passanten laufen durch, manche stellen sich beim Café-Van an.
   Das Kaffee-Team arbeitet in Acht-Stunden-Schichten, wer frei hat,
   spaziert herum oder sitzt hinter dem Van im Schatten. Runner holen
   Nachschub, wenn etwas ausgeht. */
const foodCrowd = [];                     // Passanten (Foodcourt und Waldbühne)
const foodRunners = [];                   // Leute, die Kisten schleppen
const FOOD_CROWD_MIN = 9;                 // so viele sind mindestens unterwegs
let foodSpawnT = 0;

// Ein- und Ausgänge der Foodcourt-Karte
const FOOD_EXITS = [
  { id:'camp', x:3*TILE,  y:25*TILE+8 },
  { id:'wald', x:15*TILE+8, y:3*TILE }
];
const FOOD_CORNER = { x:15*TILE, y:24*TILE+8 };

// --- Der Café-Van: feste Punkte ---
const VAN = {
  x: 5*TILE, y: 19*TILE, w:78, h:52,
  get base(){ return this.y + this.h; },
  get lukeX(){ return this.x + 21; },              // Mitte der Durchreiche
  get schattenX(){ return this.x + 20; },          // hinter dem Van
  get schattenY(){ return this.y - 16; }
};
// Die Schlange läuft von der Luke nach links weg und biegt dann nach oben ab,
// damit sie nicht den Eingang unten links zustellt.
function queueSpot(i){
  const y0 = VAN.base + 16;
  let x, y;
  if(i < 3){ x = VAN.lukeX - i*13; y = y0 + (i%2?2:0); }
  else { const j = i - 3; x = VAN.lukeX - 39 - Math.min(j,4)*4; y = y0 - 2 - j*12; }
  // Auf die nächste Kachelmitte ziehen – die Schlange steht sonst als
  // einziges System schräg im Raster.
  const k = kachelVon(x, y);
  return kachelMitte(k.tx, k.ty);
}

const coffee = {
  team: [],            // drei Leute
  queue: [],           // wer ansteht (Spieler steckt als Marker mit drin)
  ziel: 5,             // angestrebte Schlangenlänge
  zielT: 0,            // wann neu ausgewürfelt wird
  serveT: 3,           // bis der Vorderste dran ist
  vorrat: 24,          // Tassen bis Nachschub nötig
  playerIdx: -1,       // wo der Spieler steht (-1 = nicht angestellt)
  nachschub: 0,        // >0: Runner ist unterwegs
  bestellung: null,    // laufendes Hin und Her am Tresen
  ansprache: null,     // jemand aus der Schlange hat dich angesprochen
  gespraechMit: null,  // mit wem gerade geredet wird
  stehZeit: 0,         // wie lange der Spieler schon ansteht
  anspracheCool: 30,   // Ruhe, bis wieder jemand von sich aus redet
  endeAbgenickt: false,// wie das letzte Gespräch ausging
  gespraech: null,     // laufendes Gespräch mit dem Nachbarn
  quatschGenutzt: false // Smalltalk am Tresen pro Bestellung nur einmal
};

const KAFFEE_NAMEN = ['Nuri','Pelle','Sam'];
function buildCoffeeTeam(){
  coffee.team.length = 0;
  const pals = [
    { o:'#4a3a35', h:'#8a4a2f', d:'#6d3722', s:'#e0b088', S:'#c08e66', e:'#2e2430',
      c:'#3f6f8a', k:'#2e5468', p:'#3a3f47', b:'#4a3a2a' },
    { o:'#4a3a35', h:'#2e2833', d:'#1f1a24', s:'#8a5f3f', S:'#6d472c', e:'#2e2430',
      c:'#c95a4a', k:'#a3402f', p:'#474c66', b:'#4a3a2a' },
    { o:'#4a3a35', h:'#d8d0b8', d:'#b3ab92', s:'#d8a878', S:'#b8875a', e:'#2e2430',
      c:'#5f9b6a', k:'#457a4f', p:'#3f4457', b:'#4a3a2a' }
  ];
  for(let i=0;i<3;i++){
    // Startplatz auf die Kachelmitte ziehen – sonst steht das Kaffee-Team
    // als einziges System dauerhaft neben dem Raster.
    const roh = { x: VAN.schattenX + (i-1)*15, y: VAN.schattenY + (i%2?5:0) };
    const kk = kachelVon(roh.x, roh.y), mm = kachelMitte(kk.tx, kk.ty);
    coffee.team.push({
      id:'kaffee'+i, name:KAFFEE_NAMEN[i], pal:heldenPalette(pals[i]), gridSet:HERO_GRIDS,
      x:mm.x, y:mm.y, facing:'down',
      moving:false, animT:Math.random(), frame:0,
      modus:'pause', modusT:5+Math.random()*20, ziel:null, chat:null, chatCool:3
    });
  }
}
// Wer hat gerade Schicht? Alle acht Stunden wird gewechselt.
function schichtIndex(){
  const std = (state.clock.day-1)*24 + state.clock.min/60;
  return Math.floor(std/8) % 3;
}
function baristaJetzt(){ return coffee.team[schichtIndex()]; }

// Gewichtete Schlangenlänge: meistens um die fünf, selten leer, oft viel mehr
function wuerfleSchlange(){
  const r = Math.random();
  if(r < 0.06) return 0;                                   // selten mal niemand
  if(r < 0.55) return 3 + Math.floor(Math.random()*5);      // meistens 3-7
  if(r < 0.85) return 8 + Math.floor(Math.random()*5);      // oft deutlich mehr
  return 13 + Math.floor(Math.random()*6);                  // manchmal richtig voll
}
// Ein neuer Gast. Wer sich anstellt, kommt von der Gasse her angelaufen –
// sofort=true setzt ihn direkt auf seinen Platz (beim Betreten der Karte).
function neuerAnsteher(idx, sofort){
  const s = queueSpot(idx||0);
  const start = sofort ? s : { x: s.x + 40 + Math.random()*40, y: s.y + 14 + Math.random()*10 };
  const figur = zufaelligeWandererFigur();
  return { pal:figur.pal, gridSet:figur.gridSet, facing:'up',
           moving:false, animT:Math.random()*2, frame:0,
           x:start.x, y:start.y, chat:null, chatCool:1+Math.random()*6, istSpieler:false };
}
// Beim Betreten der Karte steht schon jemand an – zwischen null und zehn Leuten
function schlangeNeuAufstellen(){
  coffee.queue.length = 0;
  coffee.playerIdx = -1;
  coffee.bestellung = null;
  const n = Math.floor(Math.random()*11);
  for(let i=0;i<n;i++) coffee.queue.push(neuerAnsteher(i, true));
  coffee.ziel = Math.max(n, wuerfleSchlange());
  coffee.zielT = 15+Math.random()*20;
}

// Schickt jemanden aus der Menge zur Schlange. Ist gerade niemand in der Nähe,
// betritt jemand ganz normal über einen Ausgang die Karte und läuft hin.
function schickJemandenZurSchlange(){
  const frei = foodCrowd.filter(p=>!p.zurSchlange && p.pause<=0);
  let wer = null;
  if(frei.length){
    // Am liebsten jemand, der ohnehin schon in der Nähe ist
    frei.sort((a,b)=>Math.hypot(a.x-VAN.lukeX,a.y-VAN.base) - Math.hypot(b.x-VAN.lukeX,b.y-VAN.base));
    wer = frei[0];
  } else {
    spawnFoodPerson();
    wer = foodCrowd[foodCrowd.length-1];
  }
  if(!wer) return;
  wer.zurSchlange = true;
  wer.anmarschNr = ++anmarschZaehler;   // Reihenfolge der Ankommenden
  wer.route = [];                       // das Ziel wird laufend neu bestimmt
}
let anmarschZaehler = 0;

/* --- Passanten --- */
function spawnFoodPerson(){
  const ein = pick(FOOD_EXITS);
  const aus = FOOD_EXITS.find(e=>e.id!==ein.id);
  // Freie Kachel in der Nähe des Eingangs suchen – ohne Prüfung standen
  // gelegentlich zwei Leute auf derselben Kachel.
  let start = null;
  for(let versuch=0; versuch<10 && !start; versuch++){
    const k = kachelVon(ein.x+(Math.random()*20-10), ein.y+(Math.random()*20-10));
    if(kachelGesperrt(k.tx,k.ty)) continue;
    if(kachelBelegtVonFigur(k.tx,k.ty,null)) continue;
    start = kachelMitte(k.tx,k.ty);
  }
  if(!start) return;                            // gerade kein Platz frei
  foodCrowd.push({
    scene:'food',
    x:start.x, y:start.y,
    facing:'down', moving:true, animT:Math.random()*2, frame:0,
    ...zufaelligeWandererFigur(),
    route: ein.id==='camp'
      ? [{x:FOOD_CORNER.x+(Math.random()*40-20), y:FOOD_CORNER.y+(Math.random()*30-15)}, {x:aus.x, y:aus.y}]
      : [{x:FOOD_CORNER.x+(Math.random()*40-20), y:FOOD_CORNER.y+(Math.random()*30-15)}, {x:aus.x, y:aus.y}],
    speed: 30+Math.random()*20,
    travelT: 0,
    pause: 0,                                   // steht gerade und schaut
    zurSchlange: false,                         // will sich Kaffee holen
    chat: null, chatCool: 2+Math.random()*5
  });
}
function moveFoodPerson(p, dx, dy){
  p.x += dx;
  let box = entBox(p);
  for(const s of foodSolids){
    if(rectsOverlap(box,s)){
      if(dx>0) p.x = s.x - 5; else if(dx<0) p.x = s.x + s.w + 5;
      box = entBox(p);
    }
  }
  p.y += dy;
  box = entBox(p);
  for(const s of foodSolids){
    if(rectsOverlap(box,s)){
      if(dy>0) p.y = s.y - 0.01; else if(dy<0) p.y = s.y + s.h + 7;
      box = entBox(p);
    }
  }
}
function foodCrowdUpdate(dt){
  if(foodCrowd.length < FOOD_CROWD_MIN){
    foodSpawnT -= dt;
    if(foodSpawnT<=0){ foodSpawnT = 0.3+Math.random()*0.8; spawnFoodPerson(); }
  }
  for(let i=foodCrowd.length-1;i>=0;i--){
    const p = foodCrowd[i];
    // Wer sich anstellen will, läuft ans jeweils aktuelle Ende der Schlange
    if(p.zurSchlange){
      const vorDran = foodCrowd.filter(o=>o.zurSchlange && o.anmarschNr < p.anmarschNr).length;
      const s = queueSpot(coffee.queue.length + vorDran);
      const dx=s.x-p.x, dy=s.y-p.y, d=Math.hypot(dx,dy);
      if(d < 5){
        // Angekommen: nahtlos in die Schlange wechseln – aber nur, wenn der
        // Platz wirklich frei ist. Ohne Prüfung landete jemand auf einer
        // Kachel, auf der schon eine andere Figur stand.
        const qk = kachelVon(s.x, s.y);
        if(kachelBelegtVonFigur(qk.tx, qk.ty, p)){
          p.moving = false;                     // kurz warten, dann nochmal
          continue;
        }
        // Palette UND Sprite-Satz müssen zusammen übernommen werden – nur
        // die Palette zu kopieren ergab eine NPC1-Palette auf einem
        // Helden-Sprite (fehlende Farben = "falsche" Figur).
        const q = neuerAnsteher(coffee.queue.length, true);
        q.pal=p.pal; q.gridSet=p.gridSet; q.x=s.x; q.y=s.y;
        coffee.queue.push(q);
        foodCrowd.splice(i,1);
        continue;
      }
      npcKachelZiel(p, s.x, s.y, p.speed*zombieTempo(), dt, foodSolids);
      continue;
    }
    if(p.pause>0){ p.pause-=dt; p.moving=false; continue; }
    p.travelT += dt;
    if(p.travelT>90){ foodCrowd.splice(i,1); continue; }
    const wp = p.route[0];
    if(!wp){ foodCrowd.splice(i,1); continue; }
    const dx=wp.x-p.x, dy=wp.y-p.y, d=Math.hypot(dx,dy);
    if(d<8){
      p.route.shift();
      if(!p.route.length){
        foodCrowd.splice(i,1);
      }
      continue;
    }
    // Kachelweise zum nächsten Wegpunkt (wie der Spieler)
    npcKachelZiel(p, wp.x, wp.y, p.speed*zombieTempo(), dt, foodSolids);
    // Manche bleiben unterwegs kurz stehen und schauen sich um
    if(!p.kSchritt && Math.random() < 0.12*dt){ p.pause = 1+Math.random()*4; }
  }
}

/* --- Runner: holen Kisten vom Lager zu den Ständen --- */
const RUNNER_LAGER = { x:23*TILE, y:24*TILE };
function spawnRunner(fuerKaffee){
  const ziele = [{x:10*TILE, y:17*TILE+40},{x:22*TILE, y:13*TILE+40},{x:10*TILE, y:10*TILE+40}];
  const ziel = fuerKaffee ? {x:VAN.lukeX, y:VAN.base+6} : pick(ziele);
  foodRunners.push({
    x:RUNNER_LAGER.x, y:RUNNER_LAGER.y, facing:'up', moving:true,
    animT:Math.random(), frame:0, ...zufaelligeWandererFigur(),
    kiste:true, kaffee:!!fuerKaffee,
    route:[{x:FOOD_CORNER.x, y:FOOD_CORNER.y}, ziel, {x:RUNNER_LAGER.x, y:RUNNER_LAGER.y}],
    speed: 46+Math.random()*14, travelT:0
  });
}
function foodRunnersUpdate(dt){
  for(let i=foodRunners.length-1;i>=0;i--){
    const r = foodRunners[i];
    r.travelT += dt;
    if(r.travelT>120){ foodRunners.splice(i,1); continue; }
    const wp = r.route[0];
    if(!wp){ foodRunners.splice(i,1); continue; }
    const dx=wp.x-r.x, dy=wp.y-r.y, d=Math.hypot(dx,dy);
    if(d<8){
      r.route.shift();
      // Am Ziel angekommen: Kiste abgeben
      if(r.route.length===1){
        r.kiste = false;
        if(r.kaffee){ coffee.vorrat = 24; coffee.nachschub = 0; }
      }
      if(!r.route.length) foodRunners.splice(i,1);
      continue;
    }
    npcKachelZiel(r, wp.x, wp.y, r.speed, dt, foodSolids);
  }
  // Ab und zu schickt jemand einen Runner los, auch ohne Anlass
  if(foodRunners.length < 2 && Math.random() < 0.04*dt*60/60){
    if(Math.random()<0.02) spawnRunner(false);
  }
}

// Der Van steht im Weg: wer von hinten nach vorne will (oder umgekehrt),
// geht links außen herum statt zu versuchen, hindurchzulaufen.
function routeUmDenVan(m, ziel){
  const obenAlt = m.y < VAN.y, obenNeu = ziel.y < VAN.y;
  const imWeg = (m.x > VAN.x-10 && m.x < VAN.x+VAN.w+10) ||
                (ziel.x > VAN.x-10 && ziel.x < VAN.x+VAN.w+10);
  // Auch die Zwischenpunkte müssen auf Kachelmitten liegen, sonst bleibt
  // die Figur unterwegs zwischen zwei Kacheln stehen.
  const raster = (x,y)=>{ const k=kachelVon(x,y); return kachelMitte(k.tx,k.ty); };
  if(obenAlt !== obenNeu && imWeg){
    const seite = VAN.x - 18;                 // links am Van vorbei
    return [raster(seite, m.y), raster(seite, ziel.y), ziel];
  }
  return [ziel];
}

/* --- Das Team: Schicht am Van, sonst spazieren oder Pause --- */
function coffeeTeamUpdate(dt){
  const dienst = schichtIndex();
  for(let i=0;i<coffee.team.length;i++){
    const m = coffee.team[i];
    if(i!==dienst && m.modus==='dienst'){
      // Gerade Feierabend: raus aus dem Van, ab in den Schatten (auf Kachel)
      const fk = kachelVon(VAN.schattenX + (i-1)*15 + (Math.random()*6-3),
                           VAN.schattenY + (i%2?5:0) + (Math.random()*5-2));
      const fm = kachelMitte(fk.tx, fk.ty);
      m.x = fm.x; m.y = fm.y;
      m.modus = 'pause'; m.modusT = 8+Math.random()*14;
      m.route = [];
    }
    if(i===dienst){                       // steht am Tresen
      if(m.modus!=='dienst') toast(m.name+' übernimmt die Schicht am Café-Van.');
      m.modus='dienst'; m.moving=false;
      const tk = kachelVon(VAN.lukeX, VAN.y + 34);
      const tm = kachelMitte(tk.tx, tk.ty);
      m.x = tm.x; m.y = tm.y;
      m.facing='down';
      continue;
    }
    m.modusT -= dt;
    if(m.modusT<=0){
      // Nach der Pause entweder spazieren oder wieder in den Schatten
      m.modus = Math.random()<0.45 ? 'spazieren' : 'pause';
      m.modusT = 12+Math.random()*30;
      const zielRoh = m.modus==='spazieren'
        ? { x: 4*TILE+Math.random()*12*TILE, y: 22*TILE+Math.random()*4*TILE }
        : { x: VAN.schattenX + (i-1)*15 + (Math.random()*8-4),
            y: VAN.schattenY + (i%2?5:0) + (Math.random()*6-3) };
      const zk = kachelVon(zielRoh.x, zielRoh.y);
      const ziel = kachelMitte(zk.tx, zk.ty);   // Zielpunkt aufs Raster
      m.route = routeUmDenVan(m, ziel);
    }
    // Der Weg wird Punkt für Punkt abgelaufen
    if(m.route && m.route.length){
      const wp = m.route[0];
      const dx=wp.x-m.x, dy=wp.y-m.y, d=Math.hypot(dx,dy);
      if(d<5){ m.route.shift(); }
      else {
        npcKachelZiel(m, wp.x, wp.y, 38, dt, foodSolids);
      }
    } else {
      m.moving=false;
      if(m.modus==='pause') m.facing='down';
    }
  }
}

/* --- Die Schlange --- */
function schlangeLaenge(){ return coffee.queue.length; }
function spielerStehtAn(){ return coffee.playerIdx >= 0; }

function coffeeUpdate(dt){
  // Ziel-Länge ab und zu neu würfeln
  coffee.zielT -= dt;
  if(coffee.zielT<=0){ coffee.zielT = 18+Math.random()*26; coffee.ziel = wuerfleSchlange(); }
  // Auffüllen: niemand erscheint aus dem Nichts – es kommt jemand aus der Menge,
  // und wenn gerade niemand da ist, betritt jemand die Karte am Eingang.
  const ohneSpieler = coffee.queue.filter(q=>!q.istSpieler).length;
  const anmarsch = foodCrowd.filter(p=>p.zurSchlange).length;
  if(ohneSpieler + anmarsch < coffee.ziel && Math.random() < 1.3*dt){
    schickJemandenZurSchlange();
  } else if(ohneSpieler > coffee.ziel + 2 && Math.random() < 0.5*dt){
    for(let i=coffee.queue.length-1;i>=0;i--){
      if(!coffee.queue[i].istSpieler){ coffee.queue.splice(i,1); break; }
    }
    if(coffee.playerIdx >= coffee.queue.length) coffee.playerIdx = coffee.queue.length-1;
  }
  // Am Tresen wird bestellt: erst das Hin und Her, dann ist der Gast durch
  if(coffee.queue.length && coffee.vorrat>0){
    const vorne = coffee.queue[0];
    const amPlatz = vorne.istSpieler ||
      (Math.abs(vorne.x-queueSpot(0).x)<3 && Math.abs(vorne.y-queueSpot(0).y)<3);
    if(!coffee.bestellung && amPlatz){ coffee.bestellung = neueBestellung(); }
    if(coffee.bestellung){
      coffee.bestellung.t += dt;
      if(coffee.bestellung.t > 1.15){
        coffee.bestellung.t = 0;
        coffee.bestellung.idx++;
        if(coffee.bestellung.idx >= coffee.bestellung.schritte.length){
          coffee.bestellung = null;
          if(vorne.istSpieler){ spielerDran(); }
          else {
            coffee.queue.shift();
            coffee.vorrat--;
            if(coffee.playerIdx>0) coffee.playerIdx--;
            if(coffee.vorrat<=0 && !coffee.nachschub){ coffee.nachschub=1; spawnRunner(true); }
          }
        }
      }
    }
  } else if(coffee.queue.length && coffee.vorrat<=0){
    coffee.bestellung = null;
    if(!coffee.nachschub){ coffee.nachschub = 1; spawnRunner(true); }
  }
  // Alle an ihren Platz stellen und plaudern lassen
  for(let i=0;i<coffee.queue.length;i++){
    const q = coffee.queue[i];
    const s = queueSpot(i);
    if(q.istSpieler){ player.x = s.x; player.y = s.y; player.facing = i<3 ? 'up' : 'down'; continue; }
    // Nachrücken: normales Gehtempo, kein Ziehen
    const dx=s.x-q.x, dy=s.y-q.y, d=Math.hypot(dx,dy);
    if(d > 0.6){
      npcKachelZiel(q, s.x, s.y, 36, dt, foodSolids);
    } else {
      q.x = s.x; q.y = s.y; q.moving = false;
    }
    // Vorne schaut man zum Tresen, weiter hinten nach vorne in die Reihe
    q.facing = i<3 ? 'up' : 'down';
    if(q.chat){ q.chat.t-=dt; if(q.chat.t<=0) q.chat=null; }
    else if(q.chatCool>0) q.chatCool-=dt;
  }
  // Nur wenn der Spieler ansteht, hört er die Gespräche um sich herum
  if(coffee.anspracheCool > 0) coffee.anspracheCool -= dt;
  if(spielerStehtAn()){
    coffee.stehZeit += dt;
    for(let i=0;i<coffee.queue.length;i++){
      const q = coffee.queue[i];
      if(q.istSpieler || q.chat || q.chatCool>0) continue;
      if(Math.abs(i-coffee.playerIdx) > 3) continue;      // nur in Hörweite
      if(Math.random() < 0.5*dt){
        q.chat = { t:2.6, icon:pick(KAFFEE_THEMEN), role:'ask' };
        q.chatCool = 5+Math.random()*8;
      }
    }
    // Ab und zu spricht dich jemand direkt an – dann kann man antworten
    if(coffee.ansprache){
      coffee.ansprache.t -= dt;
      if(coffee.ansprache.t<=0) coffee.ansprache = null;
    } else if(!state.dialog && coffee.stehZeit > 14 && coffee.anspracheCool <= 0
              && Math.random() < 0.02*dt){
      // Selten mal spricht dich jemand von der Seite an
      const nachbarn = [coffee.playerIdx-1, coffee.playerIdx+1]
        .filter(i=>i>=0 && i<coffee.queue.length && !coffee.queue[i].istSpieler);
      if(nachbarn.length){
        const i = pick(nachbarn);
        coffee.ansprache = { idx:i, t:20 };
        starteQueueGespraech(i);
        startDialog('queueTalk1', {breakable:true});
      }
    }
  } else {
    coffee.ansprache = null;
    coffee.stehZeit = 0;
  }
}
const KAFFEE_THEMEN = ['kuh','kuhDurch','tasse','zucker','herz','note','frage'];
// Womit die Bedienung antwortet und womit Gäste bestellen
const BESTELL_GAST = ['tasse','doppelt','kuh','kuhDurch','zucker'];

// Ein kleines Hin und Her am Tresen: Gast sagt was, Bedienung antwortet
function neueBestellung(){
  const schritte = [];
  schritte.push({ wer:'gast', icon: pick(['tasse','doppelt']) });
  schritte.push({ wer:'bed',  icon: 'frage' });
  schritte.push({ wer:'gast', icon: pick(['kuh','kuhDurch','kuhDurch','zucker']) });
  if(Math.random()<0.3) schritte.push({ wer:'bed', icon:'herz' });      // manchmal wird geflirtet
  schritte.push({ wer:'bed',  icon: pick(['geld','karte']) });
  schritte.push({ wer:'gast', icon: pick(['geld','karte','daumen']) });
  return { schritte, idx:0, t:0 };
}
