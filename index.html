/* --- Lagerfeuer: Spielstand speichern (3 Slots) --- */
const SAVE_SLOTS = 3;
const SAVE_PREFIX = 'dataluma_save_';
function slotKey(n){ return SAVE_PREFIX + n; }
// Liest einen Slot (oder null, wenn leer / Speicher gesperrt / kaputt)
function readSlot(n){
  try {
    const raw = localStorage.getItem(slotKey(n));
    return raw ? JSON.parse(raw) : null;
  } catch(err) { return null; }
}
// Kurze Beschriftung eines Slots, z.B. "Slot 2 – Joshua [aktiv]"
function slotLabel(n){
  const s = readSlot(n);
  return 'Slot '+n+' – '+(s ? (s.playerName||'???') : 'leer')
       + (state.slot===n ? ' [aktiv]' : '');
}
function fireTalk(o){
  startDialog({ who:'sys', name:'Lagerfeuer',
    text:'Das Feuer knistert gemütlich. Ein guter Moment zum Durchatmen. Spiel speichern? Wähle einen Slot.',
    choices(){
      const c=[];
      for(let n=1; n<=SAVE_SLOTS; n++){
        c.push({ t:slotLabel(n), next:null, fx: ((k)=>()=>saveGame(k))(n) });
      }
      c.push({ t:'Nicht speichern', next:null });
      return c;
    }
  }, {breakable:false});
}
// Packt alles Wichtige in ein Objekt und legt es im gewählten Slot ab.
// Der gewählte Slot wird dabei zum aktiven Slot.
function saveGame(slot){
  const data = {
    v:1,
    playerName: state.playerName,
    creation: { skin:creation.skin, hair:creation.hair, outfit:creation.outfit },
    player: { x:Math.round(player.x), y:Math.round(player.y), facing:player.facing },
    inv: state.inv,
    wearingGlasses: state.wearingGlasses,
    ashtray: state.ashtray,
    sympathy: state.sympathy,
    friendName: state.friendName,
    flags: state.flags,
    journal: state.journal,
    energy: Math.round(state.energy),
    social: Math.round(state.social),
    clock: { min: Math.round(state.clock.min), day: state.clock.day },
    scene: state.scene,
    onBike: state.onBike,
    coffee: { vorrat: coffee.vorrat },
    flashlight: state.flashlight,
    outdoorPos: state.outdoorPos
  };
  try {
    localStorage.setItem(slotKey(slot), JSON.stringify(data));
    state.slot = slot;
    toast('In Slot '+slot+' gespeichert!');
  } catch(err) {
    toast('Speichern fehlgeschlagen – der Browser erlaubt hier kein localStorage.');
  }
}
// Neues Spiel in einem bestimmten Slot beginnen (überschreibt erst beim ersten Speichern)
function startNewGame(n){
  state.slot = n;
  state.mode = 'create';
  showNameInput();
}
// Spielstand aus einem Slot laden
function loadSlot(n){
  const s = readSlot(n);
  if(!s) return;
  state.slot = n;
  loadGame(s);
}
// Stellt einen gespeicherten Stand wieder her und springt direkt ins Spiel
function loadGame(s){
  try {
    state.playerName = s.playerName || 'Alex';
    if(s.creation){
      creation.skin   = clamp(s.creation.skin|0,   0, SKINS.length-1);
      creation.hair   = clamp(s.creation.hair|0,   0, HAIRS.length-1);
      creation.outfit = clamp(s.creation.outfit|0, 0, OUTFITS.length-1);
    }
    player.x = s.player.x; player.y = s.player.y;
    player.facing = s.player.facing || 'down';
    player.pal = playerPal();
    state.inv = Array.isArray(s.inv) ? s.inv : [];
    state.wearingGlasses = !!s.wearingGlasses;
    state.ashtray = clamp(s.ashtray|0, 0, CFG.ASH_CAPACITY);
    // Sympathie auf Startwerte zurücksetzen, damit nichts aus der
    // vorherigen Runde stehen bleibt, dann den Spielstand darüberlegen
    for(const d of DEFAULT_SYMPATHY){
      const t = state.sympathy.find(x=>x.id===d.id);
      if(t){ t.val = d.val; t.name = d.name; }
    }
    if(Array.isArray(s.sympathy)){
      for(const sv of s.sympathy){
        const t = state.sympathy.find(x=>x.id===sv.id);
        if(t){ t.val = sv.val; t.name = sv.name; }
      }
    }
    if(s.friendName) setFriend(s.friendName);
    // Flags komplett ersetzen (nicht mischen!), sonst schleppt man
    // erledigte Missionen aus der letzten Runde mit
    for(const k of Object.keys(state.flags)) delete state.flags[k];
    Object.assign(state.flags, s.flags||{});
    // Konsistenz: Wer geraucht hat und Kobi noch nicht beruhigt hat,
    // findet ihn nach dem Laden im Bad Trip vor (das High selbst wird nicht gespeichert)
    if(state.flags.kobiJointDone && !state.flags.kobiCalmed) state.flags.kobiBadTrip=true;
    if(state.flags.tomasTripDone && !state.flags.tomasGrounded) state.flags.tomasBadTrip=true;
    if(s.journal) state.journal = s.journal;
    state.energy = clamp(s.energy ?? 72, 0, 100);
    state.social = clamp(s.social ?? 60, 0, 100);
    // Alte Spielstände ohne Uhr starten einfach wieder um 14:00 an Tag 1
    state.clock.min = clamp(s.clock?.min ?? 14*60, 0, 1439);
    state.clock.day = Math.max(1, s.clock?.day ?? 1);
    state.scene = s.scene || (s.indoor ? 'tent' : 'camp');
    state.onBike = !!s.onBike;
    // Schlange und Team frisch aufbauen, nur der Vorrat bleibt erhalten
    coffee.queue.length = 0; coffee.playerIdx = -1; coffee.nachschub = 0;
    coffee.vorrat = (s.coffee && typeof s.coffee.vorrat==='number') ? s.coffee.vorrat : 24;
    foodCrowd.length = 0; foodRunners.length = 0;
    state.flashlight = !!s.flashlight;
    state.outdoorPos = s.outdoorPos ?? null;
    state.fade = 0; state.fadeDir = 0;
    state.whiteTarget = 0; state.whiteAlpha = 0;
    state.expo = exposure();   // sofort passend zur geladenen Uhrzeit
    state.mode='game'; state.cutscene=false;
    seedWanderers();
    state.helpTimer=8;
    toast("Spielstand geladen. Weiter geht's!");
  } catch(err) {
    // Kaputter Spielstand? Dann eben ein neues Spiel.
    state.mode='create';
    showNameInput();
    toast('Spielstand konnte nicht geladen werden – neues Spiel.');
  }
}

/* ============ 10. INTERAKTION ============ */
let currentCandidate = null;
function facingVec(){
  switch(player.facing){
    case 'up': return [0,-1];
    case 'down': return [0,1];
    case 'left': return [-1,0];
    default: return [1,0];
  }
}
function findCandidate(){
  const [fx,fy] = facingVec();
  const px = player.x + fx*12, py = player.y - 4 + fy*12;
  let best=null, bestD=26;
  // Im Zelt gibt es nur die Sachen darin
  if(state.scene==='tent'){
    for(const o of tentObjects){
      const d=Math.hypot(o.ax-px, o.ay-4-py);
      if(d<bestD){ bestD=d; best={x:o.ax, y:o.ay-24, act:()=>o.talk(o)}; }
    }
    currentCandidate = best;
    return;
  }
  // Auf der Waldbühne
  if(state.scene==='wald'){
    for(const o of waldObjects){
      if(!o.text && !o.talk) continue;
      const d=Math.hypot(o.ax-px, o.ay-4-py);
      if(d<bestD){ bestD=d; best={x:o.ax, y:o.ay-24, act:()=> o.talk ? o.talk(o) : objTalk(o)}; }
    }
    currentCandidate = best;
    return;
  }
  // Im Foodcourt
  if(state.scene==='food'){
    // Wer gerade frei hat, steht herum und lässt sich ansprechen
    const dienst = schichtIndex();
    for(let i=0;i<coffee.team.length;i++){
      if(i===dienst) continue;
      const m = coffee.team[i];
      const d = Math.hypot(m.x-px, m.y-6-py);
      if(d<bestD){ bestD=d; best={x:m.x, y:m.y-20, act:()=>teamTalk(m)}; }
    }
    for(const o of foodObjects){
      if(!o.text && !o.talk) continue;
      const d=Math.hypot(o.ax-px, o.ay-4-py);
      if(d<bestD){ bestD=d; best={x:o.ax, y:o.ay-24, act:()=> o.talk ? o.talk(o) : objTalk(o)}; }
    }
    currentCandidate = best;
    return;
  }
  // Auf dem Festivalgelände ebenso
  if(state.scene==='stage'){
    for(const n of stageNpcs){
      const d=Math.hypot(n.x-px, n.y-6-py);
      if(d<bestD){ bestD=d; best={x:n.x, y:n.y-18, act:()=>n.talk(n)}; }
    }
    for(const o of stageObjects){
      if(!o.text && !o.talk) continue;
      const d=Math.hypot(o.ax-px, o.ay-4-py);
      if(d<bestD){ bestD=d; best={x:o.ax, y:o.ay-22, act:()=> o.talk ? o.talk(o) : objTalk(o)}; }
    }
    currentCandidate = best;
    return;
  }
  for(const n of npcs){
    const d=Math.hypot(n.x-px, n.y-6-py);
    if(d<bestD){ bestD=d; best={x:n.x, y:n.y-18, act:()=>n.talk(n)}; }
  }
  for(const o of objects){
    if(!o.text && !o.talk) continue;
    const d=Math.hypot(o.ax-px, o.ay-4-py);
    if(d<bestD){
      bestD=d;
      best={x:o.ax, y:(o.type==='tent'? o.y+14 : o.ay-22),
            act:()=> o.talk ? o.talk(o) : objTalk(o)};
    }
  }
  for(const a of tripAnimals){
    const d=Math.hypot(a.x-px, a.y-6-py);
    if(d<bestD){ bestD=d; best={x:a.x, y:a.y-16, act:()=>animalTalk(a)}; }
  }
  currentCandidate = best;
}
function objTalk(o){
  startDialog(lin([{who:'sys', name:o.label||'', text:o.text}]), {breakable:true});
}
function tryInteract(){
  if(currentCandidate) currentCandidate.act();
}

function drawWrapped(text,x,y,maxW,lineH){
  const words=String(text).split(' ');
  let line='', ly=y;
  for(const w of words){
    const t=line ? line+' '+w : w;
    if(ctx.measureText(t).width>maxW && line){
      ctx.fillText(line,x,ly); ly+=lineH; line=w;
    } else line=t;
  }
  if(line) ctx.fillText(line,x,ly);
}

/* --- Beleuchtung ---
   Bei Dunkelheit wird zuerst eine finstere Schicht über die Welt gelegt,
   dann stanzen alle Lichtquellen Löcher hinein und legen ihre Farbe obendrauf.
   Bei Helligkeit über null blendet stattdessen die Sonne. */
const lightBuf = document.createElement('canvas');
lightBuf.width = GAME_W; lightBuf.height = GAME_H;
const lctx = lightBuf.getContext('2d');

// Flackern/Pulsieren je nach Lichtart
function lightPulse(l){
  const t = state.time;
  switch(l.flicker){
    case 'fire':    return 0.82 + Math.sin(t*9 + l.seed)*0.09 + Math.sin(t*23 + l.seed*2)*0.05;
    case 'twinkle': return 0.72 + Math.sin(t*2.6 + l.seed)*0.28;
    case 'hum':     return 0.94 + Math.sin(t*1.7 + l.seed)*0.06;
    case 'buzz':    return (Math.sin(t*31 + l.seed) > -0.93) ? 1 : 0.35;   // Neonzucken
    case 'sweep':   return 0.55 + Math.sin(t*0.8 + l.seed)*0.45;
    case 'lamp':    return 0.97 + Math.sin(t*11 + l.seed)*0.03;   // ganz leichtes Wackeln
    default:        return 1;
  }
}

// Alle Lichtquellen der Szene einsammeln (statische + Feuer + Taschenlampe)
function collectLights(){
  const out = [];
  if(state.scene==='camp'){
    for(const l of lights) out.push(l);
    for(const o of objects){
      if(o.type === 'fire')
        out.push({ x:o.x, y:o.base-5, r:o.small?70:104, col:'255,150,60', s:1, flicker:'fire', seed:o.x });
    }
  } else if(state.scene==='stage'){
    for(const l of stageLights) out.push(l);
  } else if(state.scene==='food'){
    for(const l of foodLights) out.push(l);
  } else if(state.scene==='wald'){
    for(const l of waldLights) out.push(l);
  }
  // Taschenlampe: gerichteter Kegel plus schwacher Schein direkt um den Spieler
  if(state.flashlight){
    const winkel = { up:-Math.PI/2, down:Math.PI/2, left:Math.PI, right:0 };
    const a = winkel[player.facing] ?? Math.PI/2;
    out.push({ x:player.x, y:player.y-6, r:132, col:'255,244,214', s:1,
               flicker:'lamp', seed:7, cone:{ ang:a, spread:0.60 } });
    out.push({ x:player.x, y:player.y-6, r:38, col:'255,240,205', s:0.7, flicker:'lamp', seed:7 });
  }
  return out;
}

// Umriss einer Lichtquelle: Kreis oder Kegel
function lightShape(c, l, sx, sy, r){
  c.beginPath();
  if(l.cone){
    c.moveTo(sx, sy);
    c.arc(sx, sy, r, l.cone.ang - l.cone.spread, l.cone.ang + l.cone.spread);
    c.closePath();
  } else {
    c.arc(sx, sy, r, 0, Math.PI*2);
  }
  c.fill();
}

function drawLighting(){
  const e = state.expo;
  // --- Zu hell: Sonne blendet ---
  if(e > 0.004){
    ctx.fillStyle = 'rgba(255,247,225,'+Math.min(1,e).toFixed(3)+')';
    ctx.fillRect(0,0,GAME_W,GAME_H);
    return;
  }
  // --- Zu dunkel: Nachtschicht mit Lichtern ---
  const dark = Math.min(1, -e);
  if(dark < 0.004) return;
  lctx.clearRect(0,0,GAME_W,GAME_H);
  lctx.globalCompositeOperation = 'source-over';
  lctx.fillStyle = 'rgba(14,12,34,'+dark.toFixed(3)+')';
  lctx.fillRect(0,0,GAME_W,GAME_H);
  // Lichter fressen Löcher in die Dunkelheit
  const all = collectLights();
  lctx.globalCompositeOperation = 'destination-out';
  for(const l of all){
    const sx = Math.round(l.x - camX), sy = Math.round(l.y - camY);
    if(sx < -l.r-20 || sx > GAME_W+l.r+20 || sy < -l.r-20 || sy > GAME_H+l.r+20) continue;
    const p = lightPulse(l), r = l.r * (0.94 + p*0.06);
    const a = Math.min(1, l.s * p);
    const g = lctx.createRadialGradient(sx,sy,1, sx,sy,r);
    g.addColorStop(0,   'rgba(0,0,0,'+(0.98*a).toFixed(3)+')');
    g.addColorStop(0.35,'rgba(0,0,0,'+(0.66*a).toFixed(3)+')');
    g.addColorStop(0.7, 'rgba(0,0,0,'+(0.24*a).toFixed(3)+')');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    lctx.fillStyle = g;
    lightShape(lctx, l, sx, sy, r);
  }
  ctx.drawImage(lightBuf,0,0);
  // Farbiger Schein der Lichter obendrauf: das macht die Gemütlichkeit
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const l of all){
    const sx = Math.round(l.x - camX), sy = Math.round(l.y - camY);
    if(sx < -l.r-20 || sx > GAME_W+l.r+20 || sy < -l.r-20 || sy > GAME_H+l.r+20) continue;
    const p = lightPulse(l);
    const r = l.r * 0.82;
    const a = 0.30 * l.s * p * dark;
    const g = ctx.createRadialGradient(sx,sy,1, sx,sy,r);
    g.addColorStop(0,   'rgba('+l.col+','+a.toFixed(3)+')');
    g.addColorStop(0.5, 'rgba('+l.col+','+(a*0.42).toFixed(3)+')');
    g.addColorStop(1,   'rgba('+l.col+',0)');
    ctx.fillStyle = g;
    lightShape(ctx, l, sx, sy, r);
  }
  ctx.restore();
}

/* --- Uhrzeit oben mittig, mit Sonne/Mond je nach Tageszeit --- */
function drawClock(){
  const txt = clockText();
  ctx.font = 'bold 9px monospace'; ctx.textBaseline = 'top';
  const tw = ctx.measureText(txt).width;
  const w = tw + 20, x = Math.round(GAME_W/2 - w/2), y = 6;
  ctx.fillStyle = 'rgba(30,25,40,0.55)'; ctx.fillRect(x, y, w, 13);
  const d = darkness();
  const ix = x + 5, iy = y + 4;
  if(d > 0.5){                        // Mond
    ctx.fillStyle = '#dfe4f2';
    ctx.fillRect(ix+1,iy,4,1); ctx.fillRect(ix,iy+1,5,3); ctx.fillRect(ix+1,iy+4,4,1);
    ctx.fillStyle = 'rgba(30,25,40,0.55)';
    ctx.fillRect(ix+3,iy,3,2); ctx.fillRect(ix+4,iy+2,2,2);
  } else {                            // Sonne
    ctx.fillStyle = '#f2c14e';
    ctx.fillRect(ix+1,iy+1,4,3); ctx.fillRect(ix+2,iy,2,5);
    ctx.fillRect(ix,iy+2,6,1);
  }
  ctx.fillStyle = '#fdf3dc';
  ctx.fillText(txt, x + 14, y + 2);
}

/* --- Ein HUD-Knopf: Icon, Beschriftung und Tastenkürzel, damit man's immer sieht --- */
function hudButton(bx, by, icon, label, key, active, onClick){
  ctx.fillStyle = active ? '#e8a44a' : '#5a4632';
  ctx.fillRect(bx-3,by-3,24,24);
  ctx.fillStyle = active ? '#fff3d8' : '#fdf3dc';
  ctx.fillRect(bx-1,by-1,20,20);
  icon(bx+1,by+1);
  region(bx-3,by-3,24,24,onClick);
  ctx.font='7px monospace'; ctx.textBaseline='top';
  // Tastenkürzel als kleines helles Kästchen in der Ecke des Knopfes
  const kw = Math.ceil(ctx.measureText(key).width);
  ctx.fillStyle='#3b2f2f';   ctx.fillRect(bx+18-kw-2, by-3, kw+5, 10);
  ctx.fillStyle='#e8c46a';   ctx.fillRect(bx+18-kw-1, by-2, kw+3, 8);
  ctx.fillStyle='#3b2f2f';   ctx.fillText(key, bx+18-kw, by-1);
  // Beschriftung mittig unter dem Knopf
  const lw = Math.ceil(ctx.measureText(label).width);
  const lx = Math.round(bx + 9 - lw/2);
  ctx.fillStyle='rgba(30,25,40,0.62)';
  ctx.fillRect(lx-2, by+22, lw+4, 9);
  ctx.fillStyle='#fdf3dc'; ctx.fillText(label, lx, by+23);
}

function drawHUD(){
  if(state.cutscene) return;
  drawClock();
  hudBar(8,10,64,6,state.energy/100,'#e8944a','ENERGIE');
  hudBar(8,24,64,6,state.social/100,'#5f9bd9','SOZIAL');
  // Rucksack oben rechts
  hudButton(GAME_W-26, 6, ICONS.bag, 'Menü', 'I', false, ()=>{
    if(!state.dialog && !state.cutscene) state.menu = state.menu ? null : {tab:'bag', sel:-1};
  });
  // Sonnenbrille direkt darunter
  hudButton(GAME_W-26, 44, ICONS.glasses, 'Brille', 'B', state.wearingGlasses, ()=>{
    if(!state.dialog && !state.cutscene) toggleGlasses();
  });
  // Taschenlampe, sobald du eine hast
  if(getItem('lamp')){
    hudButton(GAME_W-26, 82, ICONS.lamp, 'Lampe', 'F', state.flashlight, ()=>{
      if(!state.dialog && !state.cutscene) toggleLamp();
    });
  }
  // Fahrrad, sobald du eins hast
  if(state.flags.bikeTaken){
    hudButton(GAME_W-26, 120, ICONS.bike, 'Rad', 'R', state.onBike, ()=>{
      if(!state.dialog && !state.cutscene) toggleBike();
    });
  }
}
function hudBar(x,y,w,h,p,col,label){
  ctx.fillStyle='rgba(30,25,40,0.55)'; ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='#3b2f2f'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=col; ctx.fillRect(x,y,Math.round(w*clamp(p,0,1)),h);
  ctx.font='7px monospace'; ctx.textBaseline='top';
  const lw=ctx.measureText(label).width;
  ctx.fillStyle='rgba(30,25,40,0.55)'; ctx.fillRect(x+w+4,y-2,lw+4,10);
  ctx.fillStyle='#fdf3dc'; ctx.fillText(label,x+w+6,y-1);
}

function drawDialog(){
  const d=state.dialog, node=d.node;
  if(d.inputActive){
    ctx.fillStyle='rgba(30,25,40,0.55)'; ctx.fillRect(0,0,GAME_W,GAME_H);
    panel(110,110,260,80);
    ctx.font='bold 10px monospace'; ctx.fillStyle='#3b2f2f'; ctx.textBaseline='top';
    const q=nodeText(node);
    ctx.fillText(q, 240-ctx.measureText(q).width/2, 122);
    ctx.font='8px monospace'; ctx.fillStyle='#7a6a50';
    const hint='(Enter bestätigt)';
    ctx.fillText(hint, 240-ctx.measureText(hint).width/2, 174);
    return;
  }
  const full=nodeText(node);
  // Die schmale Systembox kennt keine Auswahl – dafür das große Feld verwenden
  if(node.who==='sys' && !nodeChoices(node)){
    ctx.font='bold 10px monospace';
    const tw=Math.min(360, ctx.measureText(full).width);
    const bw=Math.max(200, tw+40), bh=60;
    const bx=(GAME_W-bw)/2, by=GAME_H-92;
    panel(bx,by,bw,bh);
    drawStar(bx+8,by+8); drawStar(bx+bw-14,by+8);
    ctx.fillStyle='#3b2f2f'; ctx.textBaseline='top';
    drawWrapped(full.slice(0,Math.floor(d.chars)), bx+18, by+14, bw-36, 12);
    { const nm = speakerName(node); if(nm) nameTag(nm,bx+6,by-9); }
    if(d.chars>=full.length) blinkArrow(bx+bw-14,by+bh-9);
    d.choiceCount=0;
    return;
  }
  const bx=8, by=GAME_H-88, bw=GAME_W-16, bh=80;
  panel(bx,by,bw,bh);
  let tx=bx+12;
  const p=portraitFor(node.who);
  if(p){
    ctx.fillStyle='#5a4632'; ctx.fillRect(bx+8,by+8,64,64);
    ctx.fillStyle='#efe3c2'; ctx.fillRect(bx+10,by+10,60,60);
    ctx.save(); ctx.translate(bx+10,by+10); ctx.scale(3,3);
    drawGrid(p.grid,p.pal,0,0,false);
    ctx.restore();
    tx=bx+82;
  }
  nameTag(speakerName(node), bx+6, by-9);
  // Während des Bad-Trip-Gesprächs: Kobis Angst- bzw. Tomás' Panik-Level anzeigen
  if(node.bt)  hudBar(8,42,64,6, clamp((state.kobiFear||0)/5,0,1),   '#c9402f','ANGST');
  if(node.bt2) hudBar(8,42,64,6, clamp((state.tomasPanic||0)/5,0,1), '#9b4fc9','PANIK');
  ctx.font='10px monospace'; ctx.fillStyle='#3b2f2f'; ctx.textBaseline='top';
  drawWrapped(full.slice(0,Math.floor(d.chars)), tx, by+14, bx+bw-12-tx, 13);
  const ch=nodeChoices(node);
  if(d.chars>=full.length && ch && ch.length){
    d.choiceCount=ch.length;
    ctx.font='9px monospace';
    let mw=0; for(const c of ch) mw=Math.max(mw,ctx.measureText(c.t).width);
    const cw=mw+28, chH=ch.length*14+10;
    const cx=GAME_W-10-cw, cy=by-chH-6;
    panel(cx,cy,cw,chH);
    for(let i=0;i<ch.length;i++){
      const ly=cy+6+i*14;
      if(i===d.choiceIdx){ ctx.fillStyle='#c9602f'; ctx.fillText('>',cx+7,ly); }
      ctx.fillStyle = i===d.choiceIdx ? '#3b2f2f' : '#8a7a5e';
      ctx.fillText(ch[i].t, cx+17, ly);
      region(cx,ly-2,cw,14, ((idx)=>()=>{ d.choiceIdx=idx; advanceDialog(); })(i));
    }
  } else {
    d.choiceCount=0;
    if(d.chars>=full.length) blinkArrow(bx+bw-14,by+bh-9);
  }
}

function drawMenu(){
  ctx.fillStyle='rgba(25,20,35,0.72)'; ctx.fillRect(0,0,GAME_W,GAME_H);
  const px=16,py=16,pw=448,ph=288;
  panel(px,py,pw,ph);
  const tabs=[['bag','Tasche'],['status','Status'],['journal','Journal']];
  ctx.textBaseline='top';
  for(let i=0;i<3;i++){
    const tx=px+12+i*96, ty=py+8, tw=88, th=18;
    const active = state.menu.tab===tabs[i][0];
    ctx.fillStyle = active ? '#e8d9b5' : '#cbb98f';
    ctx.fillRect(tx,ty,tw,th);
    ctx.fillStyle='#5a4632'; ctx.fillRect(tx,ty+th-2,tw,2);
    ctx.font='bold 9px monospace'; ctx.fillStyle='#3b2f2f';
    ctx.fillText(tabs[i][1], tx+(tw-ctx.measureText(tabs[i][1]).width)/2, ty+5);
    region(tx,ty,tw,th, ((tb)=>()=>{ state.menu.tab=tb; state.menu.sel=-1; })(tabs[i][0]));
  }
  const cx=px+pw-28, cy=py+8;
  ctx.fillStyle='#c9602f'; ctx.fillRect(cx,cy,18,18);
  ctx.font='bold 9px monospace'; ctx.fillStyle='#fdf3dc'; ctx.fillText('X',cx+6,cy+5);
  region(cx,cy,18,18,()=>{ state.menu=null; });
  if(state.menu.tab==='bag') drawBag(px,py,pw,ph);
  else if(state.menu.tab==='status') drawStatus(px,py,pw,ph);
  else drawJournal(px,py,pw,ph);
}

function drawBag(px,py,pw,ph){
  const startX=px+20, startY=py+44, slot=44, gap=8;
  for(let i=0;i<12;i++){
    const col=i%6, row=Math.floor(i/6);
    const sx=startX+col*(slot+gap), sy=startY+row*(slot+gap);
    const selected = state.menu.sel===i;
    ctx.fillStyle = selected ? '#f2e2ae' : '#efe3c2';
    ctx.fillRect(sx,sy,slot,slot);
    ctx.fillStyle = selected ? '#c9602f' : '#c8b189';
    ctx.fillRect(sx,sy,slot,1); ctx.fillRect(sx,sy+slot-1,slot,1);
    ctx.fillRect(sx,sy,1,slot); ctx.fillRect(sx+slot-1,sy,1,slot);
    const it=state.inv[i];
    if(it){
      ctx.save(); ctx.translate(sx+6,sy+4); ctx.scale(2,2); ICONS[it.id](0,0); ctx.restore();
      ctx.font='bold 8px monospace'; ctx.fillStyle='#3b2f2f';
      ctx.fillText('x'+it.n, sx+slot-22, sy+slot-11);
      if(it.id==='glasses' && state.wearingGlasses){ ctx.fillStyle='#5f9b4e'; ctx.fillRect(sx+3,sy+3,4,4); }
      region(sx,sy,slot,slot, ((idx)=>()=>{ state.menu.sel=idx; })(i));
    }
  }
  // Taschenascher: fester Spezial-Slot
  const ax=px+344, ay=startY;
  ctx.fillStyle='#efe3c2'; ctx.fillRect(ax,ay,84,56);
  ctx.fillStyle='#c8b189';
  ctx.fillRect(ax,ay,84,1); ctx.fillRect(ax,ay+55,84,1);
  ctx.fillRect(ax,ay,1,56); ctx.fillRect(ax+83,ay,1,56);
  ctx.save(); ctx.translate(ax+4,ay+10); ctx.scale(2,2); ICONS.ashtray(0,0); ctx.restore();
  ctx.font='bold 8px monospace'; ctx.fillStyle='#3b2f2f';
  ctx.fillText('Taschen-', ax+40, ay+8);
  ctx.fillText('ascher',   ax+40, ay+18);
  ctx.fillText(state.ashtray+'/'+CFG.ASH_CAPACITY, ax+40, ay+32);
  ctx.fillStyle='#3b2f2f'; ctx.fillRect(ax+6,ay+48,72,3);
  ctx.fillStyle='#8d8d95'; ctx.fillRect(ax+6,ay+48,Math.round(72*state.ashtray/CFG.ASH_CAPACITY),3);
  // Info-Bereich
  const ix=px+20, iy=py+160, iw=pw-40, ih=ph-176;
  ctx.fillStyle='#efe3c2'; ctx.fillRect(ix,iy,iw,ih);
  ctx.fillStyle='#c8b189';
  ctx.fillRect(ix,iy,iw,1); ctx.fillRect(ix,iy+ih-1,iw,1);
  ctx.fillRect(ix,iy,1,ih); ctx.fillRect(ix+iw-1,iy,1,ih);
  const sel = state.menu.sel>=0 ? state.inv[state.menu.sel] : null;
  if(sel){
    const def=ITEMS[sel.id];
    ctx.font='bold 10px monospace'; ctx.fillStyle='#3b2f2f';
    ctx.fillText(def.name + (sel.id==='glasses'&&state.wearingGlasses?' (aufgesetzt)':''), ix+10, iy+8);
    ctx.font='9px monospace'; ctx.fillStyle='#5c5147';
    drawWrapped(def.desc, ix+10, iy+24, iw-20, 11);
    let bx2=ix+10;
    for(const act of def.actions){
      const label = act==='eat' ? 'Essen' : act==='wear' ? 'Aufsetzen' : 'Benutzen';
      button(bx2, iy+ih-30, 88, 20, label, ((a,s)=>()=>doItemAction(s,a))(act,sel));
      bx2+=100;
    }
  } else {
    ctx.font='9px monospace'; ctx.fillStyle='#7a6a50';
    ctx.fillText('Wähle ein Item aus, um es anzusehen oder zu benutzen.', ix+10, iy+10);
  }
}

function drawStatus(px,py,pw,ph){
  ctx.textBaseline='top';
  ctx.font='bold 10px monospace'; ctx.fillStyle='#3b2f2f';
  ctx.fillText('ENERGIE', px+24, py+48);
  bigBar(px+110, py+48, 220, 10, state.energy/100, '#e8944a');
  ctx.fillStyle='#3b2f2f'; ctx.fillText(Math.round(state.energy)+'/100', px+340, py+48);
  ctx.fillText('SOZIAL', px+24, py+72);
  bigBar(px+110, py+72, 220, 10, state.social/100, '#5f9bd9');
  ctx.fillStyle='#3b2f2f'; ctx.fillText(Math.round(state.social)+'/100', px+340, py+72);
  ctx.fillText('SYMPATHIE', px+24, py+106);
  let y=py+124;
  for(const s of state.sympathy){
    ctx.font='9px monospace'; ctx.fillStyle='#3b2f2f';
    ctx.fillText(s.name, px+24, y);
    const bx=px+110, bw2=220, mid=bx+bw2/2;
    ctx.fillStyle='#d8c9a2'; ctx.fillRect(bx,y+1,bw2,7);
    ctx.fillStyle='#8a8172'; ctx.fillRect(mid,y,1,9);
    const frac=clamp(s.val/10,-1,1);
    if(frac>=0){ ctx.fillStyle='#5f9b4e'; ctx.fillRect(mid,y+1,Math.round(bw2/2*frac),7); }
    else { const w2=Math.round(bw2/2*-frac); ctx.fillStyle='#c9402f'; ctx.fillRect(mid-w2,y+1,w2,7); }
    ctx.fillStyle='#3b2f2f'; ctx.fillText((s.val>0?'+':'')+deNum(s.val), px+340, y);
    y+=22;
  }
  ctx.font='8px monospace'; ctx.fillStyle='#7a6a50';
  ctx.fillText('??? = An diese Person erinnerst du dich (noch) nicht.', px+24, y+8);
}
function bigBar(x,y,w,h,p,col){
  ctx.fillStyle='#3b2f2f'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle='#d8c9a2'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=col; ctx.fillRect(x,y,Math.round(w*clamp(p,0,1)),h);
}

function drawJournal(px,py,pw,ph){
  ctx.textBaseline='top';
  ctx.font='bold 10px monospace'; ctx.fillStyle='#3b2f2f';
  ctx.fillText('MISSIONEN', px+24, py+48);
  ctx.font='9px monospace';
  let y=py+66;
  if(state.journal.missions.length===0){
    ctx.fillStyle='#7a6a50'; ctx.fillText('Noch keine Missionen.', px+32, y); y+=14;
  }
  for(const m of state.journal.missions){
    ctx.fillStyle = m.done ? '#5f9b4e' : '#3b2f2f';
    ctx.fillText((m.done?'[x] ':'[ ] ')+'Finde '+(state.friendName||'???')+(m.done?'  – abgeschlossen!':''), px+32, y);
    y+=14;
  }
  y+=16;
  ctx.font='bold 10px monospace'; ctx.fillStyle='#3b2f2f';
  ctx.fillText('ERINNERUNGEN', px+24, y); y+=18;
  ctx.font='9px monospace';
  if(state.journal.memories.length===0){
    ctx.fillStyle='#7a6a50'; ctx.fillText('Dein Kopf ist noch ziemlich leer...', px+32, y);
  }
  for(const mem of state.journal.memories){
    ctx.fillStyle='#3b2f2f'; ctx.fillText('* '+mem, px+32, y); y+=14;
  }
}

function drawToasts(){
  ctx.font='8px monospace'; ctx.textBaseline='top';
  let y=42;
  for(const t of toasts.slice(0,3)){
    const a=clamp(t.t,0,1);
    const w=ctx.measureText(t.text).width+12;
    const x=(GAME_W-w)/2;
    ctx.fillStyle='rgba(58,47,47,'+(0.85*a).toFixed(2)+')'; ctx.fillRect(x,y,w,13);
    ctx.fillStyle='rgba(253,243,220,'+a.toFixed(2)+')'; ctx.fillText(t.text,x+6,y+3);
    y+=16;
  }
}
function drawSmokeBubble(){
  if(state.smoke.phase==='none' || state.cutscene || state.menu) return;
  const text = state.smoke.phase==='rolling' ? 'dreht eine Zigarette...' : 'raucht entspannt...';
  ctx.font='8px monospace'; ctx.textBaseline='top';
  const w=ctx.measureText(text).width+8;
  const x=Math.round(player.x-camX-w/2), y=Math.round(player.y-camY)-34;
  ctx.fillStyle='rgba(253,243,220,0.92)'; ctx.fillRect(x,y,w,14);
  ctx.fillStyle='#5a4632';
  ctx.fillRect(x,y,w,1); ctx.fillRect(x,y+13,w,1);
  ctx.fillRect(x,y,1,14); ctx.fillRect(x+w-1,y,1,14);
  ctx.fillStyle='#3b2f2f'; ctx.fillText(text,x+4,y+3);

    ctx.fillStyle='#c9a03f'; ctx.fillRect(x+2,y+11,Math.round((w-4)*p),1);
  }
}

function drawMiniTent(x,base,col){
  for(let i=0;i<16;i++){
    const half=Math.max(1,Math.round(i/16*12));
    ctx.fillStyle=col; ctx.fillRect(x-half,base-16+i,half*2,1);
  }
  ctx.fillStyle='#3b2f2f'; ctx.fillRect(x-2,base-6,4,6);
}
function creationPreview(cx,baseY){
  const pal=playerPal();
  let grid, flip=false;
  if(creation.face==='up') grid=BODY_UP;
  else if(creation.face==='down') grid=BODY_DOWN;
  else { grid=BODY_SIDE; flip=(creation.face==='right'); }
  const fr=Math.floor(creation.t*5)%4;
  const legs = fr===1?LEGS_A : fr===3?LEGS_B : LEGS_IDLE;
  // Die letzten 3 Zeilen sind die Beine (Lauf-Animation)
  const g=grid.slice(0,13).concat(legs);
  ctx.save(); ctx.translate(cx-36, baseY-96); ctx.scale(6,6);
  drawGrid(g,pal,0,0,flip);
  ctx.restore();
}

/* --- Canvas an die Fenstergröße anpassen ---
   Das Seitenverhältnis (3:2) bleibt immer erhalten; der Rest des Bildschirms
   ist dunkler Rand (Letterboxing über den Seitenhintergrund).
   Skalierung: ganzzahlig, wenn dabei nicht zu viel Fläche verloren geht
   (gestochen scharfe Pixel am Laptop) – sonst stufenlos, damit das Spiel
   auf Handys den Bildschirm bestmöglich füllt. */
function viewportSize(){
  const vv = window.visualViewport;
  return { w: vv ? vv.width : window.innerWidth,
           h: vv ? vv.height : window.innerHeight };
}
function fitCanvas(){
  const v = viewportSize();
  const raw = Math.min(v.w/GAME_W, v.h/GAME_H);
  const i = Math.floor(raw);
  // Ganzzahlig nur, wenn dadurch höchstens ~15% Fläche verschenkt werden
  SCALE = (raw>=1 && i/raw>=0.85) ? i : Math.max(0.2, raw);
  canvas.style.width  = Math.round(GAME_W*SCALE)+'px';
  canvas.style.height = Math.round(GAME_H*SCALE)+'px';
  if(nameInput.style.display==='block')   placeNameInput();
  if(friendInput.style.display==='block') placeFriendInput();
}

/* ============ 12. INTRO & HAUPTSCHLEIFE ============ */
let introPhase='wait', introT=0;
function startGame(){
  state.mode='game';
  state.cutscene=true;
  state.whiteAlpha=1; state.whiteTarget=0.88;   // "Es ist sooo hell..."
  state.clock.min = 14*60; state.clock.day = 1; // Ankunft am Nachmittag
  state.scene = 'camp'; state.flashlight = false; state.onBike = false;
  state.fade = 0; state.fadeDir = 0; state.outdoorPos = null;
  state.expo = exposure();
  player.pal=playerPal();
  player.facing='down';
  seedWanderers();
  introPhase='wait'; introT=0;
}
function introUpdate(dt){
  const harvey=npcs.find(n=>n.id==='harvey');
  if(introPhase==='wait'){
    introT+=dt;
    if(introT>0.9){ introPhase='walk'; harvey.moving=true; }
  } else if(introPhase==='walk'){
    const tx=player.x-18, ty=player.y+1;
    const dx=tx-harvey.x, dy=ty-harvey.y, dist=Math.hypot(dx,dy);
    if(dist<3){
      harvey.moving=false; harvey.frame=0;
      harvey.facing='right'; player.facing='left';
      introPhase='talkWait'; introT=0;
    } else {
      const spd=55*dt;
      harvey.x+=dx/dist*spd; harvey.y+=dy/dist*spd;
      harvey.facing = Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
      harvey.animT+=dt; harvey.frame=Math.floor(harvey.animT*7)%4;
    }
  } else if(introPhase==='talkWait'){
    introT+=dt;
    if(introT>0.5){ introPhase='talk'; startDialog('intro1',{breakable:false}); }
  } else if(introPhase==='talk'){
    if(!state.dialog && state.flags.introDone){
      state.cutscene=false;
      state.helpTimer=20;
    }
  }
}

function update(dt){
  state.time+=dt;
  updateToasts(dt);
  state.whiteAlpha += (state.whiteTarget-state.whiteAlpha)*Math.min(1,dt*2.2);
  if(Math.abs(state.whiteAlpha-state.whiteTarget)<0.005) state.whiteAlpha=state.whiteTarget;
  // Augen gewöhnen sich langsam: Helligkeit gleitet zum Zielwert
  const eT = exposure();
  state.expo += (eT-state.expo)*Math.min(1,dt*2.6);
  if(Math.abs(eT-state.expo)<0.002) state.expo = eT;
  fadeUpdate(dt);
  if(state.mode==='title'){ interactQueued=false; escQueued=false; return; }
  if(state.mode==='create'){ creation.t+=dt; interactQueued=false; escQueued=false; return; }
  if(state.helpTimer>0) state.helpTimer-=dt;
  if(escQueued){
    escQueued=false;
    if(!state.dialog && !state.cutscene){
      state.menu = state.menu ? null : {tab:'bag', sel:-1};
      state.idleSince=0;
    }
  }
  if(state.menu){ interactQueued=false; return; }
  if(state.dialog){
    const d=state.dialog;
    if(!d.inputActive) d.chars += CFG.TYPE_SPEED*dt;
    if(interactQueued){ interactQueued=false; advanceDialog(); }
    particlesUpdate(dt); fireEmit(dt);
    return;
  }
  if(state.cutscene){
    introUpdate(dt); particlesUpdate(dt); fireEmit(dt);
    interactQueued=false;
    return;
  }
  // Während der Schwarzblende steht alles still, auch die Uhr
  if(state.fadeDir!==0){ player.moving=false; interactQueued=false; return; }
  clockUpdate(dt);
  // Im Zelt läuft nur das Nötige: laufen, Gegenstände, Statuswerte
  if(state.scene==='tent'){
    playerUpdate(dt);
    statusUpdate(dt);
    // Wer durch die Zeltöffnung nach unten läuft, steht wieder draußen
    if(player.y > TENT.H - 4 && player.x > 70 && player.x < 120){
      leaveTent();
      interactQueued=false;
      return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  // Auf der Waldbühne: laufen und Gegenstände
  if(state.scene==='wald'){
    playerUpdate(dt);
    statusUpdate(dt);
    // Unten in der Mitte hinaus geht es zurück zum Foodcourt
    if(player.y > WALD.H*TILE - 22 && player.x > 10*TILE && player.x < 18*TILE){
      leaveWald();
      interactQueued=false;
      return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  // Im Foodcourt: laufen, Publikum, Kaffee
  if(state.scene==='food'){
    if(!spielerStehtAn()) playerUpdate(dt);   // in der Schlange steht man still
    statusUpdate(dt);
    particlesUpdate(dt);
    foodCrowdUpdate(dt);
    foodRunnersUpdate(dt);
    coffeeTeamUpdate(dt);
    coffeeUpdate(dt);
    // In der Schlange erreicht man den Van nicht mehr – E öffnet trotzdem
    if(spielerStehtAn()){
      currentCandidate = null;
      if(interactQueued){ interactQueued=false; vanTalk(); }
      return;
    }
    // Links unten hinaus geht es zurück zum Campingplatz
    if(!spielerStehtAn() && player.x < 3*TILE-6 && player.y > 22*TILE && player.y < 28*TILE){
      leaveFood();
      interactQueued=false;
      return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  // Auf dem Festivalgelände: laufen, Crew, Gegenstände
  if(state.scene==='stage'){
    playerUpdate(dt);
    statusUpdate(dt);
    particlesUpdate(dt);
    // Wer unten durch die Lücke läuft, geht zurück zum Campingplatz
    if(player.y > STAGE.H*TILE - 22 && player.x > 17*TILE && player.x < 23*TILE){
      leaveStage();
      interactQueued=false;
      return;
    }
    findCandidate();
    if(interactQueued){ interactQueued=false; tryInteract(); }
    return;
  }
  playerUpdate(dt);
  // High-Zustand: Zeit läuft nur beim aktiven Spielen ab
  if(state.high.t>0){
    state.high.t -= dt;
    // Glitzer-Partikel schweben um die Figur
    state.high.spark = (state.high.spark||0) - dt;
    if(state.high.spark<=0 && highFactor()>0.3){
      state.high.spark = 0.22;
      particles.push({ x:player.x+(Math.random()*60-30), y:player.y-(Math.random()*22),
        vx:(Math.random()-0.5)*4, vy:-5-Math.random()*6, life:2.2,
        col:pick(['rgba(255,214,140,0.7)','rgba(255,170,190,0.6)','rgba(170,220,255,0.6)','rgba(200,255,180,0.6)']),
        size:1+Math.floor(Math.random()*2) });
    }
    if(state.high.t<=0){
      state.high.t=0;
      if(state.trip.t<=0) trail.length=0;
      toast('Langsam wird dein Kopf wieder klar.');
      // Phase 2: Kobi geht es inzwischen gar nicht gut
      if(state.flags.kobiJointDone && !state.flags.kobiCalmed){
        state.flags.kobiBadTrip = true;
        toast('Irgendwas sagt dir: Schau mal nach Kobi.');
      }
    }
  }
  // Acid-Trip: Timer und Glitch-Blitze
  if(state.trip.t>0){
    state.trip.t -= dt;
    state.trip.gw -= dt;
    if(state.trip.gw<=0 && tripFactor()>0.6){
      state.trip.gw = 4+Math.random()*6;         // nächster Glitch in 4–10 s
      state.trip.glitch = 0.12;                  // Blitzdauer
      state.trip.glitchHue = Math.random()*360;  // Blitzfarbe
    }
    if(state.trip.glitch>0) state.trip.glitch -= dt;
    if(state.trip.t<=0){
      state.trip.t=0;
      if(state.high.t<=0) trail.length=0;
      toast('Die Farben beruhigen sich langsam wieder.');
      // Phase 2: Tomás hat es deutlich härter erwischt
      if(state.flags.tomasTripDone && !state.flags.tomasGrounded){
        state.flags.tomasBadTrip = true;
        toast('Tomás sah eben gar nicht gut aus...');
      }
    }
  }
  tripAnimalsUpdate(dt);
  // Nachzieheffekt: Positionen der letzten Momente merken
  if((highFactor()>0 || tripFactor()>0) && player.moving){
    trail.push({ x:player.x, y:player.y, facing:player.facing, frame:player.frame });
    const cap = tripFactor()>0 ? 20 : 10;        // Acid: deutlich längerer Trail
    while(trail.length>cap) trail.shift();
  } else if(state.high.t<=0 && state.trip.t<=0 && trail.length) trail.length=0;
  npcUpdate(dt);
  wanderersUpdate(dt);
  chatsUpdate(dt);
  smokeUpdate(dt);
  statusUpdate(dt);
  particlesUpdate(dt);
  fireEmit(dt);
  findCandidate();
  if(interactQueued){ interactQueued=false; tryInteract(); }
}
/* --- Das Zeltinnere zeichnen: der Raum ist kleiner als der Bildschirm
       und wird deshalb mittig eingepasst statt von der Kamera verfolgt. --- */
function drawIndoor(){
  // Kamera so setzen, dass der Raum in der Mitte sitzt
  camX = -Math.round((GAME_W - TENT.W)/2);
  camY = -Math.round((GAME_H - TENT.H)/2);
  // Dunkler Rand außerhalb der Plane
  ctx.fillStyle='#15111f'; ctx.fillRect(0,0,GAME_W,GAME_H);
  ctx.save();
  ctx.translate(-camX,-camY);
  drawTentInterior();
  // Gegenstände und Spieler nach Tiefe sortiert
  const list=[];
  for(const o of tentObjects){ if(o.type!=='exit') list.push({y:o.base, f:()=>drawTentObject(o)}); }
  list.push({y:player.y, f:()=>drawEntity(player)});
  list.sort((a,b)=>a.y-b.y);
  for(const it of list) it.f();
  // E-Hinweis über dem Gegenstand, vor dem du stehst
  if(currentCandidate && !state.dialog && !state.menu){
    const c=currentCandidate;
    ctx.font='bold 9px monospace'; ctx.textBaseline='top';
    const w=ctx.measureText('E').width+8;
    ctx.fillStyle='rgba(30,25,40,0.72)'; ctx.fillRect(c.x-w/2, c.y, w, 12);
    ctx.fillStyle='#e8c46a'; ctx.fillText('E', c.x-w/2+4, c.y+2);
  }
  ctx.restore();
  drawLighting();
  drawHUD();
  drawTouchPad();
  drawTouchButton();
  if(state.dialog) drawDialog();
  if(state.menu) drawMenu();
  drawToasts();
  drawFade();
}

/* --- Schwarzblende beim Wechsel zwischen drinnen und draußen --- */
function drawFade(){
  if(state.fade <= 0.002) return;
  ctx.fillStyle = 'rgba(12,10,18,'+Math.min(1,state.fade).toFixed(3)+')';
  ctx.fillRect(0,0,GAME_W,GAME_H);
}

function draw(){
  uiRegions.length=0;
  ctx.fillStyle='#241f2e'; ctx.fillRect(0,0,GAME_W,GAME_H);
  if(state.mode==='title'){ drawTitle(); drawToasts(); return; }
  if(state.mode==='create'){ drawCreation(); drawToasts(); return; }
  if(state.scene==='tent'){ drawIndoor(); return; }
  if(state.scene==='stage'){ drawStage(); return; }
  if(state.scene==='food'){ drawFood(); return; }
  if(state.scene==='wald'){ drawWald(); return; }
  camX=clamp(Math.round(player.x-GAME_W/2), 0, MAPW*TILE-GAME_W);
  camY=clamp(Math.round(player.y-GAME_H/2-10), 0, MAPH*TILE-GAME_H);
  const hf = highFactor();
  const tf = tripFactor();
  const camF = Math.max(hf, tf);
  ctx.save();
  if(camF>0){
    // Sanftes 'Atmen': pulsiert zwischen 1,00 und 1,02 (nie unter 1,
    // damit keine Kartenränder ins Bild rutschen)
    const puls = 1 + (Math.sin(state.time*1.2)*0.5+0.5)*0.02*camF;
    // Neigung und Schweben – im Acid-Trip deutlich stärker als beim High
    const rot = Math.sin(state.time*0.6)*(0.01*hf + 0.018*tf);
    ctx.translate(GAME_W/2, GAME_H/2); ctx.scale(puls,puls); ctx.rotate(rot); ctx.translate(-GAME_W/2,-GAME_H/2);
    ctx.translate(Math.sin(state.time*0.8)*(3*hf+5*tf), Math.cos(state.time*0.55)*(2*hf+4*tf));
  }
  ctx.translate(-camX,-camY);
  ctx.drawImage(ground,0,0);
  for(const s of stubsOnGround) drawStub(s);
  // Nachzieheffekt: verblasste 'Geister' der letzten Positionen
  const trailF = Math.max(hf, tf);
  if(trailF>0){
    const stp = tf>0 ? 1 : 2;                     // Acid: jeder Geist, Weed: jeder zweite
    for(let i=0;i<trail.length;i+=stp){
      const g=trail[i];
      ctx.globalAlpha = (0.05 + (tf>0?0.16:0.10)*(i/trail.length)) * trailF;
      drawEntity({ x:g.x, y:g.y, facing:g.facing, moving:true, frame:g.frame,
                   pal:player.pal, gridSet:player.gridSet });
    }
    ctx.globalAlpha=1;
  }
  const list=[];
  // Hüllfunktion: lässt ein Objekt im Acid-Trip leicht 'atmen'
  // (jedes mit eigener Phase über seine x-Position, Fußpunkt bleibt stehen)
  const wob=(x,base,f)=>()=>{
    if(tf<=0){ f(); return; }
    const p=1+Math.sin(state.time*1.6 + x*0.13)*0.05*tf;
    ctx.save(); ctx.translate(x,base); ctx.scale(p,p); ctx.translate(-x,-base); f(); ctx.restore();
  };
  for(const o of objects){
    if(o.type==='tree'||o.type==='bush') list.push({y:o.base, f:wob(o.x,o.base,()=>drawObject(o))});
    else list.push({y:o.base, f:()=>drawObject(o)});
  }
  list.push({y:player.y, f:drawPlayerEnt});
  for(const n of npcs){
    let base = ()=>drawEntity(n);
    if(n.id==='kobi'  && state.flags.kobiBadTrip  && !state.flags.kobiCalmed)   base = ()=>drawKobiCrouch(n);
    if(n.id==='tomas' && state.flags.tomasBadTrip && !state.flags.tomasGrounded) base = ()=>drawTomasPanic(n);
    list.push({y:n.y, f:wob(n.x,n.y,base)});
  }
  for(const a of tripAnimals) list.push({y:a.y, f:()=>drawAnimal(a)});
  for(const w of wanderers) list.push({y:w.y, f:wob(w.x,w.y,()=>drawEntity(w))});
  list.sort((a,b)=>a.y-b.y);
  for(const it of list) it.f();
  // Sprechblasen über allen Figuren, damit sie niemand verdeckt
  for(const n of npcs) drawChatBubble(n);
  for(const w of wanderers) drawChatBubble(w);
  for(const p of particles){
    ctx.fillStyle=p.col;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
  }
  drawBunting(96,56,176,42);      // Wimpel im Spieler-Camp
  drawBunting(560,378,640,392);   // Wimpel im Camp im Südosten
  ctx.restore();
  // Beleuchtung liegt auf der Welt – der Acid-Trip verzerrt sie danach mit
  drawLighting();
  // Acid: die ganze Welt wabert in Wellen und verschiebt langsam ihre Farben.
  // Dazu wird das Bild in 4px-Streifen kopiert und sinusversetzt zurückgezeichnet.
  if(tf>0){
    sctx.clearRect(0,0,GAME_W,GAME_H);
    sctx.drawImage(canvas,0,0);
    ctx.fillStyle='#241f2e'; ctx.fillRect(0,0,GAME_W,GAME_H);
    if(typeof ctx.filter==='string')
      ctx.filter='hue-rotate('+(Math.sin(state.time*0.35)*CFG.TRIP_HUE_DEG*tf).toFixed(1)+'deg)';
    for(let y=0; y<GAME_H; y+=4){
      const off=Math.sin(y*0.045+state.time*2.2)*CFG.TRIP_WAVE_AMP*tf;
      ctx.drawImage(scratch, 0,y,GAME_W,4, off,y,GAME_W,4);
    }
    if(typeof ctx.filter==='string') ctx.filter='none';
  }
  // 'E'-Hinweis über interagierbaren Dingen
  if(!state.dialog && !state.menu && !state.cutscene && currentCandidate){
    const bx=Math.round(currentCandidate.x-camX)-5, by=Math.round(currentCandidate.y-camY)-12;
    ctx.fillStyle='#fdf3dc'; ctx.fillRect(bx,by,11,12);
    ctx.fillStyle='#5a4632';
    ctx.fillRect(bx,by,11,1); ctx.fillRect(bx,by+11,11,1);
    ctx.fillRect(bx,by,1,12); ctx.fillRect(bx+10,by,1,12);
    ctx.font='bold 8px monospace'; ctx.fillStyle='#5a4632'; ctx.textBaseline='top';
    ctx.fillText('E',bx+3,by+2);
  }
  drawSmokeBubble();
  // Warmer Farbfilter während des Highs (über der Welt, unter HUD und Dialogen)
  if(hf>0){
    ctx.fillStyle='rgba(255,168,70,'+(CFG.HIGH_TINT_ALPHA*hf).toFixed(3)+')';
    ctx.fillRect(0,0,GAME_W,GAME_H);
    // Farbschimmer am Bildrand, der langsam durchs Farbspektrum wandert
    const hue=(state.time*16)%360;
    const vg=ctx.createRadialGradient(GAME_W/2,GAME_H/2,110,GAME_W/2,GAME_H/2,300);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'hsla('+hue.toFixed(0)+',75%,62%,'+(0.20*hf).toFixed(3)+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,GAME_W,GAME_H);
  }
  // Acid: kräftigere Regenbogen-Vignette (zwei Farbtöne, dreimal schnellerer Lauf)
  if(tf>0){
    const hue2=(state.time*48)%360;
    const vg2=ctx.createRadialGradient(GAME_W/2,GAME_H/2,80,GAME_W/2,GAME_H/2,300);
    vg2.addColorStop(0,'rgba(0,0,0,0)');
    vg2.addColorStop(0.6,'hsla('+((hue2+120)%360).toFixed(0)+',85%,60%,'+(0.10*tf).toFixed(3)+')');
    vg2.addColorStop(1,'hsla('+hue2.toFixed(0)+',85%,60%,'+(0.28*tf).toFixed(3)+')');
    ctx.fillStyle=vg2; ctx.fillRect(0,0,GAME_W,GAME_H);
    // Gelegentlicher Farbblitz mit zwei verrutschten Bildstreifen
    if(state.trip.glitch>0){
      ctx.fillStyle='hsla('+state.trip.glitchHue.toFixed(0)+',90%,65%,'+(0.16*tf).toFixed(3)+')';
      ctx.fillRect(0,0,GAME_W,GAME_H);
      const gy=(state.trip.glitchHue*1.7)%(GAME_H-40);
      ctx.drawImage(canvas, 0,gy,GAME_W,10, 6,gy,GAME_W,10);
      ctx.drawImage(canvas, 0,gy+22,GAME_W,8, -5,gy+22,GAME_W,8);
    }
  }
  // Intro-Überblendung liegt über allem (nur während der Cutscene aktiv)
  if(state.whiteAlpha>0.004){
    ctx.fillStyle='rgba(255,247,225,'+state.whiteAlpha.toFixed(3)+')';
    ctx.fillRect(0,0,GAME_W,GAME_H);
  }
  drawHUD();
  drawTouchPad();
  drawTouchButton();
  if(state.dialog) drawDialog();
  if(state.menu) drawMenu();
  drawToasts();
  drawFade();
  if(state.helpTimer>0 && !state.dialog && !state.menu){
    ctx.font='8px monospace'; ctx.textBaseline='top';
    const msg='WASD · E: reden · I: Menü · B: Brille · F: Lampe · R: Rad';
    const w=ctx.measureText(msg).width;
    ctx.fillStyle='rgba(30,25,40,0.6)'; ctx.fillRect(GAME_W/2-w/2-5,GAME_H-17,w+10,13);
    ctx.fillStyle='#fdf3dc'; ctx.fillText(msg,GAME_W/2-w/2,GAME_H-14);
  }
}

/* --- Eingaben --- */
const keys={};
let interactQueued=false, escQueued=false;
const uiRegions=[];
function region(x,y,w,h,cb){ uiRegions.push({x,y,w,h,cb}); }

addEventListener('keydown', e=>{
  if(document.activeElement===nameInput || document.activeElement===friendInput){
    if(e.key==='Enter'){
      e.preventDefault();
      if(document.activeElement===nameInput) confirmCreation(); else submitFriendName();
    }
    return;
  }
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(state.dialog && state.dialog.choiceCount>0){
    if(k==='arrowup'||k==='w'){
      state.dialog.choiceIdx=(state.dialog.choiceIdx-1+state.dialog.choiceCount)%state.dialog.choiceCount;
      return;
    }
    if(k==='arrowdown'||k==='s'){
      state.dialog.choiceIdx=(state.dialog.choiceIdx+1)%state.dialog.choiceCount;
      return;
    }
  }
  keys[k]=true;
  if(k==='e'||k===' '||k==='enter') interactQueued=true;
  if(k==='i'||k==='escape') escQueued=true;
  if(k==='b' && !state.dialog && !state.cutscene && !state.menu){ toggleGlasses(); state.idleSince=0; }
  if(k==='f' && !state.dialog && !state.cutscene && !state.menu){ toggleLamp(); state.idleSince=0; }
  if(k==='r' && !state.dialog && !state.cutscene && !state.menu){ toggleBike(); state.idleSince=0; }
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

canvas.addEventListener('click', e=>{
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)/SCALE, my=(e.clientY-r.top)/SCALE;
  for(let i=uiRegions.length-1;i>=0;i--){
    const u=uiRegions[i];
    if(mx>=u.x && mx<u.x+u.w && my>=u.y && my<u.y+u.h){ u.cb(); return; }
  }
  if(state.dialog) advanceDialog();
});
addEventListener('resize', fitCanvas);
// Rotation des Handys: sofort anpassen und nochmal kurz danach
// (manche Browser melden direkt nach dem Drehen noch die alte Größe)
addEventListener('orientationchange', ()=>{ fitCanvas(); setTimeout(fitCanvas, 250); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
// Pinch-Zoom unterbinden (iOS Safari ignoriert 'user-scalable=no' teilweise)
document.addEventListener('gesturestart', e=>e.preventDefault());
// Kontextmenü bei langem Fingerdruck auf dem Spielfeld unterbinden
canvas.addEventListener('contextmenu', e=>e.preventDefault());

/* ============ TOUCH-STEUERUNG (virtueller Joystick) ============ */
// Erkennung: Ist das ein Touch-Gerät? Auf dem Laptop mit Maus bleibt alles unsichtbar.
const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);

// Aktueller Zustand: dx/dy ist die Richtung, in die der Finger drückt (-1 bis 1)
const touch = { id:null, dx:0, dy:0 };
// Position & Größe des Joysticks unten links (in Spiel-Pixeln, nicht Bildschirm-Pixeln)
const PAD = { x:56, y:GAME_H-56, r:34, knob:13, dead:8 };
// Interaktions-Button unten rechts (macht dasselbe wie die E-Taste)
const BTN_A = { x:GAME_W-48, y:GAME_H-48, r:22 };

// Rechnet eine Finger-Position vom Bildschirm in Spiel-Koordinaten um
function touchPos(t){
  const r = canvas.getBoundingClientRect();
  return { x:(t.clientX-r.left)/SCALE, y:(t.clientY-r.top)/SCALE };
}
// Berechnet aus der Fingerposition die Laufrichtung, gerastet auf 8 Richtungen
function setStick(px,py){
  const dx=px-PAD.x, dy=py-PAD.y;
  if(Math.hypot(dx,dy) < PAD.dead){ touch.dx=0; touch.dy=0; return; }  // tote Zone in der Mitte
  const snap = Math.round(Math.atan2(dy,dx)/(Math.PI/4)) * (Math.PI/4);
  touch.dx = Math.round(Math.cos(snap)*100)/100;
  touch.dy = Math.round(Math.sin(snap)*100)/100;
}
canvas.addEventListener('touchstart', e=>{
  for(const t of e.changedTouches){
    const p=touchPos(t);
    // Interaktions-Button gedrückt? Wirkt wie ein Druck auf die E-Taste.
    if(state.mode==='game' && !state.menu && Math.hypot(p.x-BTN_A.x, p.y-BTN_A.y) < BTN_A.r+6){
      interactQueued=true;
      e.preventDefault();
      continue;
    }
    // Nur Berührungen in der Nähe des Joysticks steuern ihn (Rest bleibt für Antippen frei)
    if(touch.id===null && Math.hypot(p.x-PAD.x, p.y-PAD.y) < PAD.r*1.8){
      touch.id=t.identifier;
      setStick(p.x,p.y);
      e.preventDefault();   // verhindert Scrollen/Zoomen während des Steuerns
    }
  }
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    if(t.identifier===touch.id){ const p=touchPos(t); setStick(p.x,p.y); e.preventDefault(); }
  }
},{passive:false});
function releaseStick(e){
  for(const t of e.changedTouches){
    if(t.identifier===touch.id){ touch.id=null; touch.dx=0; touch.dy=0; }
  }
}
canvas.addEventListener('touchend', releaseStick);
canvas.addEventListener('touchcancel', releaseStick);

// Zeichnet den Joystick (halbtransparent, Knopf folgt dem Finger)
function drawTouchPad(){
  if(!IS_TOUCH || state.mode!=='game' || state.dialog || state.menu || state.cutscene) return;
  ctx.globalAlpha=0.45;
  pixCircle(PAD.x, PAD.y, PAD.r,   '#3b2f2f');   // dunkler Ring
  pixCircle(PAD.x, PAD.y, PAD.r-3, '#fdf3dc');   // helle Fläche
  ctx.fillStyle='#8a7a5e';                        // vier Richtungs-Markierungen
  ctx.fillRect(PAD.x-1, PAD.y-PAD.r+6, 2, 5);
  ctx.fillRect(PAD.x-1, PAD.y+PAD.r-11, 2, 5);
  ctx.fillRect(PAD.x-PAD.r+6, PAD.y-1, 5, 2);
  ctx.fillRect(PAD.x+PAD.r-11, PAD.y-1, 5, 2);
  const kx=PAD.x+touch.dx*(PAD.r-15), ky=PAD.y+touch.dy*(PAD.r-15);
  pixCircle(kx, ky, PAD.knob,   '#5a4632');       // Knopf
  pixCircle(kx, ky, PAD.knob-3, '#e8944a');
  ctx.globalAlpha=1;
}
// Zeichnet den Interaktions-Button (leuchtet auf, wenn etwas in Reichweite ist)
function drawTouchButton(){
  if(!IS_TOUCH || state.mode!=='game' || state.menu || state.cutscene) return;
  const active = !state.dialog && !!currentCandidate;   // etwas Ansprechbares in der Nähe?
  ctx.globalAlpha = (active || state.dialog) ? 0.9 : 0.4;
  pixCircle(BTN_A.x, BTN_A.y, BTN_A.r,   '#3b2f2f');
  pixCircle(BTN_A.x, BTN_A.y, BTN_A.r-3, active ? '#e8944a' : '#fdf3dc');
  ctx.font='bold 12px monospace'; ctx.textBaseline='top';
  ctx.fillStyle = active ? '#fdf3dc' : '#5a4632';
  ctx.fillText('E', BTN_A.x-4, BTN_A.y-6);
  ctx.globalAlpha=1;
}

player.pal=playerPal();
fitCanvas();
// Spielstände aus der Zeit übernehmen, als das Spiel noch anders hieß
try {
  for(let n=1;n<=SAVE_SLOTS;n++){
    const alt = localStorage.getItem('festivalfieber_save_'+n);
    if(alt && !localStorage.getItem(slotKey(n))) localStorage.setItem(slotKey(n), alt);
  }
  const legacy = localStorage.getItem('festivalfieber_save');
  if(legacy && !localStorage.getItem(slotKey(1))) localStorage.setItem(slotKey(1), legacy);
} catch(err) {}
// Das Spiel startet immer mit der Slot-Auswahl
state.mode='title';
let last=performance.now();
function frameLoop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  draw();
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
</script>
