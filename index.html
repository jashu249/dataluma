/* ============ 2. HILFSFUNKTIONEN ============ */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
// Kleiner deterministischer Zufallsgenerator (damit die Wiese immer gleich aussieht)
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function deNum(v){ return (Math.round(v*10)/10).toString().replace('.',','); }

/* --- Spiel-Uhr: SPEED = Spielminuten pro Echtzeit-Sekunde --- */
const CLOCK = {
  SPEED: 3,        // Testmodus: 3x schnell (1 = eine Spielminute pro Sekunde)
  DUSK_START: 19,  // ab hier wird es langsam dunkel
  DUSK_END:   21,  // ab hier volle Nacht
  DAWN_START:  5,  // ab hier wird es langsam hell
  DAWN_END:    7   // ab hier voller Tag
};
// Uhr weiterlaufen lassen; bei Mitternacht steigt der Tageszähler
function clockUpdate(dt){
  const c = state.clock;
  c.min += dt * CLOCK.SPEED;
  while(c.min >= 1440){ c.min -= 1440; c.day++; }
}
// Aktuelle Uhrzeit als "21:47"
function clockText(){
  const total = Math.floor(state.clock.min + 1e-6);
  const h = Math.floor(total/60) % 24, m = total % 60;
  return (h<10?'0':'')+h + ':' + (m<10?'0':'')+m;
}
// Wie dunkel ist es gerade? 0 = heller Tag, 1 = tiefste Nacht
function darkness(){
  const h = state.clock.min / 60;
  if(h >= CLOCK.DUSK_END || h < CLOCK.DAWN_START) return 1;             // Nacht
  if(h >= CLOCK.DUSK_START)                                              // Abenddämmerung
    return (h - CLOCK.DUSK_START) / (CLOCK.DUSK_END - CLOCK.DUSK_START);
  if(h < CLOCK.DAWN_END)                                                 // Morgendämmerung
    return 1 - (h - CLOCK.DAWN_START) / (CLOCK.DAWN_END - CLOCK.DAWN_START);
  return 0;                                                              // Tag
}

/* --- Helligkeitsmodell ---
   Die Umgebung ist tagsüber gleißend hell (+) und nachts dunkel (-).
   Die Sonnenbrille zieht immer denselben festen Betrag ab.
   Tags gleicht sie die Blendung genau aus, nachts macht sie es zu dunkel. */
const GLASSES_TINT = 0.5;   // so viel schluckt die Brille, immer
function ambientLight(){
  // Im Zelt kommt nur wenig Licht durch die Plane: tagsüber dämmrig, nachts fast schwarz
  if(state.scene==='tent') return -0.28 - 0.60 * darkness();
  return GLASSES_TINT * (1 - darkness()) - CFG.NIGHT_DARK * darkness();
}
// Was am Ende auf dem Bildschirm landet: >0 blendet weiß, <0 ist Dunkelheit
function exposure(){
  return ambientLight() - (state.wearingGlasses ? GLASSES_TINT : 0);
}
// Hellt eine Hex-Farbe auf (f > 0) oder dunkelt sie ab (f < 0), f zwischen -1 und 1
function shade(hex, f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const t = f<0 ? 0 : 255, a = Math.abs(f);
  r=Math.round(r+(t-r)*a); g=Math.round(g+(t-g)*a); b=Math.round(b+(t-b)*a);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

// Zeichnet ein Text-Bild Pixel für Pixel auf den Canvas.
// cell = Größe einer Zelle in Canvas-Pixeln (0.5 für hochauflösende Sprites)
function drawGrid(grid, pal, dx, dy, flip, cell){
  cell = cell || 1;
  for(let r=0; r<grid.length; r++){
    const row = grid[r];
    for(let c=0; c<row.length; c++){
      const col = pal[row[c]];
      if(col){
        ctx.fillStyle = col;
        ctx.fillRect(dx + (flip ? row.length-1-c : c)*cell, dy + r*cell, cell, cell);
      }
    }
  }
}

// Wo verläuft der Trampelpfad? (Kachel-Rechtecke: x, y, Breite, Höhe)
const PATH_RECTS = [
  [13, 8, 14, 2],   // vom Camp nach Osten
  [25, 8,  2, 19],  // nach Süden
  [26,13,  7,  3],  // Vorplatz der Dixi-Klos
  [27,25,  9,  2],  // nach Osten zu Stellas Camp
  [33,25,  8,  5],  // Lichtung Stellas Camp
  [ 6, 6,  7,  5]   // Lichtung Spieler-Camp
];
function tileIsPath(tx,ty){
  return PATH_RECTS.some(r => tx>=r[0] && tx<r[0]+r[2] && ty>=r[1] && ty<r[1]+r[3]);
}

// Malt die komplette Wiese samt Pfad EINMAL in einen unsichtbaren Canvas.
function buildGround(){
  ground = document.createElement('canvas');
  ground.width = MAPW*TILE; ground.height = MAPH*TILE;
  const g = ground.getContext('2d');
  const rnd = mulberry32(1337);
  for(let ty=0; ty<MAPH; ty++){
    for(let tx=0; tx<MAPW; tx++){
      const path = tileIsPath(tx,ty);
      g.fillStyle = path ? '#dcc28e' : '#a3cf6b';
      g.fillRect(tx*TILE, ty*TILE, TILE, TILE);
      // Sprenkel für lebendige Textur
      for(let i=0;i<5;i++){
        const px = tx*TILE + Math.floor(rnd()*15);
        const py = ty*TILE + Math.floor(rnd()*15);
        if(path){ g.fillStyle = rnd()<0.5 ? '#cbb47e' : '#e6d3a2'; }
        else    { g.fillStyle = rnd()<0.5 ? '#94c15c' : '#b2da7b'; }
        g.fillRect(px,py,1,1);
      }
      if(!path){
        const r = rnd();
        if(r < 0.05){ // Grasbüschel
          const px=tx*TILE+4+Math.floor(rnd()*8), py=ty*TILE+4+Math.floor(rnd()*8);
          g.fillStyle='#7fb35f'; g.fillRect(px,py,1,3); g.fillRect(px+2,py+1,1,2);
        } else if(r < 0.075){ // Blümchen
          const px=tx*TILE+4+Math.floor(rnd()*8), py=ty*TILE+4+Math.floor(rnd()*8);
          const cols=['#f2e6b8','#e8a0b8','#f2c46a','#d9e8f2'];
          g.fillStyle=cols[Math.floor(rnd()*4)];
          g.fillRect(px,py-1,1,1); g.fillRect(px,py+1,1,1);
          g.fillRect(px-1,py,1,1); g.fillRect(px+1,py,1,1);
          g.fillStyle='#c9a03f'; g.fillRect(px,py,1,1);
        }
      }
    }
  }
}

const BULB_COLS = ['255,120,90','255,200,90','120,220,140','120,180,255','230,130,235','255,160,60'];
function addFairyLights(x1,y1,x2,y2,count,sag){
  for(let i=0;i<=count;i++){

    addLight(x, y, 26, BULB_COLS[i%BULB_COLS.length], 0.55, 'twinkle');

}

/* --- Zeichenfunktionen der Objekte --- */
function pixCircle(cx,cy,r,col){
  ctx.fillStyle=col;
  for(let dy=-r; dy<=r; dy++){
    const hw=Math.floor(Math.sqrt(r*r-dy*dy));
    ctx.fillRect(cx-hw, cy+dy, hw*2+1, 1);
  }
}
function drawTent(o){
  const cx=o.x+o.w/2;
  ctx.fillStyle='rgba(50,35,25,0.2)'; ctx.fillRect(o.x+4,o.base-3,o.w-8,4);
  for(let i=0;i<o.h;i++){
    const half=Math.max(2, Math.round((i/o.h)*(o.w/2)));
    ctx.fillStyle = (Math.floor(i/4)%2===0) ? o.col.c1 : o.col.c1b;  // Streifen
    ctx.fillRect(cx-half, o.y+i, half*2, 1);
    ctx.fillStyle=o.col.c2;
    ctx.fillRect(cx-half, o.y+i, 1, 1); ctx.fillRect(cx+half-1, o.y+i, 1, 1);
  }
  // Eingang
  const dh=Math.round(o.h*0.45);
  for(let j=0;j<dh;j++){
    const hw=Math.max(1, Math.round((j/dh)*(o.w*0.16)));
    ctx.fillStyle='#3b2f2f';
    ctx.fillRect(cx-hw, o.y+o.h-dh+j, hw*2, 1);
  }
  ctx.fillStyle='#e8e0d0'; ctx.fillRect(cx-1, o.y, 2, 2);  // Zeltspitze
}
function drawTree(o){
  ctx.fillStyle='rgba(50,35,25,0.2)'; ctx.fillRect(o.x-7,o.base-2,14,3);
  ctx.fillStyle='#7a5230'; ctx.fillRect(o.x-2,o.base-9,4,9);
  ctx.fillStyle='#5e3f24'; ctx.fillRect(o.x-2,o.base-9,1,9);
  pixCircle(o.x,   o.base-16, 9, '#4d7c3e');
  pixCircle(o.x-4, o.base-19, 6, '#63994b');
  pixCircle(o.x+4, o.base-18, 6, '#63994b');
  pixCircle(o.x,   o.base-22, 5, '#7fb35f');
  ctx.fillStyle='#a4cd7f';
  ctx.fillRect(o.x-3,o.base-24,2,1); ctx.fillRect(o.x+2,o.base-21,1,1);
}
function drawBush(o){
  ctx.fillStyle='rgba(50,35,25,0.18)'; ctx.fillRect(o.x-6,o.base-2,12,2);
  pixCircle(o.x, o.base-5, 6, '#63994b');
  pixCircle(o.x-2, o.base-7, 4, '#7fb35f');
  ctx.fillStyle='#a4cd7f'; ctx.fillRect(o.x+1,o.base-8,1,1);
}
function drawToilet(o){
  ctx.fillStyle='rgba(50,35,25,0.2)'; ctx.fillRect(o.x,o.base-2,16,3);
  ctx.fillStyle='#3f8f8a'; ctx.fillRect(o.x,o.y+4,16,22);      // Kabine
  ctx.fillStyle='#2f6f6b'; ctx.fillRect(o.x,o.y+4,2,22); ctx.fillRect(o.x+14,o.y+4,2,22);
  ctx.fillStyle='#e8e4da'; ctx.fillRect(o.x-1,o.y,18,5);       // Dach
  ctx.fillStyle='#c9c4b8'; ctx.fillRect(o.x-1,o.y+4,18,1);
  ctx.fillStyle='#2f6f6b'; ctx.fillRect(o.x+4,o.y+8,8,16);     // Tür
  ctx.fillStyle='#e8e4da'; ctx.fillRect(o.x+10,o.y+15,2,2);    // Griff
  ctx.fillStyle='#d9f2ef'; ctx.fillRect(o.x+6,o.y+10,4,2);     // Lüftung
}
function drawSign(o){
  ctx.fillStyle='#7a5230'; ctx.fillRect(o.x-1,o.base-10,3,10);
  ctx.fillStyle='#b98d5a'; ctx.fillRect(o.x-9,o.base-16,19,9);
  ctx.fillStyle='#8a6538'; ctx.fillRect(o.x-9,o.base-16,19,1); ctx.fillRect(o.x-9,o.base-8,19,1);
  ctx.fillStyle='#6d4a2f';
  ctx.fillRect(o.x-6,o.base-13,13,1); ctx.fillRect(o.x-6,o.base-11,9,1);
}
function drawBin(o){
  const rest = o.kind==='rest';
  ctx.fillStyle='rgba(50,35,25,0.2)'; ctx.fillRect(o.x-6,o.base-2,12,3);
  // Tonne (leicht konisch: unten schmaler)
  ctx.fillStyle = rest ? '#6d7178' : '#e8c435';
  ctx.fillRect(o.x-6,o.base-12,12,10);
  ctx.fillRect(o.x-5,o.base-2,10,2);
  ctx.fillStyle = rest ? '#565a61' : '#c9a51f';       // Schattenkante rechts
  ctx.fillRect(o.x+4,o.base-12,2,12);
  ctx.fillStyle = rest ? '#83878e' : '#f2d55e';       // Lichtkante links
  ctx.fillRect(o.x-6,o.base-12,1,10);
  // Deckel mit Griff
  ctx.fillStyle = rest ? '#4a4e55' : '#8a7a1f';
  ctx.fillRect(o.x-7,o.base-15,14,3);
  ctx.fillRect(o.x-2,o.base-17,4,2);
  // Symbol auf der Front
  if(rest){
    ctx.fillStyle='#3b3f45';                          // Mülltüten-Silhouette
    ctx.fillRect(o.x-2,o.base-9,4,4);
    ctx.fillRect(o.x-1,o.base-10,2,1);
  } else {
    ctx.fillStyle='#8a7a1f';                          // Recycling-Dreieck (angedeutet)
    ctx.fillRect(o.x-2,o.base-10,4,1);
    ctx.fillRect(o.x-2,o.base-10,1,4);
    ctx.fillRect(o.x+1,o.base-10,1,4);
    ctx.fillRect(o.x-2,o.base-7,4,1);
  }
}
function drawFire(o){
  ctx.fillStyle='#8d8d95';   // Steinkreis
  ctx.fillRect(o.x-8,o.base-3,3,2); ctx.fillRect(o.x+5,o.base-3,3,2);
  ctx.fillRect(o.x-6,o.base-1,3,2); ctx.fillRect(o.x+3,o.base-1,3,2);
  ctx.fillRect(o.x-2,o.base,4,2);
  ctx.fillStyle='#6d4a2f'; ctx.fillRect(o.x-5,o.base-4,10,2);   // Scheite
  ctx.fillRect(o.x-2,o.base-6,4,3);
  const f = Math.sin(state.time*9 + o.x)*1.5;                    // Flackern
  const h = (o.small?7:10) + f;
  for(let i=0;i<h;i++){
    const hw=Math.max(1, Math.round((1-i/h)*4));
    ctx.fillStyle = i<h*0.45 ? '#e8944a' : (i<h*0.75 ? '#f2b84a' : '#f8e08a');
    ctx.fillRect(o.x-hw, o.base-6-i, hw*2, 1);
  }
}
function drawHammock(o){
  ctx.fillStyle='#6d4a2f';
  ctx.fillRect(o.x+2, o.base-20, 3, 20); ctx.fillRect(o.x+59, o.base-20, 3, 20);
  ctx.fillStyle='#5a3a20'; ctx.fillRect(o.x+1,o.base-21,5,2); ctx.fillRect(o.x+58,o.base-21,5,2);
  for(let i=0;i<=24;i++){                                        // durchhängendes Netz
    const t=i/24;
    const px=Math.round(lerp(o.x+4, o.x+60, t));
    const py=Math.round(o.base-16 + Math.sin(Math.PI*t)*7);
    ctx.fillStyle='#d9c9a0'; ctx.fillRect(px,py,2,2);
    if(t>0.25 && t<0.75){ ctx.fillStyle='#c96f9b'; ctx.fillRect(px,py-1,2,2); } // Decke
  }
}
function drawStub(s){
  ctx.fillStyle='#e8e0d0'; ctx.fillRect(Math.round(s.x),Math.round(s.y),3,1);
  ctx.fillStyle='#e8944a'; ctx.fillRect(Math.round(s.x)+3,Math.round(s.y),1,1);
}
// Wimpelkette (rein dekorativ, wird ÜBER allem gezeichnet)
function drawBunting(x1,y1,x2,y2){
  const cols=['#e05a4e','#e8c35c','#5f9bd9','#7bbf6a','#c97bb0'];
  const n=12;
  for(let i=0;i<=n;i++){
    const t=i/n;
    const px=Math.round(lerp(x1,x2,t));
    const py=Math.round(lerp(y1,y2,t) + Math.sin(Math.PI*t)*7);
    ctx.fillStyle='#8a6538'; ctx.fillRect(px,py,2,1);           // Schnur
    if(i<n && i%1===0){
      ctx.fillStyle=cols[i%5];
      ctx.fillRect(px,py+1,4,2); ctx.fillRect(px+1,py+3,2,2);   // Wimpel
    }
  }
}
// Laternenmast: schlichter Pfosten mit Laternenkopf
function drawLantern(o){
  const d = darkness();
  ctx.fillStyle='rgba(50,35,25,0.2)'; ctx.fillRect(o.x-4,o.base-2,9,3);
  ctx.fillStyle='#4a4038'; ctx.fillRect(o.x-1,o.base-26,3,26);      // Mast
  ctx.fillStyle='#5c5148'; ctx.fillRect(o.x-1,o.base-26,1,26);
  ctx.fillStyle='#3b332c'; ctx.fillRect(o.x-4,o.base-32,9,3);       // Haube
  // Glas: leuchtet nachts in der Laternenfarbe
  const on = d > 0.05;
  ctx.fillStyle = on ? 'rgba('+o.col+',1)' : '#8a8f96';
  ctx.fillRect(o.x-3,o.base-30,7,5);
  if(on){
    ctx.fillStyle = 'rgba(255,255,255,'+(0.5*d).toFixed(2)+')';
    ctx.fillRect(o.x-1,o.base-29,3,3);
  }
  ctx.fillStyle='#3b332c'; ctx.fillRect(o.x-3,o.base-25,7,1);
}

// Campingstuhl: steht entweder ordentlich da oder liegt geknickt im Gras
function addChair(tx,ty){

  objects.push({ type:'chair', x, base, label:'Campingstuhl',
    ax:x, ay:base, solid:{x:x-8, y:base-8, w:16, h:8},

function drawChair(o){
  const heil = state.flags.chairFixed;
  ctx.fillStyle='rgba(40,32,24,0.20)';
  ctx.fillRect(o.x-9, o.base-3, 18, 4);
  if(heil){
    // Wieder aufgebaut: Sitzfläche gespannt, Beine gerade
    ctx.fillStyle='#3f6f8a'; ctx.fillRect(o.x-8,o.base-16,16,7);      // Sitz
    ctx.fillStyle='#5290ad'; ctx.fillRect(o.x-7,o.base-15,14,5);
    ctx.fillStyle='#3f6f8a'; ctx.fillRect(o.x-8,o.base-26,16,9);      // Lehne
    ctx.fillStyle='#5290ad'; ctx.fillRect(o.x-7,o.base-25,14,7);
    ctx.fillStyle='#8d8d95';                                          // Gestell
    ctx.fillRect(o.x-8,o.base-9,2,9); ctx.fillRect(o.x+6,o.base-9,2,9);
    ctx.fillRect(o.x-8,o.base-26,2,10); ctx.fillRect(o.x+6,o.base-26,2,10);
    // Panzertape-Streifen als Andenken an die Reparatur
    ctx.fillStyle='#b0b0b8'; ctx.fillRect(o.x-6,o.base-21,12,3);
  } else {
    // Kaputt: eingeknickt, Stoff hängt durch
    ctx.fillStyle='#8d8d95';
    ctx.fillRect(o.x-9,o.base-6,11,2);                                // verbogenes Bein

/* ============ 6. FIGUREN & BEWEGUNG ============ */
const player = { x:204, y:150, facing:'down', moving:false, animT:0, frame:0,
                 pal:null, gridSet:PLAYER_GRIDS };
const npcs = [];
function addNPC(id,name,x,y,pal,gridSet,portrait,pPal,talk){
  const n = { id, name, x, y, facing:'down', moving:false, animT:0, frame:0,
              pal, gridSet, portrait, pPal, talk };
  npcs.push(n);
  return n;
}

function entBox(e){ return { x:e.x-5, y:e.y-7, w:10, h:7 }; }
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
// Bewegt eine Figur Achse für Achse und stoppt an Hindernissen
// Welche Hindernisse gelten gerade? Jede Szene hat ihre eigenen.
function sceneSolids(){
  if(state.scene==='tent')  return tentSolids.slice();
  if(state.scene==='stage')
    return state.flags.backstageOpen ? stageSolids.filter(s=>!s.gate) : stageSolids.slice();
  if(state.scene==='food')  return foodSolids.slice();
  if(state.scene==='wald')  return waldSolids.slice();
  return solids.concat(borderWalls);
}

function moveEntity(e, dx, dy, ignoreNpcs){
  const blockers = sceneSolids();
  // Die Leute vom Campingplatz stehen nur dort im Weg, nicht auf anderen Karten
  if(!ignoreNpcs && state.scene==='camp'){
    for(const n of npcs){ if(n!==e) blockers.push(entBox(n)); }
    if(e!==player) blockers.push(entBox(player));
  }
  // Im Zelt blockieren zusätzlich Matratze und Rucksack
  if(state.scene==='tent'){
    for(const o of tentObjects){ if(o.solid) blockers.push(o.solid); }
  }
  // Auf dem Gelände stehen Crew und Security im Weg
  if(state.scene==='stage' && !ignoreNpcs){
    for(const n of stageNpcs){ if(n!==e) blockers.push(entBox(n)); }
  }
  e.x += dx;
  let box = entBox(e);
  for(const s of blockers){
    if(rectsOverlap(box,s)){
      if(dx>0) e.x = s.x - 5; else if(dx<0) e.x = s.x + s.w + 5;
      box = entBox(e);
    }
  }
  e.y += dy;
  box = entBox(e);
  for(const s of blockers){
    if(rectsOverlap(box,s)){
      if(dy>0) e.y = s.y - 0.01; else if(dy<0) e.y = s.y + s.h + 7;
      box = entBox(e);
    }
  }
}

function playerUpdate(dt){
  let dx=0, dy=0;
  if(keys['w']||keys['arrowup'])    dy-=1;
  if(keys['s']||keys['arrowdown'])  dy+=1;
  if(keys['a']||keys['arrowleft'])  dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  // Virtueller Joystick (Touch) fließt hier einfach mit ein
  dx += touch.dx;
  dy += touch.dy;
  const moving = (dx!==0 || dy!==0);
  player.moving = moving;
  if(moving){
    const len=Math.hypot(dx,dy); dx/=len; dy/=len;
    if(dx<0) player.facing='left'; else if(dx>0) player.facing='right';
    else if(dy<0) player.facing='up'; else player.facing='down';
    let spd = CFG.PLAYER_SPEED * (state.energy<20 ? 0.6 : 1)
            * (1 - (1-CFG.HIGH_SPEED_FACTOR)*highFactor())    // High: sanft rein und raus
            * (state.onBike ? CFG.BIKE_SPEED_FACTOR : 1);     // Rad: deutlich flotter
    moveEntity(player, dx*spd*dt, dy*spd*dt, false);
    player.animT += dt;
    player.frame = Math.floor(player.animT*7)%4;
  } else {
    player.frame = 0; player.animT = 0;
  }
}
function npcUpdate(dt){
  for(const n of npcs){
    if(n.id==='harvey' && !state.cutscene){
      n.wanderT = (n.wanderT||0) - dt;               // Harvey schaut sich gelegentlich um
      if(n.wanderT<=0){ n.wanderT = 4+Math.random()*4; n.facing = pick(['down','left','right']); }
    }
  }
}

// Zeichnet eine Figur (Spieler oder NPC) inkl. Schatten & Lauf-Animation.
// Liest Zellgröße, Körperzeilen und Bein-Zeilen aus dem gridSet, damit
// einfache (12x16) und hochauflösende (24x32) Sprites gleich behandelt werden.
function drawEntity(e){
  const gs = e.gridSet;
  const cell = gs.cell || 1;
  const bodyRows = gs.bodyRows || 13;
  const legsSet = gs.legsSet || { idle:LEGS_IDLE, a:LEGS_A, b:LEGS_B };
  let baseGrid, flip=false;
  if(e.facing==='up') baseGrid=gs.up;
  else if(e.facing==='down') baseGrid=gs.down;
  else { baseGrid=gs.side; flip=(e.facing==='right'); }
  const legs = e.moving ? (e.frame===1?legsSet.a : e.frame===3?legsSet.b : legsSet.idle) : legsSet.idle;
  const grid = baseGrid.slice(0,bodyRows).concat(legs);
  const bob = (e.moving && (e.frame===1||e.frame===3)) ? -1 : 0;
  const sx = Math.round(e.x-6), sy = Math.round(e.y-16+bob);
  ctx.fillStyle='rgba(50,35,25,0.25)';
  ctx.fillRect(sx+2, Math.round(e.y)-1, 8, 2);
  drawGrid(grid, e.pal, sx, sy, flip, cell);
  return {sx, sy, flip};
}
// Unter der Figur mitfahrende Räder, wenn man auf dem Rad sitzt
function drawBikeUnder(e){
  if(!state.onBike) return;
  const y = e.y - 1;
  const seit = (e.facing==='left'||e.facing==='right');
  ctx.strokeStyle='#3b6f8a'; ctx.lineWidth=2;
  if(seit){
    ctx.beginPath(); ctx.arc(e.x-6,y,5,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(e.x+6,y,5,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#c94f6f'; ctx.fillRect(e.x-6,y-5,12,2);
  } else {
    ctx.beginPath(); ctx.arc(e.x,y,5,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#c94f6f'; ctx.fillRect(e.x-2,y-6,4,3);
    ctx.fillStyle='#8d8d95'; ctx.fillRect(e.x-6,y-7,12,2);
  }
}

function drawPlayerEnt(){
  drawBikeUnder(player);
  const pos = drawEntity(player);
  // Sonnenbrille sitzt auf der Nase (Augenhöhe des HD-Sprites: ~4 px)
  if(state.wearingGlasses && player.facing!=='up'){
    const yE = pos.sy+4;
    ctx.fillStyle='#241d26';
    if(player.facing==='down'){
      ctx.fillRect(pos.sx+3,yE,2,2); ctx.fillRect(pos.sx+7,yE,2,2); ctx.fillRect(pos.sx+5,yE,2,1);
    } else if(player.facing==='left'){
      ctx.fillRect(pos.sx+2,yE,3,2);
    } else {
      ctx.fillRect(pos.sx+7,yE,3,2);
    }
  }
  // Zigarette beim Rauchen (Mundhöhe: ~5 px)
  if(state.smoke.phase==='smoking' && player.facing!=='up'){
    const cx = player.facing==='left' ? pos.sx+1 : pos.sx+8;
    ctx.fillStyle='#e8e0d0'; ctx.fillRect(cx, pos.sy+5, 3, 1);
    ctx.fillStyle='#e8944a'; ctx.fillRect(player.facing==='left'?cx:cx+2, pos.sy+5, 1, 1);
  }
}

// Kobi im Bad Trip: kauert, zittert (1px-Wackeln), Schweißtropfen blinkt
function drawKobiCrouch(n){
  const jit = Math.floor(state.time*13)%2;
  const sx = Math.round(n.x-6)+jit, sy = Math.round(n.y-16);
  ctx.fillStyle='rgba(50,35,25,0.25)';

// Tomás im Bad Trip: zittert stärker und dreht sich desorientiert im Kreis
function drawTomasPanic(n){
  const jit = Math.floor(state.time*17)%2;
  const fc = FACE_CYCLE[Math.floor(state.time*2.2)%4];

/* --- Rein und raus, mit kurzer Schwarzblende --- */
function enterTent(){
  state.outdoorPos = { x:player.x, y:player.y, facing:player.facing };
  fadeTo(()=>{
    state.scene = 'tent';
    state.onBike = false;                        // vorm Zelt abgestellt
    player.x = TENT.W/2; player.y = TENT.H-22;   // direkt hinter dem Eingang
    player.facing = 'up';
  });
}
function leaveTent(){
  fadeTo(()=>{
    state.scene = 'camp';
    const p = state.outdoorPos;
    if(p){ player.x=p.x; player.y=p.y; player.facing='down'; }
    state.outdoorPos = null;
  });
}
// Blendet schwarz, führt dann die Aktion aus und blendet wieder auf
let fadeAction = null;
function fadeTo(fn){
  if(state.fadeDir!==0) return;             // läuft schon
  fadeAction = fn; state.fadeDir = 1;
}
function fadeUpdate(dt){
  if(state.fadeDir === 0) return;
  state.fade += state.fadeDir * dt * 3.2;
  if(state.fadeDir > 0 && state.fade >= 1){
    state.fade = 1;
    if(fadeAction){ fadeAction(); fadeAction = null; }
    state.fadeDir = -1;                     // wieder aufblenden
    state.expo = exposure();                // Helligkeit sofort passend setzen
  } else if(state.fadeDir < 0 && state.fade <= 0){
    state.fade = 0; state.fadeDir = 0;
  }
}

/* --- Auf der Matratze schlafen: bis zum nächsten Morgen --- */
function tentSleep(){
  fadeTo(()=>{
    const c = state.clock;
    const ziel = 7*60;                      // 7:00 morgens
    if(c.min >= ziel) c.day++;              // nach 7: bis morgen früh
    c.min = ziel;
    state.energy = clamp(state.energy + 55, 0, 100);
    state.flashlight = false;               // im Schlaf ausgeschaltet
    state.expo = exposure();
    toast('Du schläfst tief und fest. Guten Morgen!');
  });
}

/* ============ DAS FESTIVALGELÄNDE ============
   Zweiter großer Schauplatz mit eigener Karte: Bühne, Publikumsfläche
   und der abgesperrte Backstage-Bereich, in den man nur mit Bändchen kommt. */
const STAGE = { W:40, H:30 };                 // Kartengröße in Kacheln
const stageObjects = [];
const stageSolids  = [];
const stageNpcs    = [];
const stageLights  = [];
let stageGround = null;

// Boden des Geländes: festgetretene Wiese, vor der Bühne blanke Erde
function buildStageGround(){
  stageGround = document.createElement('canvas');
  stageGround.width = STAGE.W*TILE; stageGround.height = STAGE.H*TILE;
  const g = stageGround.getContext('2d');
  const rnd = mulberry32(4711);
  for(let ty=0; ty<STAGE.H; ty++){
    for(let tx=0; tx<STAGE.W; tx++){
      // Direkt vor der Bühne ist das Gras längst plattgetreten
      const pit = (ty>=11 && ty<=24 && tx>=8 && tx<=32);
      g.fillStyle = pit ? '#c2ab7e' : '#a3cf6b';
      g.fillRect(tx*TILE, ty*TILE, TILE, TILE);
      for(let i=0;i<5;i++){
        const px = tx*TILE + Math.floor(rnd()*15);
        const py = ty*TILE + Math.floor(rnd()*15);
        if(pit) g.fillStyle = rnd()<0.5 ? '#b09a70' : '#d0ba8e';
        else    g.fillStyle = rnd()<0.5 ? '#94c15c' : '#b2da7b';
        g.fillRect(px,py,1,1);
      }
      if(pit && rnd()<0.06){            // Müll und Becher im Publikumsbereich
        const px=tx*TILE+3+Math.floor(rnd()*10), py=ty*TILE+3+Math.floor(rnd()*10);
        g.fillStyle = rnd()<0.5 ? '#e8e0d0' : '#d9c48a';
        g.fillRect(px,py,2,2);
      } else if(!pit && rnd()<0.05){
        const px=tx*TILE+4+Math.floor(rnd()*8), py=ty*TILE+4+Math.floor(rnd()*8);
        g.fillStyle='#7fb35f'; g.fillRect(px,py,1,3); g.fillRect(px+2,py+1,1,2);
      }
    }
  }
}

// Absperrgitter: blockiert und wird als Gitter gezeichnet
function addFence(tx,ty,len,horizontal,gate){
  const x=tx*TILE, y=ty*TILE;
  const w = horizontal ? len*TILE : 6;
  const h = horizontal ? 6 : len*TILE;
  stageObjects.push({ type:'fence', x, y, w, h, base:y+h, gate:!!gate });
  stageSolids.push({ x, y, w, h, gate:!!gate });
}

function buildStage(){
  stageObjects.length=0; stageSolids.length=0; stageNpcs.length=0; stageLights.length=0;
  buildStageGround();
  const W=STAGE.W*TILE, H=STAGE.H*TILE;
  // Kartenränder: rundum dicht, nur unten der Weg zurück zum Campingplatz
  stageSolids.push({x:0, y:0, w:W, h:24});
  stageSolids.push({x:0, y:0, w:24, h:H});
  stageSolids.push({x:W-24, y:0, w:24, h:H});
  stageSolids.push({x:0, y:H-20, w:17*TILE, h:20});
  stageSolids.push({x:23*TILE, y:H-20, w:W-23*TILE, h:20});
  // Baumreihen als sichtbarer Rand
  for(let x=1;x<39;x+=2){ addStageTree(x,1); }
  for(let y=3;y<29;y+=2){ addStageTree(1,y); addStageTree(38,y); }
  for(let x=1;x<17;x+=2) addStageTree(x,28);
  for(let x=23;x<39;x+=2) addStageTree(x,28);

  // --- Die Bühne ---
  stageObjects.push({ type:'stagePlatform', x:14*TILE, y:3*TILE, w:16*TILE, h:7*TILE,
    base:10*TILE, ax:22*TILE, ay:10*TILE, label:'Bühne',
    text:'Die Hauptbühne. Noch steht kein Mensch drauf, aber die Anlage brummt schon.' });
  stageSolids.push({x:14*TILE, y:3*TILE, w:16*TILE, h:7*TILE});
  // Boxentürme links und rechts
  stageObjects.push({ type:'speaker', x:12*TILE, y:5*TILE, w:2*TILE, h:5*TILE, base:10*TILE,
    ax:13*TILE, ay:10*TILE, label:'Boxenturm', text:'Ein Turm aus Lautsprechern. Man spürt ihn mehr, als man ihn hört.' });
  stageSolids.push({x:12*TILE, y:5*TILE, w:2*TILE, h:5*TILE});
  stageObjects.push({ type:'speaker', x:30*TILE, y:5*TILE, w:2*TILE, h:5*TILE, base:10*TILE,
    ax:31*TILE, ay:10*TILE, label:'Boxenturm', text:'Noch so ein Turm. Der Bass wird später in der Brust sitzen.' });
  stageSolids.push({x:30*TILE, y:5*TILE, w:2*TILE, h:5*TILE});

  // --- Backstage: eingezäunt, links neben der Bühne ---
  addFence(3,10,8,true);          // untere Kante
  addFence(3,2,8,false);          // linke Kante
  addFence(3,2,5,true);           // obere Kante
  addFence(10,2,3,false);         // rechte Kante oben

function drawStage(){
  camX=clamp(Math.round(player.x-GAME_W/2), 0, STAGE.W*TILE-GAME_W);
  camY=clamp(Math.round(player.y-GAME_H/2-10), 0, STAGE.H*TILE-GAME_H);
  ctx.save();
  ctx.translate(-camX,-camY);
  ctx.drawImage(stageGround,0,0);
  const list=[];
  for(const o of stageObjects) list.push({y:o.base, f:()=>drawStageObject(o)});
  for(const n of stageNpcs)    list.push({y:n.y, f:()=>drawEntity(n)});
  list.push({y:player.y, f:()=>drawPlayerEnt()});
  list.sort((a,b)=>a.y-b.y);
  for(const it of list) it.f();
  for(const p of particles){
    ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
  }
  if(currentCandidate && !state.dialog && !state.menu){
    const c=currentCandidate;
    ctx.font='bold 9px monospace'; ctx.textBaseline='top';
    const w=ctx.measureText('E').width+8;
    ctx.fillStyle='rgba(30,25,40,0.72)'; ctx.fillRect(c.x-w/2, c.y, w, 12);
    ctx.fillStyle='#e8c46a'; ctx.fillText('E', c.x-w/2+4, c.y+2);
  }
  ctx.restore();
  drawLighting();
  drawHUD();
  drawTouchPad();
  drawTouchButton();
  if(state.dialog) drawDialog();
  if(state.menu) drawMenu();
  drawToasts();
  drawFade();
}

/* ============ DER FOODCOURT ============
   Vierter Schauplatz. Man kommt von links herein, läuft an den Ständen
   nach rechts und dann nach Norden hoch zur zweiten Bühne. */
const FOOD = { W:34, H:32 };
const foodObjects = [];
const foodSolids  = [];
const foodLights  = [];
let foodGround = null;

// Wo überall gelaufen wird: der waagerechte Gang und der Weg nach oben
const FOOD_PATHS = [
  [2, 22, 15, 6],    // kurzer Gang von links herein
  [12, 2, 8, 26]     // die lange Kante nach Norden – hier stehen die Stände
];
function foodIsPath(tx,ty){
  return FOOD_PATHS.some(r => tx>=r[0] && tx<r[0]+r[2] && ty>=r[1] && ty<r[1]+r[3]);
}
function buildFoodGround(){
  foodGround = document.createElement('canvas');
  foodGround.width = FOOD.W*TILE; foodGround.height = FOOD.H*TILE;
  const g = foodGround.getContext('2d');
  const rnd = mulberry32(9182);
  for(let ty=0; ty<FOOD.H; ty++){
    for(let tx=0; tx<FOOD.W; tx++){
      const weg = foodIsPath(tx,ty);
      g.fillStyle = weg ? '#c7b183' : '#a3cf6b';
      g.fillRect(tx*TILE, ty*TILE, TILE, TILE);
      for(let i=0;i<5;i++){
        const px = tx*TILE + Math.floor(rnd()*15);
        const py = ty*TILE + Math.floor(rnd()*15);
        g.fillStyle = weg ? (rnd()<0.5?'#b39f74':'#d6c295') : (rnd()<0.5?'#94c15c':'#b2da7b');
        g.fillRect(px,py,1,1);
      }
      // Auf dem Gang liegen Becher und Servietten herum
      if(weg && rnd()<0.07){
        const px=tx*TILE+3+Math.floor(rnd()*10), py=ty*TILE+3+Math.floor(rnd()*10);
        g.fillStyle = rnd()<0.5 ? '#e8e0d0' : '#d9b48a';
        g.fillRect(px,py,2,2);
      }
    }
  }
}

function addFoodTree(tx,ty){
  const x=tx*TILE+8, base=(ty+1)*TILE;
  foodObjects.push({ type:'tree', x, base, sway:Math.random()*6.28 });
  foodSolids.push({x:x-5, y:base-6, w:10, h:6});

function buildFood(){
  foodObjects.length=0; foodSolids.length=0; foodLights.length=0;
  buildFoodGround();
  const W=FOOD.W*TILE, H=FOOD.H*TILE;
  // Kartenränder – links unten bleibt der Weg zurück zum Campingplatz frei

/* ============ DIE WALDBÜHNE ============
   Eigene Karte am oberen Ende des Foodcourts. Eine Lichtung im Wald,
   deutlich ruhiger als die Mainstage. */
const WALD = { W:28, H:22 };
const waldObjects = [];
const waldSolids  = [];
const waldLights  = [];
let waldGround = null;

function buildWaldGround(){
  waldGround = document.createElement('canvas');
  waldGround.width = WALD.W*TILE; waldGround.height = WALD.H*TILE;
  const g = waldGround.getContext('2d');
  const rnd = mulberry32(3377);
  for(let ty=0; ty<WALD.H; ty++){
    for(let tx=0; tx<WALD.W; tx++){
      // Vor der Bühne ist das Gras zertreten, außen herum Waldboden
      const platz = (ty>=8 && ty<=18 && tx>=5 && tx<=22);
      g.fillStyle = platz ? '#9cbf6a' : '#7ea658';
      g.fillRect(tx*TILE, ty*TILE, TILE, TILE);
      for(let i=0;i<5;i++){
        const px = tx*TILE + Math.floor(rnd()*15);
        const py = ty*TILE + Math.floor(rnd()*15);
        g.fillStyle = platz ? (rnd()<0.5?'#8fb35e':'#accf7a') : (rnd()<0.5?'#6f9550':'#8cb566');
        g.fillRect(px,py,1,1);
      }
      // Laub und kleine Zweige auf dem Waldboden
      if(!platz && rnd()<0.09){
        const px=tx*TILE+3+Math.floor(rnd()*10), py=ty*TILE+3+Math.floor(rnd()*10);
        g.fillStyle = rnd()<0.5 ? '#8a6a44' : '#a8894f';
        g.fillRect(px,py,2,1);
      }
    }
  }
}
function addWaldTree(tx,ty){
  const x=tx*TILE+8, base=(ty+1)*TILE;
  waldObjects.push({ type:'tree', x, base, sway:Math.random()*6.28 });
  waldSolids.push({x:x-5, y:base-6, w:10, h:6});
}
function addBlanket(tx,ty,col){

    ax:x+16, ay:base, text:'Eine ausgebreitete Picknickdecke. Jemand hat den Platz schon reserviert.' });

  waldSolids.push({x:0, y:0, w:24, h:H});
  waldSolids.push({x:W-24, y:0, w:24, h:H});
  // Dichter Wald ringsum
  for(let x=1;x<27;x+=2) addWaldTree(x,1);
  for(let y=3;y<21;y+=2){ addWaldTree(1,y); addWaldTree(26,y); }

    waldSolids.push({x:bx*TILE, y:5*TILE, w:TILE, h:3*TILE});

  // Decken auf der Wiese
  addBlanket(9,11,'#c94f6f'); addBlanket(14,12,'#4a8f9b');
  addBlanket(18,11,'#d9a03f'); addBlanket(11,15,'#7b5fc9');

  waldLights.push({x:18*TILE, y:4*TILE, r:90, col:'180,220,255', s:0.7, flicker:'hum', seed:2});
  waldLights.push({x:14*TILE, y:7*TILE, r:110, col:'255,210,150', s:0.6, flicker:'sweep', seed:3});
  for(let i=0;i<5;i++)
    waldLights.push({x:7*TILE+i*56, y:9*TILE, r:44, col:'255,200,140', s:0.5, flicker:'twinkle', seed:10+i});
  waldLights.push({x:14*TILE, y:18*TILE, r:64, col:'255,190,110', s:0.6, flicker:'hum', seed:20});

function drawWaldStage(o){
  ctx.fillStyle='rgba(20,16,30,0.26)'; ctx.fillRect(o.x-3, o.base-5, o.w+6, 7);
  ctx.fillStyle='#3a4a3d'; ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.fillStyle='#2e3b31';
  for(let x=o.x+5; x<o.x+o.w; x+=13) ctx.fillRect(x, o.y+8, 3, o.h-26);
  ctx.fillStyle='#4c6152'; ctx.fillRect(o.x, o.y, o.w, 9);
  ctx.fillStyle='#5f7a66'; ctx.fillRect(o.x+2, o.y+2, o.w-4, 3);
  ctx.fillStyle='#6a5340'; ctx.fillRect(o.x+6, o.base-20, o.w-12, 20);
  ctx.fillStyle='#7d6349'; ctx.fillRect(o.x+8, o.base-18, o.w-16, 16);
  ctx.fillStyle='#5a4636';
  for(let x=o.x+12; x<o.x+o.w-12; x+=12) ctx.fillRect(x, o.base-18, 1, 16);
  ctx.fillStyle='#4a8f6a'; ctx.fillRect(o.x+26, o.y+12, o.w-52, 16);
  ctx.fillStyle='#6bbd8c'; ctx.fillRect(o.x+28, o.y+14, o.w-56, 12);
  ctx.fillStyle='#fdf3dc'; ctx.font='bold 8px monospace'; ctx.textBaseline='top';
  ctx.fillText('WALDBÜHNE', o.x+o.w/2-24, o.y+16);
  const d=darkness();
  const cols=['#ff8a5a','#ffd25a','#8affaa','#8ac8ff','#e88aff'];
  for(let i=0;i<8;i++){
    ctx.fillStyle = d>0.2 ? cols[i%5] : '#9c9c9c';
    ctx.fillRect(o.x+10+i*((o.w-20)/7), o.y+9, 3, 3);
  }
}
function drawBlanket(o){
  ctx.fillStyle=o.col; ctx.fillRect(o.x, o.base-12, 32, 14);
  ctx.fillStyle='rgba(255,255,255,0.22)';
  for(let i=0;i<4;i++) ctx.fillRect(o.x+2+i*8, o.base-12, 3, 14);
  ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.fillRect(o.x, o.base+1, 32, 2);
  // ein Rucksack als Platzhalter
  ctx.fillStyle='#4a6a4a'; ctx.fillRect(o.x+22, o.base-10, 8, 8);
  ctx.fillStyle='#3b5540'; ctx.fillRect(o.x+23, o.base-12, 6, 3);
}
function drawWaldObject(o){
  switch(o.type){
    case 'waldStage': drawWaldStage(o); break;
    case 'blanket':   drawBlanket(o); break;
    case 'speaker':   drawSpeaker(o); break;
    case 'backGate':  drawBackGate(o); break;
    case 'tree':      drawTree(o); break;
    case 'sign':      drawSign(o); break;
  }
}
function drawWald(){
  camX=clamp(Math.round(player.x-GAME_W/2), 0, WALD.W*TILE-GAME_W);
  camY=clamp(Math.round(player.y-GAME_H/2-10), 0, WALD.H*TILE-GAME_H);
  ctx.save();
  ctx.translate(-camX,-camY);
  ctx.drawImage(waldGround,0,0);
  const list=[];
  for(const o of waldObjects) list.push({y:o.base, f:()=>drawWaldObject(o)});
  list.push({y:player.y, f:()=>drawPlayerEnt()});
  list.sort((a,b)=>a.y-b.y);
  for(const it of list) it.f();
  if(currentCandidate && !state.dialog && !state.menu){
    const c=currentCandidate;
    ctx.font='bold 9px monospace'; ctx.textBaseline='top';
    const w=ctx.measureText('E').width+8;
    ctx.fillStyle='rgba(30,25,40,0.72)'; ctx.fillRect(c.x-w/2, c.y, w, 12);
    ctx.fillStyle='#e8c46a'; ctx.fillText('E', c.x-w/2+4, c.y+2);
  }
  ctx.restore();
  drawLighting();
  drawHUD();
  drawTouchPad();
  drawTouchButton();
  if(state.dialog) drawDialog();
  if(state.menu) drawMenu();
  drawToasts();
  drawFade();
}

/* ============ LEBEN IM FOODCOURT ============
   Passanten laufen durch, manche stellen sich beim Café-Van an.
   Das Kaffee-Team arbeitet in Acht-Stunden-Schichten, wer frei hat,
   spaziert herum oder sitzt hinter dem Van im Schatten. Runner holen
   Nachschub, wenn etwas ausgeht. */
const foodCrowd = [];                     // Passanten (Foodcourt und Waldbühne)
const foodRunners = [];                   // Leute, die Kisten schleppen
const FOOD_CROWD_MIN = 9;                 // so viele sind mindestens unterwegs
let foodSpawnT = 0;

// Ein- und Ausgänge der Foodcourt-Karte
const FOOD_EXITS = [
  { id:'camp', x:3*TILE,  y:25*TILE+8 },
  { id:'wald', x:15*TILE+8, y:3*TILE }
];
const FOOD_CORNER = { x:15*TILE, y:24*TILE+8 };

// --- Der Café-Van: feste Punkte ---
const VAN = {
  x: 5*TILE, y: 19*TILE, w:78, h:52,
  get base(){ return this.y + this.h; },
  get lukeX(){ return this.x + 21; },              // Mitte der Durchreiche
  get schattenX(){ return this.x + 20; },          // hinter dem Van
  get schattenY(){ return this.y - 16; }
};
// Die Schlange läuft von der Luke nach links weg und biegt dann nach oben ab,
// damit sie nicht den Eingang unten links zustellt.
function queueSpot(i){
  const y0 = VAN.base + 16;
  if(i < 3) return { x: VAN.lukeX - i*13, y: y0 + (i%2?2:0) };
  const j = i - 3;                                  // ab hier geht es nach Norden
  return { x: VAN.lukeX - 39 - Math.min(j,4)*4, y: y0 - 2 - j*12 };
}

const coffee = {
  team: [],            // drei Leute
  queue: [],           // wer ansteht (Spieler steckt als Marker mit drin)
  ziel: 5,             // angestrebte Schlangenlänge
  zielT: 0,            // wann neu ausgewürfelt wird
  serveT: 3,           // bis der Vorderste dran ist
  vorrat: 24,          // Tassen bis Nachschub nötig
  playerIdx: -1,       // wo der Spieler steht (-1 = nicht angestellt)
  nachschub: 0,        // >0: Runner ist unterwegs
  bestellung: null,    // laufendes Hin und Her am Tresen
  ansprache: null,     // jemand aus der Schlange hat dich angesprochen
  gespraechMit: null,  // mit wem gerade geredet wird
  stehZeit: 0,         // wie lange der Spieler schon ansteht
  anspracheCool: 30,   // Ruhe, bis wieder jemand von sich aus redet
  endeAbgenickt: false,// wie das letzte Gespräch ausging
  gespraech: null,     // laufendes Gespräch mit dem Nachbarn
  quatschGenutzt: false // Smalltalk am Tresen pro Bestellung nur einmal
};

const KAFFEE_NAMEN = ['Nuri','Pelle','Sam'];
function buildCoffeeTeam(){
  coffee.team.length = 0;
  const pals = [
    { o:'#4a3a35', h:'#8a4a2f', d:'#6d3722', s:'#e0b088', S:'#c08e66', e:'#2e2430',
      c:'#3f6f8a', k:'#2e5468', p:'#3a3f47', b:'#4a3a2a' },
    { o:'#4a3a35', h:'#2e2833', d:'#1f1a24', s:'#8a5f3f', S:'#6d472c', e:'#2e2430',
      c:'#c95a4a', k:'#a3402f', p:'#474c66', b:'#4a3a2a' },
    { o:'#4a3a35', h:'#d8d0b8', d:'#b3ab92', s:'#d8a878', S:'#b8875a', e:'#2e2430',

      moving:false, animT:Math.random(), frame:0,

    });

}
// Wer hat gerade Schicht? Alle acht Stunden wird gewechselt.
function schichtIndex(){
  const std = (state.clock.day-1)*24 + state.clock.min/60;
  return Math.floor(std/8) % 3;
}
function baristaJetzt(){ return coffee.team[schichtIndex()]; }

// Gewichtete Schlangenlänge: meistens um die fünf, selten leer, oft viel mehr
function wuerfleSchlange(){
  const r = Math.random();
  if(r < 0.06) return 0;                                   // selten mal niemand
  if(r < 0.55) return 3 + Math.floor(Math.random()*5);      // meistens 3-7
  if(r < 0.85) return 8 + Math.floor(Math.random()*5);      // oft deutlich mehr
  return 13 + Math.floor(Math.random()*6);                  // manchmal richtig voll
}
// Ein neuer Gast. Wer sich anstellt, kommt von der Gasse her angelaufen –
// sofort=true setzt ihn direkt auf seinen Platz (beim Betreten der Karte).
function neuerAnsteher(idx, sofort){
  const s = queueSpot(idx||0);
  const start = sofort ? s : { x: s.x + 40 + Math.random()*40, y: s.y + 14 + Math.random()*10 };
  return { pal:randomWandererPal(), gridSet:PLAYER_GRIDS, facing:'up',
           moving:false, animT:Math.random()*2, frame:0,
           x:start.x, y:start.y, chat:null, chatCool:1+Math.random()*6, istSpieler:false };
}
// Beim Betreten der Karte steht schon jemand an – zwischen null und zehn Leuten
function schlangeNeuAufstellen(){
  coffee.queue.length = 0;
  coffee.playerIdx = -1;
  coffee.bestellung = null;
  const n = Math.floor(Math.random()*11);
  for(let i=0;i<n;i++) coffee.queue.push(neuerAnsteher(i, true));
  coffee.ziel = Math.max(n, wuerfleSchlange());
  coffee.zielT = 15+Math.random()*20;
}

// Schickt jemanden aus der Menge zur Schlange. Ist gerade niemand in der Nähe,
// betritt jemand ganz normal über einen Ausgang die Karte und läuft hin.
function schickJemandenZurSchlange(){
  const frei = foodCrowd.filter(p=>!p.zurSchlange && p.pause<=0);
  let wer = null;
  if(frei.length){
    // Am liebsten jemand, der ohnehin schon in der Nähe ist
    frei.sort((a,b)=>Math.hypot(a.x-VAN.lukeX,a.y-VAN.base) - Math.hypot(b.x-VAN.lukeX,b.y-VAN.base));
    wer = frei[0];
  } else {
    spawnFoodPerson();
    wer = foodCrowd[foodCrowd.length-1];
  }
  if(!wer) return;
  wer.zurSchlange = true;
  wer.anmarschNr = ++anmarschZaehler;   // Reihenfolge der Ankommenden
  wer.route = [];                       // das Ziel wird laufend neu bestimmt
}
let anmarschZaehler = 0;

/* --- Passanten --- */
function spawnFoodPerson(){
  const ein = pick(FOOD_EXITS);
  const aus = FOOD_EXITS.find(e=>e.id!==ein.id);
  foodCrowd.push({
    scene:'food',
    x:ein.x+(Math.random()*20-10), y:ein.y+(Math.random()*20-10),
    facing:'down', moving:true, animT:Math.random()*2, frame:0,
    pal:randomWandererPal(), gridSet:PLAYER_GRIDS,
    route: ein.id==='camp'
      ? [{x:FOOD_CORNER.x+(Math.random()*40-20), y:FOOD_CORNER.y+(Math.random()*30-15)}, {x:aus.x, y:aus.y}]
      : [{x:FOOD_CORNER.x+(Math.random()*40-20), y:FOOD_CORNER.y+(Math.random()*30-15)}, {x:aus.x, y:aus.y}],
    speed: 30+Math.random()*20,
    travelT: 0,
    pause: 0,                                   // steht gerade und schaut
    zurSchlange: false,                         // will sich Kaffee holen
    chat: null, chatCool: 2+Math.random()*5
  });
}
function moveFoodPerson(p, dx, dy){
  p.x += dx;
  let box = entBox(p);
  for(const s of foodSolids){
    if(rectsOverlap(box,s)){
      if(dx>0) p.x = s.x - 5; else if(dx<0) p.x = s.x + s.w + 5;
      box = entBox(p);
    }
  }
  p.y += dy;
  box = entBox(p);
  for(const s of foodSolids){
    if(rectsOverlap(box,s)){
      if(dy>0) p.y = s.y - 0.01; else if(dy<0) p.y = s.y + s.h + 7;
      box = entBox(p);
    }
  }
}
function foodCrowdUpdate(dt){
  if(foodCrowd.length < FOOD_CROWD_MIN){
    foodSpawnT -= dt;
    if(foodSpawnT<=0){ foodSpawnT = 0.3+Math.random()*0.8; spawnFoodPerson(); }
  }
  for(let i=foodCrowd.length-1;i>=0;i--){
    const p = foodCrowd[i];
    // Wer sich anstellen will, läuft ans jeweils aktuelle Ende der Schlange
    if(p.zurSchlange){
      const vorDran = foodCrowd.filter(o=>o.zurSchlange && o.anmarschNr < p.anmarschNr).length;
      const s = queueSpot(coffee.queue.length + vorDran);
      const dx=s.x-p.x, dy=s.y-p.y, d=Math.hypot(dx,dy);
      if(d < 5){
        // Angekommen: nahtlos in die Schlange wechseln
        const q = neuerAnsteher(coffee.queue.length, true);
        q.pal=p.pal; q.x=s.x; q.y=s.y;
        coffee.queue.push(q);
        foodCrowd.splice(i,1);
        continue;
      }
      p.moving = true;
      if(Math.abs(dx)>Math.abs(dy)) p.facing = dx>0?'right':'left';
      else                          p.facing = dy>0?'down':'up';
      moveFoodPerson(p, (dx/d)*p.speed*dt, (dy/d)*p.speed*dt);
      p.animT += dt; p.frame = Math.floor(p.animT*7)%4;
      continue;
    }
    if(p.pause>0){ p.pause-=dt; p.moving=false; continue; }
    p.travelT += dt;
    if(p.travelT>90){ foodCrowd.splice(i,1); continue; }
    const wp = p.route[0];
    if(!wp){ foodCrowd.splice(i,1); continue; }
    const dx=wp.x-p.x, dy=wp.y-p.y, d=Math.hypot(dx,dy);
    if(d<8){
      p.route.shift();
      if(!p.route.length){
        foodCrowd.splice(i,1);
      }
      continue;
    }
    p.moving = true;
    if(Math.abs(dx)>Math.abs(dy)) p.facing = dx>0?'right':'left';
    else                          p.facing = dy>0?'down':'up';
    moveFoodPerson(p, (dx/d)*p.speed*dt, (dy/d)*p.speed*dt);
    p.animT += dt; p.frame = Math.floor(p.animT*7)%4;
    // Manche bleiben unterwegs kurz stehen und schauen sich um
    if(Math.random() < 0.12*dt){ p.pause = 1+Math.random()*4; }
  }
}

/* --- Runner: holen Kisten vom Lager zu den Ständen --- */
const RUNNER_LAGER = { x:23*TILE, y:24*TILE };
function spawnRunner(fuerKaffee){
  const ziele = [{x:10*TILE, y:17*TILE+40},{x:22*TILE, y:13*TILE+40},{x:10*TILE, y:10*TILE+40}];
  const ziel = fuerKaffee ? {x:VAN.lukeX, y:VAN.base+6} : pick(ziele);
  foodRunners.push({
    x:RUNNER_LAGER.x, y:RUNNER_LAGER.y, facing:'up', moving:true,
    animT:Math.random(), frame:0, pal:randomWandererPal(), gridSet:PLAYER_GRIDS,
    kiste:true, kaffee:!!fuerKaffee,
    route:[{x:FOOD_CORNER.x, y:FOOD_CORNER.y}, ziel, {x:RUNNER_LAGER.x, y:RUNNER_LAGER.y}],
    speed: 46+Math.random()*14, travelT:0
  });
}
function foodRunnersUpdate(dt){
  for(let i=foodRunners.length-1;i>=0;i--){
    const r = foodRunners[i];
    r.travelT += dt;
    if(r.travelT>120){ foodRunners.splice(i,1); continue; }
    const wp = r.route[0];
    if(!wp){ foodRunners.splice(i,1); continue; }
    const dx=wp.x-r.x, dy=wp.y-r.y, d=Math.hypot(dx,dy);
    if(d<8){
      r.route.shift();
      // Am Ziel angekommen: Kiste abgeben
      if(r.route.length===1){
        r.kiste = false;
        if(r.kaffee){ coffee.vorrat = 24; coffee.nachschub = 0; }
      }
      if(!r.route.length) foodRunners.splice(i,1);
      continue;
    }
    r.moving = true;
    if(Math.abs(dx)>Math.abs(dy)) r.facing = dx>0?'right':'left';
    else                          r.facing = dy>0?'down':'up';
    moveFoodPerson(r, (dx/d)*r.speed*dt, (dy/d)*r.speed*dt);
    r.animT += dt; r.frame = Math.floor(r.animT*7)%4;
  }
  // Ab und zu schickt jemand einen Runner los, auch ohne Anlass
  if(foodRunners.length < 2 && Math.random() < 0.04*dt*60/60){
    if(Math.random()<0.02) spawnRunner(false);
  }
}

// Der Van steht im Weg: wer von hinten nach vorne will (oder umgekehrt),
// geht links außen herum statt zu versuchen, hindurchzulaufen.
function routeUmDenVan(m, ziel){
  const obenAlt = m.y < VAN.y, obenNeu = ziel.y < VAN.y;
  const imWeg = (m.x > VAN.x-10 && m.x < VAN.x+VAN.w+10) ||
                (ziel.x > VAN.x-10 && ziel.x < VAN.x+VAN.w+10);
  if(obenAlt !== obenNeu && imWeg){
    const seite = VAN.x - 18;                 // links am Van vorbei
    return [{x:seite, y:m.y}, {x:seite, y:ziel.y}, ziel];
  }
  return [ziel];
}

/* --- Das Team: Schicht am Van, sonst spazieren oder Pause --- */
function coffeeTeamUpdate(dt){
  const dienst = schichtIndex();
  for(let i=0;i<coffee.team.length;i++){
    const m = coffee.team[i];
    if(i!==dienst && m.modus==='dienst'){
      // Gerade Feierabend: raus aus dem Van, ab in den Schatten
      m.x = VAN.schattenX + (i-1)*15 + (Math.random()*6-3);
      m.y = VAN.schattenY + (i%2?5:0) + (Math.random()*5-2);
      m.modus = 'pause'; m.modusT = 8+Math.random()*14;
      m.route = [];
    }
    if(i===dienst){                       // steht am Tresen
      if(m.modus!=='dienst') toast(m.name+' übernimmt die Schicht am Café-Van.');
      m.modus='dienst'; m.moving=false;
      m.x = VAN.lukeX; m.y = VAN.y + 34;
      m.facing='down';
      continue;
    }
    m.modusT -= dt;
    if(m.modusT<=0){
      // Nach der Pause entweder spazieren oder wieder in den Schatten
      m.modus = Math.random()<0.45 ? 'spazieren' : 'pause';
      m.modusT = 12+Math.random()*30;
      const ziel = m.modus==='spazieren'
        ? { x: 4*TILE+Math.random()*12*TILE, y: 22*TILE+Math.random()*4*TILE }
        : { x: VAN.schattenX + (i-1)*15 + (Math.random()*8-4),
            y: VAN.schattenY + (i%2?5:0) + (Math.random()*6-3) };
      m.route = routeUmDenVan(m, ziel);
    }
    // Der Weg wird Punkt für Punkt abgelaufen
    if(m.route && m.route.length){
      const wp = m.route[0];
      const dx=wp.x-m.x, dy=wp.y-m.y, d=Math.hypot(dx,dy);
      if(d<5){ m.route.shift(); }
      else {
        m.moving=true;
        if(Math.abs(dx)>Math.abs(dy)) m.facing = dx>0?'right':'left';
        else                          m.facing = dy>0?'down':'up';
        moveFoodPerson(m, (dx/d)*38*dt, (dy/d)*38*dt);
        m.animT += dt; m.frame = Math.floor(m.animT*7)%4;
      }
    } else {
      m.moving=false;
      if(m.modus==='pause') m.facing='down';
    }
  }
}

/* --- Die Schlange --- */
function schlangeLaenge(){ return coffee.queue.length; }
function spielerStehtAn(){ return coffee.playerIdx >= 0; }

function coffeeUpdate(dt){
  // Ziel-Länge ab und zu neu würfeln
  coffee.zielT -= dt;
  if(coffee.zielT<=0){ coffee.zielT = 18+Math.random()*26; coffee.ziel = wuerfleSchlange(); }
  // Auffüllen: niemand erscheint aus dem Nichts – es kommt jemand aus der Menge,
  // und wenn gerade niemand da ist, betritt jemand die Karte am Eingang.
  const ohneSpieler = coffee.queue.filter(q=>!q.istSpieler).length;
  const anmarsch = foodCrowd.filter(p=>p.zurSchlange).length;
  if(ohneSpieler + anmarsch < coffee.ziel && Math.random() < 1.3*dt){
    schickJemandenZurSchlange();
  } else if(ohneSpieler > coffee.ziel + 2 && Math.random() < 0.5*dt){
    for(let i=coffee.queue.length-1;i>=0;i--){
      if(!coffee.queue[i].istSpieler){ coffee.queue.splice(i,1); break; }
    }
    if(coffee.playerIdx >= coffee.queue.length) coffee.playerIdx = coffee.queue.length-1;
  }
  // Am Tresen wird bestellt: erst das Hin und Her, dann ist der Gast durch
  if(coffee.queue.length && coffee.vorrat>0){
    const vorne = coffee.queue[0];
    const amPlatz = vorne.istSpieler ||
      (Math.abs(vorne.x-queueSpot(0).x)<3 && Math.abs(vorne.y-queueSpot(0).y)<3);
    if(!coffee.bestellung && amPlatz){ coffee.bestellung = neueBestellung(); }
    if(coffee.bestellung){
      coffee.bestellung.t += dt;
      if(coffee.bestellung.t > 1.15){
        coffee.bestellung.t = 0;
        coffee.bestellung.idx++;
        if(coffee.bestellung.idx >= coffee.bestellung.schritte.length){
          coffee.bestellung = null;
          if(vorne.istSpieler){ spielerDran(); }
          else {
            coffee.queue.shift();
            coffee.vorrat--;
            if(coffee.playerIdx>0) coffee.playerIdx--;
            if(coffee.vorrat<=0 && !coffee.nachschub){ coffee.nachschub=1; spawnRunner(true); }
          }
        }
      }
    }
  } else if(coffee.queue.length && coffee.vorrat<=0){
    coffee.bestellung = null;
    if(!coffee.nachschub){ coffee.nachschub = 1; spawnRunner(true); }
  }
  // Alle an ihren Platz stellen und plaudern lassen
  for(let i=0;i<coffee.queue.length;i++){
    const q = coffee.queue[i];
    const s = queueSpot(i);
    if(q.istSpieler){ player.x = s.x; player.y = s.y; player.facing = i<3 ? 'up' : 'down'; continue; }
    // Nachrücken: normales Gehtempo, kein Ziehen
    const dx=s.x-q.x, dy=s.y-q.y, d=Math.hypot(dx,dy);
    if(d > 0.6){
      const v = Math.min(d, 36*dt);
      q.x += dx/d*v; q.y += dy/d*v;
      q.moving = true; q.animT += dt; q.frame = Math.floor(q.animT*7)%4;
    } else {
      q.x = s.x; q.y = s.y; q.moving = false;
    }
    // Vorne schaut man zum Tresen, weiter hinten nach vorne in die Reihe
    q.facing = i<3 ? 'up' : 'down';
    if(q.chat){ q.chat.t-=dt; if(q.chat.t<=0) q.chat=null; }
    else if(q.chatCool>0) q.chatCool-=dt;
  }
  // Nur wenn der Spieler ansteht, hört er die Gespräche um sich herum
  if(coffee.anspracheCool > 0) coffee.anspracheCool -= dt;
  if(spielerStehtAn()){
    coffee.stehZeit += dt;
    for(let i=0;i<coffee.queue.length;i++){
      const q = coffee.queue[i];
      if(q.istSpieler || q.chat || q.chatCool>0) continue;
      if(Math.abs(i-coffee.playerIdx) > 3) continue;      // nur in Hörweite
      if(Math.random() < 0.5*dt){
        q.chat = { t:2.6, icon:pick(KAFFEE_THEMEN), role:'ask' };
        q.chatCool = 5+Math.random()*8;
      }
    }
    // Ab und zu spricht dich jemand direkt an – dann kann man antworten
    if(coffee.ansprache){
      coffee.ansprache.t -= dt;
      if(coffee.ansprache.t<=0) coffee.ansprache = null;
    } else if(!state.dialog && coffee.stehZeit > 14 && coffee.anspracheCool <= 0
              && Math.random() < 0.02*dt){
      // Selten mal spricht dich jemand von der Seite an
      const nachbarn = [coffee.playerIdx-1, coffee.playerIdx+1]
        .filter(i=>i>=0 && i<coffee.queue.length && !coffee.queue[i].istSpieler);
      if(nachbarn.length){
        const i = pick(nachbarn);
        coffee.ansprache = { idx:i, t:20 };
        starteQueueGespraech(i);
        startDialog('queueTalk1', {breakable:true});
      }
    }
  } else {
    coffee.ansprache = null;
    coffee.stehZeit = 0;
  }
}

  schritte.push({ wer:'gast', icon: pick(['tasse','doppelt']) });

  schritte.push({ wer:'bed',  icon: pick(['geld','karte']) });

/* ============ 8. RAUCH-MECHANIK ============
   Wer zu lange rumsteht, dreht sich automatisch eine. */
function smokeUpdate(dt){
  const sm = state.smoke;
  if(player.moving){
    if(sm.phase==='smoking') finishCig();
    sm.phase='none'; sm.t=0; state.idleSince=0;
    return;
  }
  state.idleSince += dt;
  if(sm.phase==='none' && state.idleSince>=CFG.IDLE_SMOKE_SEC){
    sm.phase='rolling'; sm.t=0;
  } else if(sm.phase==='rolling'){
    sm.t += dt;
    if(sm.t>=CFG.ROLL_SEC){ sm.phase='smoking'; sm.t=0; }
  } else if(sm.phase==='smoking'){
    sm.t += dt;
    if(sm.t>0.6){                       // regelmäßig ein Rauchwölkchen
      sm.t=0;
      particles.push({x:player.x+ (player.facing==='left'?-5:5), y:player.y-11,
        vx:(Math.random()-0.5)*3, vy:-8-Math.random()*4, life:1.6, col:'rgba(200,200,210,0.5)', size:2});
    }
  }
}
function finishCig(){
  if(state.ashtray < CFG.ASH_CAPACITY){
    state.ashtray++;
    toast('Stummel im Taschenascher verstaut ('+state.ashtray+'/'+CFG.ASH_CAPACITY+').');
  } else {
    stubsOnGround.push({ x:player.x+(Math.random()*8-4), y:player.y+1 });
    sympathyAll(-CFG.LITTER_PENALTY);
    toast('Taschenascher voll! Stummel auf den Boden geworfen: -'+deNum(CFG.LITTER_PENALTY)+' Sympathie bei allen.');
  }
}
function particlesUpdate(dt){
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);
}
function fireEmit(dt){
  for(const o of objects){
    if(o.type!=='fire') continue;
    o.emitT -= dt;
    if(o.emitT<=0){
      o.emitT = 0.5+Math.random()*0.4;
      particles.push({x:o.x+(Math.random()*4-2), y:o.base-12,
        vx:(Math.random()-0.5)*2, vy:-10, life:1.4, col:'rgba(120,110,105,0.4)', size:2});
    }
  }
}

/* ============ 9. DIALOGSYSTEM ============
   Ein Dialog ist eine Kette von "Knoten". Jeder Knoten hat einen Sprecher,
   einen Text und weiß, wo es danach weitergeht (next) oder bietet
   Antwortmöglichkeiten (choices) an. */
const DIALOGS = {};

function nodeText(node){
  // Beim aktiven Knoten den einmal festgelegten Text verwenden – sonst würde
  // ein zufälliger text() bei jedem Bildaufbau neu würfeln und flackern.
  const d = state.dialog;
  if(d && d.node===node && d.textFest != null) return d.textFest;
  return typeof node.text==='function' ? node.text() : node.text;
}
function nodeChoices(node){
  if(!node.choices) return null;
  return typeof node.choices==='function' ? node.choices() : node.choices;
}
function resolveNode(ref){ return typeof ref==='string' ? DIALOGS[ref] : ref; }

// Baut aus einer einfachen Liste von Zeilen eine Dialog-Kette
function lin(arr){
  let next=null;
  for(let i=arr.length-1;i>=0;i--){
    const n=Object.assign({},arr[i]); n.next=next; next=n;
  }
  return next;
}

function startDialog(ref, opts){
  state.dialog = { node:null, chars:0, choiceIdx:0, choiceCount:0,
                   inputActive:false, breakable: !!(opts&&opts.breakable) };
  interactQueued = false;
  state.idleSince = 0;
  setNode(resolveNode(ref));
}
function setNode(node){
  const d=state.dialog;
  d.node=node; d.chars=0; d.choiceIdx=0; d.choiceCount=0; d.inputActive=false;
  d.textFest=null;
  if(node.onEnter){
    const redirect = node.onEnter();
    if(redirect){ setNode(resolveNode(redirect)); return; }
  }
  d.textFest = typeof node.text==='function' ? node.text() : node.text;
  if(node.input){ d.inputActive=true; showFriendInput(); }
}
function goNext(ref){
  if(typeof ref === 'function') ref = ref();     // Ziel darf sich zur Laufzeit ergeben
  if(ref==null) endDialog();
  else setNode(resolveNode(ref));
}
function advanceDialog(){
  const d=state.dialog; if(!d) return;
  if(d.inputActive) return;                        // erst Namen eintippen
  const full=nodeText(d.node);
  if(d.chars < full.length){ d.chars = full.length; return; }  // Text sofort komplett zeigen
  const ch = nodeChoices(d.node);
  if(ch && ch.length){
    const c = ch[clamp(d.choiceIdx,0,ch.length-1)];
    if(c.fx) c.fx();
    state.social = clamp(state.social-2, 0, 100);
    goNext(c.next);
    return;
  }
  state.social = clamp(state.social-1.5, 0, 100);
  goNext(d.node.next);
}
function endDialog(){
  const br = state.dialog && state.dialog.breakable;
  state.dialog = null;
  hideFriendInput();
  if(br) maybeBreakGlasses();
}

const ABNICK_ANTWORTEN = ['Mhm.', 'Ja, schon.', 'Kann sein.', 'Hm, ja.'];
const ABNICK_REAKTION  = ['Mhm.', 'Ja...', 'Tja.', 'Hm.'];

function starteQueueGespraech(idx){
  coffee.gespraech = {
    idx,                                   // wer neben dir redet
    thema: Math.floor(Math.random()*QUEUE_GESPRAECHE.length),
    schritt: 0,
    abgenickt: 0,
    antwort: ''
  };
}
function gespraechZeile(){
  const g = coffee.gespraech;
  if(!g) return null;
  const th = QUEUE_GESPRAECHE[g.thema];
  return th.zeilen[g.schritt] || null;
}
function gespraechPartner(){
  const g = coffee.gespraech;
  if(!g) return null;
  return coffee.queue[g.idx] || null;
}
// Kleine Sprechblase über dem Gegenüber, passend zum Thema
function gespraechBlase(icon){
  const q = gespraechPartner();
  if(q && !q.istSpieler) q.chat = { t:2.8, icon: icon || pick(KAFFEE_THEMEN), role:'ask' };
}

DIALOGS.queueTalk1 = { who:'sys', name:'Neben dir',
  text(){ const z = gespraechZeile(); return z ? z.text : '...'; },
  onEnter(){ gespraechBlase(); },
  choices(){
    const z = gespraechZeile();
    if(!z) return [{ t:'...', next:'queueTalkEnde' }];
    const c = z.antworten.map((a,i)=>({ t:a.t, next:'queueTalk2',
      fx(){ coffee.gespraech.antwort = a.ant; coffee.gespraech.nurGenickt = false; } }));
    c.push({ t: pick(ABNICK_ANTWORTEN), next:'queueTalk2',
      fx(){ coffee.gespraech.antwort = pick(ABNICK_REAKTION);
            coffee.gespraech.abgenickt++; coffee.gespraech.nurGenickt = true; } });
    return c;
  }};

  next(){
    const g = coffee.gespraech;
    if(!g) return null;
    if(g.abgenickt >= 2) return 'queueTalkEnde';      // zweimal abgenickt: es schläft ein

function veraTalk(){
  const s = state.sympathy.find(s=>s.id==='vera');
  if(s && s.name==='???') s.name='Vera';
  if(!state.flags.veraMet){
    state.flags.veraMet = true;
    startDialog('veraFirst1', {breakable:true});
    return;
  }
  // Holz abliefern
  if(getItem('wood') && !state.flags.woodDone){
    startDialog('veraWood1', {breakable:true});
    return;
  }
  // Werkzeug abliefern
  if(getItem('tools') && !state.flags.bandGot){
    startDialog('veraGive1', {breakable:true});
    return;
  }
  if(!state.flags.woodDone){
    startDialog(lin([{ who:'vera', text: pick([
      'Das Materiallager liegt im Süden, hinter den Camps. Bretter. Ein Stapel reicht erstmal.',
      'Ich kann hier nicht weg, sonst würde ich selbst fahren.',
      'Je eher das Holz hier ist, desto eher steht der Bühnenboden.'
    ]) }]), {breakable:true});
    return;
  }
  if(!state.flags.bandGot){
    startDialog(lin([{ who:'vera', text: pick([
      'Camp Süd. Pinkes Zelt. Die Kiste steht daneben.',
      'Momo weiß Bescheid. Sag einfach, du kommst von mir.',
      'Ohne Werkzeug komme ich hier keinen Meter weiter.'
    ]) }]), {breakable:true});
    return;
  }
  startDialog(lin([{ who:'vera', text: pick([
    'Der Aufbau läuft wieder. Heute Abend wird das hier laut.',
    'Wenn du backstage gehst: Die Kiste mit meinem Namen bleibt zu.',
    'Nächste Schicht fängt gleich an. Bleib in der Nähe.'
  ]) }]), {breakable:true});
}

/* --- Kobi: Chillout-Mission (Phase 1) --- */
function highFactor(){
  // 0 = nüchtern, 1 = volles High. Blendet in 2 s ein und über
  // die letzten 4 s sanft aus – alle Effekte hängen an diesem Wert.
  if(state.high.t<=0) return 0;
  const elapsed = state.high.dur - state.high.t;
  return Math.min(1, elapsed/2, state.high.t/4);
}
function startHigh(){
  state.high.t = CFG.HIGH_DURATION_SEC;
  state.high.dur = CFG.HIGH_DURATION_SEC;
  state.flags.kobiJointDone = true;
  addSympathy('kobi', 1);
  state.journal.memories.push('Mit Kobi geraucht: warm, weich, alles ganz entspannt.');
}
function kobiTalk(){
  const s = state.sympathy.find(s=>s.id==='kobi');
  if(s && s.name==='???') s.name='Kobi';           // Name aufdecken
  if(state.high.t>0){
    // Während des Highs: entspannte Sprüche
    startDialog(lin([{ who:'kobi', text: pick([
      'Siehst du die Wolke da? Sieht aus wie ein Dixi-Klo. Verrückt.',
      'Alles gut bei dir? Bei mir ist alles guuut.',
      'Psst... hörst du das? Der Bass vom Soundcheck. Wie ein Herzschlag.',
      'Bleib ruhig noch ein bisschen sitzen. Die Welt rennt nicht weg.'
    ]) }]), {breakable:true});
  } else if(!state.flags.kobiJointDone){
    startDialog('kobiOffer1', {breakable:true});
  } else if(!state.flags.kobiCalmed){
    // Phase 2: Bad Trip – ernster Moment, hier bricht keine Brille
    state.flags.kobiBadTrip = true;
    startDialog('btStart', {breakable:false});
  } else {
    startDialog(lin([{ who:'kobi', text: pick([
      'Hey! Alles wieder klar bei mir. Danke nochmal, wirklich.',
      'Nächstes Mal: weniger, langsamer, und nur wenn der Kopf schon entspannt ist.',
      'Wasser? Hab jetzt immer eins dabei. Willst du auch einen Schluck?'
    ]) }]), {breakable:true});
  }
}

  // Wie highFactor, aber: 3 s Einblendung, 6 s Ausblendung
  if(state.trip.t<=0) return 0;
  const elapsed = state.trip.dur - state.trip.t;
  return Math.min(1, elapsed/3, state.trip.t/6);
}

    ctx.fillStyle='#7a3f1e';
    ctx.fillRect(x-6,y-9,3,6); ctx.fillRect(x-5,y-11,3,4);   // buschiger Schwanz

    ctx.fillStyle='#e8d9b5'; ctx.fillRect(x-3,y-3,3,2);      // heller Bauch
    ctx.fillStyle='#2e2430'; ctx.fillRect(x+3,y-6,1,1);      // Auge
  } else if(a.kind==='vogel'){
    const by=y+Math.round(Math.sin(state.time*3+a.seed)*1.5)-2;   // hüpft leicht
    ctx.fillStyle='#4f8fbf';
    ctx.fillRect(x-3,by-4,6,4);                              // Körper
    ctx.fillRect(x+2,by-6,3,3);                              // Kopf
    ctx.fillStyle='#3a6f99'; ctx.fillRect(x-4,by-3,3,2);     // Flügel
    ctx.fillStyle='#e8944a'; ctx.fillRect(x+5,by-5,2,1);     // Schnabel
    ctx.fillStyle='#2e2430'; ctx.fillRect(x+3,by-5,1,1);     // Auge
    ctx.fillStyle='#5d5346'; ctx.fillRect(x-1,by,1,2); ctx.fillRect(x+1,by,1,2);  // Beine
  } else {
    ctx.fillStyle='#c9602f';
    ctx.fillRect(x-5,y-5,8,5);                               // Körper
    ctx.fillRect(x+2,y-7,4,4);                               // Kopf
    ctx.fillRect(x+3,y-9,1,2); ctx.fillRect(x+5,y-9,1,2);    // Ohren
    ctx.fillRect(x-7,y-5,3,3);                               // Schwanz

    ctx.fillRect(x-8,y-4,3,2);                               // weiße Schwanzspitze

  ctx.globalAlpha=1;

/* --- Ausgänge & Wanderer (Hintergrund-NPCs) ---
   Drei Ausgänge (Baumlücken) am Kartenrand. Jeder Wanderer kommt aus
   einem Ausgang und läuft direkt zu einem ANDEREN – über 1–2 leicht
   versetzte Zwischenpunkte, damit nicht alle dieselbe Linie laufen.
   Der Bestand wird konstant bei WANDERER_MIN gehalten. */
const EXITS = [
  { id:'nord',    x:328, y: 22 },   // oben
  { id:'sued',    x:232, y:538 },   // unten
  { id:'suedost', x:648, y:538 }    // unten rechts, nahe Stellas Camp
];
const WANDERER_MIN = 10;
const wanderers = [];
let wandererRespawnT = 0;

// Würfelt ein Aussehen aus den Erstellungs-Paletten zusammen
function randomWandererPal(){
  const s=pick(SKINS), h=pick(HAIRS), o=pick(OUTFITS);
  return { o:'#4a3a35', h:h.h, d:h.d, s:s.s, S:s.S, e:'#2e2430',
           c:o.c, k:o.k, p:pick(['#474c66','#5d5346','#3f4457','#6d4a2f']), b:'#6d4a2f' };
}
// Sucht einen freien Fleck in der Nähe eines Punkts
function freeSpotNear(x,y){
  for(let tries=0; tries<8; tries++){
    const px=x+(Math.random()*40-20), py=y+(Math.random()*40-20);
    if(px<40||py<40||px>MAPW*TILE-40||py>MAPH*TILE-40) continue;
    if(solids.some(s=>rectsOverlap({x:px-5,y:py-7,w:10,h:7},s))) continue;
    return {x:px,y:py};
  }
  return null;
}
// Baut die Route: 1–2 seitlich versetzte Zwischenpunkte, dann der Ziel-Ausgang
function buildRoute(entry,dest){
  const route=[];
  const n=1+Math.floor(Math.random()*2);
  const dx=dest.x-entry.x, dy=dest.y-entry.y, len=Math.hypot(dx,dy)||1;
  for(let k=1;k<=n;k++){
    const t=k/(n+1);
    const off=Math.random()*160-80;                        // quer zur Laufrichtung
    const p=freeSpotNear(lerp(entry.x,dest.x,t)-dy/len*off,
                         lerp(entry.y,dest.y,t)+dx/len*off);
    if(p) route.push(p);
  }
  route.push({x:dest.x, y:dest.y});
  return route;
}
// Jede Figur bekommt Vorlieben: zwei Dinge, die sie mag, eines, das sie nicht mag.
// Dadurch reagieren dieselben Leute immer gleich auf dasselbe Thema.
function rollTastes(){
  const pool = CHAT_TOPICS.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return { mag: pool.slice(0,2), magNicht: pool.slice(2,3) };
}

/* ============ KLEINE GESPRÄCHE ZWISCHEN NPCs ============
   Wer sich zufällig begegnet, bleibt manchmal kurz stehen und plaudert.
   Über den Köpfen ploppen Icons auf: einer bringt ein Thema, der andere
   reagiert je nach Geschmack mit Herz, bösem Blick, Lachen oder Fragezeichen. */
const CHAT = {
  RADIUS: 34,       // ab dieser Nähe gilt es als Begegnung
  CHANCE: 0.3,      // 30% der Begegnungen werden ein Gespräch
  DUR: 3.2,         // wie lange geplaudert wird
  REPLY_AT: 1.4,    // ab wann die Antwort erscheint
  COOLDOWN: 8,      // danach hat die Figur erstmal genug
  CHECK: 0.4        // Prüfintervall
};
let chatCheckT = 0;

// Stehende NPCs, die mitplaudern dürfen (nicht mitten in ihrer Mission)
function chatEligibleNpcs(){
  return npcs.filter(n=>{
    if(n.id==='kobi'  && state.flags.kobiBadTrip  && !state.flags.kobiCalmed)   return false;
    if(n.id==='tomas' && state.flags.tomasBadTrip && !state.flags.tomasGrounded) return false;
    return true;
  });
}
// Reaktion aus dem Geschmack ableiten
function reactionFor(who, topic){
  const t = who.tastes;
  if(!t) return pick(['lach','frage','ausruf']);
  if(t.mag.includes(topic))      return 'herz';
  if(t.magNicht.includes(topic)) return 'boese';
  return pick(['lach','frage','ausruf','lach']);
}
// Ein Gespräch zwischen zwei Figuren starten
function startChat(a, b){
  const topic = pick(CHAT_TOPICS);
  a.chat = { t:CHAT.DUR, icon:topic, role:'ask',   partner:b };
  b.chat = { t:CHAT.DUR, icon:reactionFor(b,topic), role:'reply', partner:a };
  a.chatCool = b.chatCool = CHAT.COOLDOWN;
  // zueinander schauen
  const dx = b.x-a.x, dy = b.y-a.y;
  if(Math.abs(dx)>Math.abs(dy)){ a.facing = dx>0?'right':'left'; b.facing = dx>0?'left':'right'; }
  else                         { a.facing = dy>0?'down':'up';    b.facing = dy>0?'up':'down'; }
}
// Läuft gerade ein Gespräch? Dann steht die Figur still.
function isChatting(e){ return e.chat && e.chat.t>0; }

function chatsUpdate(dt){
  // laufende Gespräche herunterzählen
  for(const w of wanderers){
    if(w.chat){ w.chat.t-=dt; if(w.chat.t<=0) w.chat=null; }
    if(w.chatCool>0) w.chatCool-=dt;
  }
  for(const n of npcs){
    if(n.chat){ n.chat.t-=dt; if(n.chat.t<=0) n.chat=null; }
    if(n.chatCool>0) n.chatCool-=dt; else if(n.chatCool===undefined) n.chatCool=0;
    if(!n.tastes) n.tastes = rollTastes();
  }
  // nur alle CHAT.CHECK Sekunden nach neuen Begegnungen suchen
  chatCheckT -= dt;
  if(chatCheckT>0) return;
  chatCheckT = CHAT.CHECK;
  const frei = e => !isChatting(e) && (e.chatCool||0)<=0;
  // Wanderer untereinander
  for(let i=0;i<wanderers.length;i++){
    const a=wanderers[i];
    if(!frei(a)) continue;
    for(let j=i+1;j<wanderers.length;j++){
      const b=wanderers[j];
      if(!frei(b)) continue;
      if(Math.hypot(a.x-b.x, a.y-b.y) < CHAT.RADIUS){
        if(Math.random() < CHAT.CHANCE) startChat(a,b);
        break;
      }
    }
  }
  // Wanderer treffen stehende NPCs
  for(const n of chatEligibleNpcs()){
    if(!frei(n)) continue;
    for(const w of wanderers){
      if(!frei(w)) continue;
      if(Math.hypot(n.x-w.x, n.y-w.y) < CHAT.RADIUS){
        if(Math.random() < CHAT.CHANCE) startChat(w,n);
        break;
      }
    }
  }
}

/* --- Sprechblase über dem Kopf; nachts leuchtet sie leicht --- */
// Eine Sprechblase an einer festen Stelle, unabhängig von einer Figur
function drawBubbleAt(x, y, iconName, alpha){
  const icon = CHAT_ICONS[iconName];
  if(!icon) return;
  const bx = Math.round(x)-6, by = Math.round(y)-6;
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha==null?1:alpha));
  const d = darkness();
  if(d > 0.15){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(bx+6,by+6,1, bx+6,by+6,18);
    g.addColorStop(0,'rgba(255,235,190,'+(0.30*d).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,220,160,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx+6,by+6,18,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='#5a4632'; ctx.fillRect(bx-1,by-1,15,15);
  ctx.fillStyle='#fdf3dc'; ctx.fillRect(bx,by,13,13);
  ctx.fillStyle='#5a4632'; ctx.fillRect(bx+5,by+13,3,2); ctx.fillRect(bx+6,by+15,2,1);
  ctx.fillStyle='#fdf3dc'; ctx.fillRect(bx+5,by+13,2,1);
  icon(bx+2, by+2);
  ctx.restore();
}

function drawChatBubble(e){
  const c = e.chat;
  if(!c || c.t<=0) return;
  // Die Antwort erscheint etwas später als die Frage
  if(c.role==='reply' && c.t > CHAT.DUR-CHAT.REPLY_AT) return;
  const icon = CHAT_ICONS[c.icon];
  if(!icon) return;
  // sanftes Auf- und Abblenden
  const age = CHAT.DUR - c.t;
  let a = 1;
  if(age < 0.18) a = age/0.18;
  else if(c.t < 0.4) a = c.t/0.4;
  const bob = Math.sin(state.time*3 + e.x)*0.8;
  const bx = Math.round(e.x) - 6, by = Math.round(e.y) - 30 + Math.round(bob);
  ctx.save();
  ctx.globalAlpha = a;
  const d = darkness();
  if(d > 0.15){   // nachts ein warmer Schein, damit die Blase nicht verschwindet
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(bx+6,by+6,1, bx+6,by+6,18);
    g.addColorStop(0,'rgba(255,235,190,'+(0.30*d*a).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,220,160,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx+6,by+6,18,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // Blase
  ctx.fillStyle='#5a4632'; ctx.fillRect(bx-1,by-1,15,15);
  ctx.fillStyle='#fdf3dc'; ctx.fillRect(bx,by,13,13);
  ctx.fillStyle='#5a4632'; ctx.fillRect(bx+5,by+13,3,2); ctx.fillRect(bx+6,by+15,2,1);
  ctx.fillStyle='#fdf3dc'; ctx.fillRect(bx+5,by+13,2,1);
  icon(bx+2, by+2);
  ctx.restore();
}

function spawnWanderer(){
  const entry=pick(EXITS);
  const dest=pick(EXITS.filter(e=>e.id!==entry.id));       // immer ein anderer Ausgang
  wanderers.push({
    x:entry.x+(Math.random()*24-12), y:entry.y,
    facing:'down', moving:true, animT:Math.random()*2, frame:0,
    pal:randomWandererPal(), gridSet:PLAYER_GRIDS,
    entry:entry.id, dest:dest.id,
    route:buildRoute(entry,dest),
    travelT:0, stuckT:0,
    tastes: rollTastes(),
    chat: null, chatCool: 2+Math.random()*4,
    speed: 34+Math.random()*18                             // jeder trödelt anders
  });
}
// Schlanke Kollision nur gegen feste Objekte – Randwände gelten hier nicht,
// damit Wanderer die Karte durch die Ausgänge betreten und verlassen können.
function moveWanderer(w, dx, dy){
  w.x += dx;
  let box = entBox(w);
  for(const s of solids){
    if(rectsOverlap(box,s)){
      if(dx>0) w.x = s.x - 5; else if(dx<0) w.x = s.x + s.w + 5;
      box = entBox(w);
    }
  }
  w.y += dy;
  box = entBox(w);
  for(const s of solids){
    if(rectsOverlap(box,s)){
      if(dy>0) w.y = s.y - 0.01; else if(dy<0) w.y = s.y + s.h + 7;
      box = entBox(w);
    }
  }
}
function wanderersUpdate(dt){
  // Nachschub, wenn der Bestand unter das Minimum fällt
  // (kurzes Intervall: beim Durchgangsverkehr despawnen oft mehrere fast gleichzeitig)
  if(wanderers.length<WANDERER_MIN){
    wandererRespawnT-=dt;
    if(wandererRespawnT<=0){ wandererRespawnT=0.25+Math.random()*0.5; spawnWanderer(); }
  }
  for(let i=wanderers.length-1;i>=0;i--){
    const w=wanderers[i];
    // Wer gerade plaudert, bleibt stehen (Plauderzeit zählt nicht als Wegzeit)
    if(isChatting(w)){ w.moving=false; continue; }
    // Failsafe: Wer nach 60 s immer noch unterwegs ist, hat eben
    // abseits der Kamera einen anderen Weg gefunden.
    w.travelT+=dt;
    if(w.travelT>60){ wanderers.splice(i,1); continue; }
    const wp=w.route[0];
    if(!wp){ wanderers.splice(i,1); continue; }
    const dx=wp.x-w.x, dy=wp.y-w.y, dist=Math.hypot(dx,dy);
    if(dist<6){
      w.route.shift();
      if(!w.route.length){ wanderers.splice(i,1); }        // Ziel-Ausgang erreicht
      continue;
    }
    w.moving=true;
    const vx=dx/dist, vy=dy/dist;
    w.facing = Math.abs(vx)>Math.abs(vy) ? (vx>0?'right':'left') : (vy>0?'down':'up');
    const ox=w.x, oy=w.y;
    moveWanderer(w, vx*w.speed*dt, vy*w.speed*dt);
    // Steckt er fest (Zelt/Baum im Weg)? Losrütteln und notfalls
    // die Zwischenpunkte überspringen (direkt Richtung Ausgang).
    if(Math.hypot(w.x-ox, w.y-oy) < w.speed*dt*0.3){
      w.stuckT+=dt;
      if(w.stuckT>0.7){
        w.stuckT=0;
        w.x+=(Math.random()-0.5)*16; w.y+=(Math.random()-0.5)*16;
        if(w.route.length>1) w.route=[w.route[w.route.length-1]];
      }
    } else w.stuckT=0;
    w.animT+=dt; w.frame=Math.floor(w.animT*7)%4;
  }
}
// Startbestand: 10 Wanderer, bereits mitten auf ihren Wegen verteilt
// (als wäre der Durchgangsverkehr schon eine Weile im Gange)
function seedWanderers(){
  wanderers.length=0;
  wandererRespawnT=0;
  for(let i=0;i<WANDERER_MIN;i++){
    spawnWanderer();
    const w=wanderers[wanderers.length-1];
    const entry=EXITS.find(e=>e.id===w.entry), dest=EXITS.find(e=>e.id===w.dest);
    const t=0.15+Math.random()*0.7;
    const p=freeSpotNear(lerp(entry.x,dest.x,t), lerp(entry.y,dest.y,t));
    if(p){ w.x=p.x; w.y=p.y; }
    w.chatCool = Math.random()*6;                          // nicht alle gleichzeitig loslegen
    w.route=[w.route[w.route.length-1]];                   // nur noch das Ziel ansteuern
  }
}
